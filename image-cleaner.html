<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="brokr-theme.css"/>

<meta charset="UTF-8">
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Editor de imágenes — Broquer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);min-height:100vh}

.main{max-width:var(--page-max, 760px);margin:0 auto;padding:20px var(--pad-x, 36px) 80px}

/* Drop zone */
.drop-zone{border:2px dashed var(--line-2);border-radius:var(--r);background:var(--paper-2);padding:32px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--sky-blue);background:var(--shell)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{width:48px;height:48px;background:var(--sky-navy);border-radius:var(--r);margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.drop-icon svg{width:28px;height:28px;stroke:white;fill:none}
.drop-title{font-size:var(--fs-sm);font-weight:700;color:var(--ink);margin-bottom:4px}
.drop-hint{font-size:var(--fs-xs);color:var(--mute)}
.drop-types{font-size:var(--fs-caption);color:var(--mute-3);margin-top:5px}

/* Prompt box */
.prompt-box{background:var(--bone);border-radius:var(--r);box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.05);padding:16px 18px;margin:14px 0 0;display:none}
.prompt-label{font-size:var(--fs-caption);font-weight:700;color:var(--mute);letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ai-badge{background:var(--sky-navy-mid);color:white;font-size:var(--fs-caption);font-weight:700;padding:2px 8px;border-radius:var(--r-sm);letter-spacing:.3px}
.prompt-textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:var(--fs-xs);font-family:var(--font-sans);color:var(--ink);resize:vertical;min-height:68px;outline:none;transition:border-color .2s;line-height:1.5;background:var(--bone)}
.prompt-textarea:focus{border-color:var(--sky-blue);background:white;box-shadow:0 0 0 3px var(--forest-soft)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.preset-btn{background:var(--bone);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;font-size:var(--fs-caption);font-weight:600;color:var(--mute);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--font-sans)}
.preset-btn:hover{border-color:var(--sky-blue);color:var(--sky-blue);background:var(--forest-soft)}
.preset-btn.active{border-color:var(--sky-blue);color:var(--sky-blue);background:var(--forest-soft)}
.prompt-hint{font-size:var(--fs-caption);color:var(--mute-3);margin-top:8px;line-height:1.5}

/* Action bar */
.action-bar{display:flex;align-items:center;justify-content:space-between;margin:14px 0;flex-wrap:wrap;gap:8px}
.count-badge{font-size:var(--fs-xs);color:var(--mute);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r);padding:10px 16px;font-size:var(--fs-xs);font-weight:600;font-family:var(--font-sans);cursor:pointer;transition:all .2s;white-space:nowrap;border:none}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--sky-navy-mid);color:white}
.btn-primary:hover{background:var(--sky-navy)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:var(--bone);color:var(--sky-blue);border:1.5px solid var(--line-2)}
.btn-outline:hover{background:var(--forest-soft);border-color:var(--sky-blue)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--bone);color:var(--danger);border:1.5px solid var(--danger-soft)}
.btn-facebook{background:var(--brand-facebook);color:white}
.btn-facebook:hover{background:var(--brand-facebook-press)}
.btn-facebook:disabled{opacity:.5;cursor:not-allowed}
.btn-danger:hover{background:var(--danger-soft)}
/* Menú "Utilizar en…" — tres destinos, un solo botón. Antes eran dos botones
   sueltos en la barra y cada destino nuevo la alargaba más. */
.usar-wrap{position:relative;display:inline-flex}
.usar-menu{position:absolute;bottom:calc(100% + 6px);right:0;z-index:40;min-width:210px;background:var(--bone);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:4px;display:none}
.usar-menu.is-open{display:block}
.usar-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;background:none;border:0;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;color:var(--sky-navy-mid)}
.usar-item:hover{background:var(--bone)}
.usar-item svg{flex-shrink:0;width:15px;height:15px}

.action-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* Download buttons group — hidden until processing done */
.dl-group{display:none;flex-wrap:wrap;gap:8px}

/* Selection mode banner */
.sel-banner{background:var(--forest-soft);border:1.5px solid var(--line-2);border-radius:var(--r);padding:10px 16px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sel-banner-text{font-size:var(--fs-xs);font-weight:600;color:var(--sky-blue-press)}
.sel-banner-actions{display:flex;gap:8px}

/* Progress bar */
.progress-wrap{background:var(--line);border-radius:var(--r-pill);height:6px;overflow:hidden;margin-bottom:14px;display:none}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--sky-navy-mid),var(--sky-blue));border-radius:var(--r-pill);width:0;transition:width .3s}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* Card */
.card{background:var(--bone);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.card.selected{border-color:var(--sky-blue);box-shadow:0 0 0 2px var(--sky-blue)}
.card-name{padding:10px 14px;font-size:var(--fs-xs);font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--bone)}
.card-imgs{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card-img-wrap{position:relative;overflow:hidden;background:var(--bone)}
.card-img-wrap img{width:100%;height:220px;object-fit:cover;display:block}
.card-img-label{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:white;font-size:var(--fs-caption);font-weight:700;padding:2px 7px;border-radius:var(--r-sm);letter-spacing:.5px}
.card-footer{padding:10px 14px;display:flex;align-items:center;gap:8px}
.card-status{font-size:var(--fs-caption);color:var(--mute-3);flex:1;font-weight:500}
.card-status.ok{color:var(--success);font-weight:600}
.card-status.err{color:var(--danger);font-weight:600}
.card-status.loading{color:var(--sky-blue);font-weight:600}
.btn-dl-one{background:var(--sky-blue);color:white;border:none;border-radius:var(--r-sm);padding:6px 12px;font-size:var(--fs-caption);font-weight:700;cursor:pointer;display:none;align-items:center;gap:4px;transition:opacity .2s;font-family:var(--font-sans)}
.btn-dl-one:hover{opacity:.85}
.btn-dl-one svg{width:12px;height:12px;stroke:white;fill:none}

/* Selection checkbox overlay */
.card-checkbox{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:var(--r-sm);border:2px solid white;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;z-index:10}
.card-checkbox.checked{background:var(--sky-blue);border-color:var(--sky-blue)}
.card-checkbox svg{width:13px;height:13px;stroke:white;fill:none;opacity:0;transition:opacity .15s;pointer-events:none}
.card-checkbox.checked svg{opacity:1}
.sel-mode .card-checkbox{display:flex}
.sel-mode .card{cursor:pointer}

/* Empty state */
.empty{display:none;text-align:center;padding:40px 20px;color:var(--mute-3);font-size:var(--fs-sm)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sky-navy);color:white;padding:10px 20px;border-radius:var(--r);font-size:var(--fs-xs);font-weight:600;font-family:var(--font-sans);transition:transform .3s;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:500px){
  .main{padding:14px 12px 80px}
  .card-imgs{grid-template-columns:1fr}
  .card-img-wrap img{height:180px}
  .btn{padding:9px 12px;font-size:var(--fs-xs)}
}
</style>
</head>
<body data-app="image-cleaner">


<div class="main">

  <!-- Drop zone -->
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*" multiple>
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 14l4-4 3 3 4-5 5 6"/><circle cx="8.5" cy="9.5" r="1.5"/></svg>
    </div>
    <div class="drop-title">Arrastra tus fotos aquí</div>
    <div class="drop-hint">o toca para seleccionar desde tu galería</div>
    <div class="drop-types">JPG, PNG, WEBP · máx. 20 fotos a la vez</div>
  </div>

  <!-- Prompt box -->
  <div class="prompt-box" id="prompt-box">
    <textarea class="prompt-textarea" id="prompt-input" placeholder="Describe qué quieres hacer con las fotos. Ej: Elimina todos los muebles no fijos, mejora la iluminación y hazlo ver como foto profesional de bienes raíces vacío."></textarea>
    <div class="presets">
      <button class="preset-btn" onclick="applyPreset(this,'Foto profesional de bienes raíces: mejora iluminación, contraste y nitidez. Deja el espacio limpio y atractivo.')">Mejorar calidad</button>
      <button class="preset-btn" onclick="applyPreset(this,'Elimina todos los muebles no fijos: camas, sofás, sillas, mesas, alfombras, cortinas, lámparas y decoraciones. Conserva paredes, pisos, techos, ventanas y puertas. Muestra el cuarto vacío y limpio.')">Retirar muebles</button>
      <button class="preset-btn" onclick="applyPreset(this,'Transforma esta foto en una imagen profesional de bienes raíces: cuarto vacío, sin muebles, excelente iluminación, colores vivos y balanceados, listo para publicar.')">Cuarto vacío profesional</button>
      <button class="preset-btn" onclick="applyPreset(this,'Mejora esta foto de jardín o exterior: cielo más azul, vegetación más verde y vibrante, iluminación natural cálida, aspecto de día soleado.')">Exterior vibrante</button>
      <button class="preset-btn" onclick="applyPreset(this,'Corrige la iluminación: aumenta brillo en zonas oscuras, reduce brillos, mejora el balance de blancos para que la foto luzca natural y profesional.')">Corregir iluminación</button>
    </div>
    <div class="prompt-hint">Deja el campo vacío para usar solo mejoras automáticas (sin IA generativa).</div>
  </div>

  <!-- Action bar -->
  <div class="action-bar" id="action-bar" style="display:none">
    <span class="count-badge" id="count-badge">0 fotos</span>
    <div class="action-right">
      <!-- Download group (shown after processing) -->
      <div class="dl-group" id="dl-group">
        <button class="btn btn-outline" id="btn-dl-all" onclick="downloadAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar todas
        </button>
        <button class="btn btn-outline" id="btn-dl-selected" onclick="downloadSelected()">
          <svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Descargar selección
        </button>
        <div class="usar-wrap">
          <button class="btn btn-primary" id="btn-usar" onclick="toggleUsarMenu()" aria-haspopup="true" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><polyline points="8 7 12 3 16 7"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Utilizar en…
          </button>
          <div class="usar-menu" id="usar-menu" role="menu">
            <button class="usar-item" type="button" role="menuitem" onclick="useInFicha()">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><rect x="7" y="12" width="10" height="6" rx="1"/><path d="M7 17l3-3 2 2 2-3 3 3"/></svg>
              Ficha técnica
            </button>
            <button class="usar-item" type="button" role="menuitem" onclick="useInFacebookAds()">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.269h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
              Facebook Ads
            </button>
            <button class="usar-item" type="button" role="menuitem" onclick="useInVideo()">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10.5l5-3v9l-5-3"/></svg>
              Video
            </button>
          </div>
        </div>
      </div>
      <!-- Process button -->
      <button class="btn btn-primary" id="btn-clean" onclick="cleanAll()">
        <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/><path d="M19 3l1.5 3.5M21 9l-1.5.5"/></svg>
        Editar fotos
      </button>
    </div>
  </div>

  <!-- Selection banner -->
  <div class="sel-banner" id="sel-banner">
    <span class="sel-banner-text" id="sel-banner-text">Selecciona las imágenes a descargar</span>
    <div class="sel-banner-actions">
      <button class="btn btn-outline" style="padding:7px 12px;font-size:var(--fs-xs)" onclick="selectAll()">Seleccionar todas</button>
      <button class="btn btn-primary" style="padding:7px 12px;font-size:var(--fs-xs)" id="btn-confirm-sel" onclick="downloadSelected()">Descargar (0)</button>
      <button class="btn btn-danger" style="padding:7px 12px;font-size:var(--fs-xs)" onclick="cancelSelection()">Cancelar</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No hay fotos. Sube imágenes para comenzar.</div>

</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = window.API_BASE || 'https://api.broquer.app';

let files = [];
let results = [];
let cleaned = false;
let selectionMode = true; // siempre activo: el usuario puede seleccionar cualquier imagen procesada cuando quiera
let selectedSet = new Set();

const dropZone     = document.getElementById('drop-zone');
const fileInput    = document.getElementById('file-input');
const grid         = document.getElementById('grid');
const actionBar    = document.getElementById('action-bar');
const promptBox    = document.getElementById('prompt-box');
const countBadge   = document.getElementById('count-badge');
const btnClean     = document.getElementById('btn-clean');
const dlGroup      = document.getElementById('dl-group');
const progressWrap = document.getElementById('progress-wrap');
const progressBar  = document.getElementById('progress-bar');
const empty        = document.getElementById('empty');
const selBanner    = document.getElementById('sel-banner');
const selBannerTxt = document.getElementById('sel-banner-text');
const btnConfirmSel= document.getElementById('btn-confirm-sel');

// ── Marca de agua (solo al descargar, solo para cuentas autorizadas) ──────────
// Este editor lo usan muchas cuentas de Broquer que no tienen nada que ver
// entre sí. El logotipo de la inmobiliaria SOLO debe aparecer para el dueño
// de esa cuenta y sus colaboradores — para el resto de usuarios de Broquer
// nunca se aplica ninguna marca de agua.
const WATERMARK_LOGO_SRC = 'logo-inmobiliaria-navarro.png';
const WATERMARK_ALLOWED_EMAILS = [
  'navarrocontactomx@gmail.com',
  'salvadorbolanosnavarro@gmail.com',
  'juridico@gruponavarro.mx'
];

function getCurrentUserEmail() {
  try {
    const raw = localStorage.getItem('sb_user') || sessionStorage.getItem('sb_user') || '{}';
    const u = JSON.parse(raw);
    return (u && u.email) ? String(u.email).toLowerCase().trim() : '';
  } catch (e) { return ''; }
}

function shouldApplyWatermark() {
  const email = getCurrentUserEmail();
  return !!email && WATERMARK_ALLOWED_EMAILS.includes(email);
}

let _watermarkImgPromise = null;
function loadWatermarkImg() {
  if (!_watermarkImgPromise) {
    _watermarkImgPromise = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('No se pudo cargar el logotipo de marca de agua'));
      img.src = WATERMARK_LOGO_SRC;
    });
  }
  return _watermarkImgPromise;
}

// Recibe un data URL (imagen editada) y devuelve un nuevo data URL con el
// logotipo de la inmobiliaria en la esquina inferior derecha, tal cual, sin
// caja ni fondo de color — solo una sombra suave para que no se pierda si
// la foto es muy clara justo en esa esquina.
async function addWatermark(dataUrl, contentType) {
  const [img, wm] = await Promise.all([
    new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('No se pudo leer la imagen editada'));
      im.src = dataUrl;
    }),
    loadWatermarkImg()
  ]);

  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  // Logotipo horizontal ancho (marca + slogan): se dimensiona como % del
  // ancho de la foto, con topes para que no se vea diminuto ni gigante.
  const wmW = Math.min(320, Math.max(140, canvas.width * 0.22));
  const wmH = wmW * (wm.naturalHeight / wm.naturalWidth);
  const margin = canvas.width * 0.03;
  const x = canvas.width - wmW - margin;
  const y = canvas.height - wmH - margin;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = Math.max(4, wmW * 0.03);
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;
  ctx.drawImage(wm, x, y, wmW, wmH);
  ctx.restore();

  const outType = (contentType && contentType.includes('png')) ? 'image/png' : 'image/jpeg';
  return canvas.toDataURL(outType, 0.92);
}

// ── Drag & drop ──────────────────────────────────────────────────────────────
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

function addFiles(newFiles) {
  files = [...files, ...newFiles].slice(0, 20);
  results = files.map((_, i) => results[i] || null);
  cleaned = false;
  dlGroup.style.display = 'none';
  cancelSelection();
  renderGrid();
}

function applyPreset(btn, text) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('prompt-input').value = text;
}

function renderGrid() {
  if (!files.length) {
    actionBar.style.display = 'none';
    promptBox.style.display = 'none';
    empty.style.display = 'none';
    grid.innerHTML = '';
    return;
  }
  actionBar.style.display = 'flex';
  promptBox.style.display = 'block';
  countBadge.textContent = files.length + (files.length === 1 ? ' foto' : ' fotos');
  grid.className = 'grid' + (selectionMode ? ' sel-mode' : '');
  grid.innerHTML = files.map((f, i) => {
    const origUrl = URL.createObjectURL(f);
    const res = results[i];
    let cleanedSrc = '';
    let statusClass = '';
    let statusText = 'Sin procesar';
    let dlBtn = '';
    if (res && res.cleaned_b64) {
      cleanedSrc = 'data:' + res.content_type + ';base64,' + res.cleaned_b64;
      statusClass = 'ok';
      statusText = res.used_gemini ? 'Mejorada con Broquer AI' : 'Mejorada';
      if (!selectionMode) {
        dlBtn = `<button class="btn-dl-one" id="dl-btn-${i}" onclick="event.stopPropagation();downloadOne(${i})" style="display:flex">
          <svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar
        </button>`;
      }
    } else if (res && res.error) {
      statusClass = 'err';
      statusText = 'Error: ' + (res.error || '').substring(0, 50);
    }
    const rightSrc = cleanedSrc || origUrl;
    const rightLabel = cleanedSrc ? (res && res.used_gemini ? 'Broquer AI' : 'Editada') : 'Original';
    const isChecked = selectedSet.has(i) ? 'checked' : '';
    const checkVisible = res && res.cleaned_b64 ? '' : ' style="display:none"';
    return `
    <div class="card${selectedSet.has(i) ? ' selected' : ''}" id="card-${i}" onclick="cardClick(${i})">
      <div class="card-checkbox ${isChecked}" id="chk-${i}"${checkVisible} onclick="event.stopPropagation();cardClick(${i})">
        <svg viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="card-name" title="${f.name}">${f.name}</div>
      <div class="card-imgs">
        <div class="card-img-wrap">
          <img src="${origUrl}" alt="original" loading="lazy"/>
          <span class="card-img-label">Original</span>
        </div>
        <div class="card-img-wrap" id="right-wrap-${i}">
          <img src="${rightSrc}" alt="resultado" id="right-img-${i}" loading="lazy"/>
          <span class="card-img-label" id="right-lbl-${i}">${rightLabel}</span>
        </div>
      </div>
      <div class="card-footer" id="footer-${i}">
        <span class="card-status ${statusClass}" id="status-${i}">${statusText}</span>
        ${dlBtn}
      </div>
    </div>`;
  }).join('');
}

function cardClick(i) {
  // Selección libre: una vez que la imagen está procesada, click toggle la selección
  // (sin necesidad de entrar en "modo selección" primero).
  const res = results[i];
  if (!res || !res.cleaned_b64) return;
  if (selectedSet.has(i)) {
    selectedSet.delete(i);
  } else {
    selectedSet.add(i);
  }
  updateCardCheckbox(i);
  updateSelectionCount();
  // Mostrar banner solo cuando ya hay algo seleccionado
  if (selBanner) selBanner.style.display = selectedSet.size > 0 ? 'flex' : 'none';
}

function updateCardCheckbox(i) {
  const chk = document.getElementById('chk-' + i);
  const card = document.getElementById('card-' + i);
  if (!chk) return;
  if (selectedSet.has(i)) {
    chk.classList.add('checked');
    card && card.classList.add('selected');
  } else {
    chk.classList.remove('checked');
    card && card.classList.remove('selected');
  }
}

function updateSelectionCount() {
  const n = selectedSet.size;
  selBannerTxt.textContent = n === 0
    ? 'Selecciona las imágenes a descargar'
    : `${n} imagen${n !== 1 ? 'es' : ''} seleccionada${n !== 1 ? 's' : ''}`;
  btnConfirmSel.textContent = `Descargar (${n})`;
  btnConfirmSel.disabled = n === 0;
}

function toggleSelectionMode() {
  if (selectionMode) { cancelSelection(); return; }
  const hasProcessed = results.some(r => r && r.cleaned_b64);
  if (!hasProcessed) { showToast('Primero edita las fotos'); return; }
  selectionMode = true;
  selectedSet.clear();
  selBanner.style.display = 'flex';
  updateSelectionCount();
  renderGrid();
}

function cancelSelection() {
  // Selección siempre activa: solo limpiamos la selección y ocultamos el banner.
  selectedSet.clear();
  selBanner.style.display = 'none';
  renderGrid();
}

function selectAll() {
  results.forEach((r, i) => { if (r && r.cleaned_b64) selectedSet.add(i); });
  results.forEach((_, i) => updateCardCheckbox(i));
  updateSelectionCount();
}

// ── Clean ────────────────────────────────────────────────────────────────────
async function cleanAll() {
  if (!files.length) return;
  const prompt = document.getElementById('prompt-input').value.trim();
  const useAI = prompt.length > 0;

  btnClean.disabled = true;
  btnClean.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Procesando…';
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';

  files.forEach((_, i) => {
    const s = document.getElementById('status-' + i);
    if (s) { s.className = 'card-status loading'; s.textContent = useAI ? 'Procesando con Broquer AI…' : 'Procesando…'; }
  });

  const BATCH = useAI ? 1 : 4;
  let done = 0;
  const MAX_RETRIES = 3;
  const RETRY_DELAYS = [2000, 4000, 8000];

  for (let start = 0; start < files.length; start += BATCH) {
    const batch = files.slice(start, start + BATCH);
    const batchIdx = batch.map((_, j) => start + j);

    let success = false;
    for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
      if (attempt > 0) {
        batchIdx.forEach(idx => {
          const s = document.getElementById('status-' + idx);
          if (s) { s.className = 'card-status loading'; s.textContent = `Reintentando (${attempt}/${MAX_RETRIES - 1})…`; }
        });
        await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt - 1]));
      }

      const fd = new FormData();
      batch.forEach(f => fd.append('files', f));
      fd.append('prompt', prompt);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 120000); // 2 min timeout

      try {
        const _tk = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token') || '';
        const r = await fetch(API_BASE + '/images/clean', {
          method: 'POST',
          headers: _tk ? { Authorization: 'Bearer ' + _tk } : {},
          body: fd,
          signal: controller.signal
        });
        clearTimeout(timeout);
        if (!r.ok) {
          const errText = await r.text().catch(() => 'HTTP ' + r.status);
          throw new Error('HTTP ' + r.status + ' — ' + errText.substring(0, 120));
        }
        const data = await r.json();
        data.images.forEach((res, j) => {
          const idx = batchIdx[j];
          results[idx] = res;
          updateCard(idx, res);
        });
        success = true;
        break;
      } catch (err) {
        clearTimeout(timeout);
        if (attempt === MAX_RETRIES - 1) {
          const msg = err.name === 'AbortError' ? 'Tiempo de espera agotado' : err.message;
          batchIdx.forEach(idx => {
            results[idx] = { error: msg, cleaned_b64: null };
            const s = document.getElementById('status-' + idx);
            if (s) { s.className = 'card-status err'; s.textContent = 'Error: ' + msg.substring(0, 60); }
          });
        }
        // else continue retry loop
      }
    }

    // Delay between AI batches to avoid rate limiting
    if (useAI && start + BATCH < files.length) {
      await new Promise(r => setTimeout(r, 800));
    }

    done += batch.length;
    progressBar.style.width = Math.round((done / files.length) * 100) + '%';
  }

  cleaned = results.some(r => r && r.cleaned_b64);
  if (cleaned) {
    dlGroup.style.display = 'flex';
    showToast('Fotos editadas. Descarga o utiliza en una ficha.');
    // Si TODAS las imágenes fueron procesadas exitosamente, ocultar "Editar fotos"
    const allDone = results.length === files.length && results.every(r => r && r.cleaned_b64);
    if (allDone) {
      btnClean.style.display = 'none';
    }
  }
  btnClean.disabled = false;
  btnClean.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Editar fotos`;
  setTimeout(() => { progressWrap.style.display = 'none'; }, 800);
}

function updateCard(i, res) {
  const s = document.getElementById('status-' + i);
  const rightImg = document.getElementById('right-img-' + i);
  const rightLbl = document.getElementById('right-lbl-' + i);
  const footer = document.getElementById('footer-' + i);
  const chk = document.getElementById('chk-' + i);
  if (res.cleaned_b64) {
    const src = 'data:' + res.content_type + ';base64,' + res.cleaned_b64;
    if (rightImg) rightImg.src = src;
    if (rightLbl) rightLbl.textContent = res.used_gemini ? 'Broquer AI' : 'EDITADA';
    if (s) { s.className = 'card-status ok'; s.textContent = res.used_gemini ? 'Mejorada con Broquer AI' : 'Mejorada'; }
    if (chk) chk.style.display = 'flex';
    if (footer && !selectionMode) {
      let dlBtn = footer.querySelector('.btn-dl-one');
      if (!dlBtn) {
        dlBtn = document.createElement('button');
        dlBtn.className = 'btn-dl-one';
        dlBtn.style.display = 'flex';
        dlBtn.innerHTML = `<svg viewBox="0 0 24 24" stroke-width="2.5" fill="none" stroke="white" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar`;
        dlBtn.onclick = (e) => { e.stopPropagation(); downloadOne(i); };
        footer.appendChild(dlBtn);
      }
    }
  } else if (res.error) {
    if (s) { s.className = 'card-status err'; s.title = res.error; s.textContent = 'Error: ' + (res.error || '').substring(0, 60); }
  }
}

// ── Downloads ─────────────────────────────────────────────────────────────────
async function downloadOne(i) {
  const res = results[i];
  if (!res || !res.cleaned_b64) return;
  const rawUrl = 'data:' + res.content_type + ';base64,' + res.cleaned_b64;
  let finalUrl = rawUrl;
  if (shouldApplyWatermark()) {
    try {
      finalUrl = await addWatermark(rawUrl, res.content_type);
    } catch (e) {
      // Si falla el marcado de agua, se descarga la imagen editada sin marca
      // para no bloquear al usuario.
      console.error('Watermark error:', e);
    }
  }

  // En la app nativa (Capacitor/iOS) no existe "carpeta de Descargas":
  // hay que guardar la imagen directo en el rollo de fotos con el plugin Media.
  const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if (isNative) {
    try {
      const Media = window.Capacitor.Plugins && window.Capacitor.Plugins.Media;
      if (!Media) throw new Error('Plugin Media no disponible');
      await Media.savePhoto({ path: finalUrl });
      return true;
    } catch (e) {
      console.error('Error guardando en galería:', e);
      showToast('No se pudo guardar la imagen en tu galería');
      return false;
    }
  }

  // Web / PWA: comportamiento original (descarga a la carpeta de Descargas)
  const a = document.createElement('a');
  a.href = finalUrl;
  const orig = files[i].name;
  const ext = orig.split('.').pop();
  const base = orig.substring(0, orig.lastIndexOf('.')) || orig;
  a.download = base + '_editada.' + ext;
  a.click();
  return true;
}

async function downloadAll() {
  const processed = results.map((r, i) => ({r, i})).filter(({r}) => r && r.cleaned_b64);
  if (!processed.length) { showToast('No hay fotos editadas aún'); return; }
  // Suppress Broq wake-word during download to avoid false triggers
  try { window.parent.postMessage({ type: 'Broquer-suppress-wake', duration: 5000 }, '*'); } catch(e){}
  showToast(`Descargando ${processed.length} imagen${processed.length !== 1 ? 'es' : ''}…`);
  let ok = 0;
  for (const {i} of processed) {
    if (await downloadOne(i)) ok++;
    await new Promise(res => setTimeout(res, 250));
  }
  const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if (isNative) {
    showToast(ok === processed.length
      ? `${ok} imagen${ok !== 1 ? 'es' : ''} guardada${ok !== 1 ? 's' : ''} en tu galería`
      : `${ok} de ${processed.length} guardadas — revisa permisos de fotos`);
  }
}

async function downloadSelected() {
  if (selectedSet.size === 0) { showToast('Selecciona al menos una imagen'); return; }
  const toDownload = [...selectedSet].filter(i => results[i] && results[i].cleaned_b64);
  if (!toDownload.length) { showToast('Sin imágenes válidas en la selección'); return; }
  try { window.parent.postMessage({ type: 'Broquer-suppress-wake', duration: 5000 }, '*'); } catch(e){}
  showToast(`Descargando ${toDownload.length} imagen${toDownload.length !== 1 ? 'es' : ''}…`);
  cancelSelection();
  let ok = 0;
  for (const i of toDownload) {
    if (await downloadOne(i)) ok++;
    await new Promise(res => setTimeout(res, 250));
  }
  const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if (isNative) {
    showToast(ok === toDownload.length
      ? `${ok} imagen${ok !== 1 ? 'es' : ''} guardada${ok !== 1 ? 's' : ''} en tu galería`
      : `${ok} de ${toDownload.length} guardadas — revisa permisos de fotos`);
  }
}

// ── Utilizar en ficha ─────────────────────────────────────────────────────────
function useInFicha() {
  toggleUsarMenu(false);
  const imagesToUse = results
    .map((res, i) => res && res.cleaned_b64
      ? { url: 'data:' + res.content_type + ';base64,' + res.cleaned_b64,
          name: (() => { const n = files[i].name; const e = n.split('.').pop(); const b = n.substring(0, n.lastIndexOf('.')) || n; return b + '_editada.' + e; })() }
      : null)
    .filter(Boolean);

  if (!imagesToUse.length) { showToast('No hay fotos editadas aún'); return; }

  // Si estamos en un iframe (parent !== self), notificar al padre.
  const inIframe = window.parent !== window;
  if (inIframe) {
    try {
      window.parent.BroquerEditorImages = imagesToUse;
      window.parent.postMessage({ type: 'Broquer-use-in-ficha' }, '*');
      showToast(`${imagesToUse.length} imagen${imagesToUse.length !== 1 ? 'es' : ''} enviada${imagesToUse.length !== 1 ? 's' : ''} a fichas técnicas`);
      return;
    } catch(e) { /* fall through to navigation */ }
  }
  // Página completa: guardar en sessionStorage y navegar a ficha-manual.
  try {
    sessionStorage.setItem('broquer_editor_images', JSON.stringify(imagesToUse));
    location.href = 'ficha-manual.html';
  } catch(e) {
    showToast('No se pudieron transferir las imágenes');
  }
}

// ── Utilizar en Facebook Ads ──────────────────────────────────────────────────
function collectEditedImages() {
  return results
    .map((res, i) => res && res.cleaned_b64
      ? { url: 'data:' + res.content_type + ';base64,' + res.cleaned_b64,
          name: (() => { const n = files[i].name; const e = n.split('.').pop(); const b = n.substring(0, n.lastIndexOf('.')) || n; return b + '_editada.' + e; })() }
      : null)
    .filter(Boolean);
}

function useInFacebookAds() {
  toggleUsarMenu(false);
  const imagesToUse = collectEditedImages();
  if (!imagesToUse.length) { showToast('No hay fotos editadas aún'); return; }

  // Facebook permite máximo 10 tarjetas por carrusel.
  const enviadas = imagesToUse.slice(0, 10);
  const sobrantes = imagesToUse.length - enviadas.length;

  try {
    sessionStorage.setItem('broquer_editor_images_fb', JSON.stringify(enviadas));
  } catch (e) {
    showToast('Las fotos pesan demasiado para transferirlas. Descárgalas y súbelas manualmente.');
    return;
  }
  if (sobrantes > 0) {
    showToast(`Enviando 10 fotos a Facebook Ads — ${sobrantes} no caben en un carrusel.`, 2000);
    setTimeout(() => { location.href = 'facebook-ads.html'; }, 1400);
  } else {
    location.href = 'facebook-ads.html';
  }
}

// ── Menú "Utilizar en…" ──────────────────────────────────────────────────────
function toggleUsarMenu(forzar) {
  const menu = document.getElementById('usar-menu');
  const btn  = document.getElementById('btn-usar');
  const abrir = (typeof forzar === 'boolean') ? forzar : !menu.classList.contains('is-open');
  menu.classList.toggle('is-open', abrir);
  if (btn) btn.setAttribute('aria-expanded', abrir ? 'true' : 'false');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.usar-wrap')) toggleUsarMenu(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleUsarMenu(false); });

// ── Utilizar en Video ─────────────────────────────────────────────────────────
// El recorrido necesita mínimo 2 fotos y usa máximo 8: más de eso nadie lo
// termina de ver. El módulo de Video sube estas fotos a Storage antes de
// renderizar, porque llegan como data: y el backend no puede leerlas así.
function useInVideo() {
  toggleUsarMenu(false);
  const imagesToUse = collectEditedImages();
  if (imagesToUse.length < 2) { showToast('El recorrido necesita al menos 2 fotos editadas'); return; }

  const enviadas = imagesToUse.slice(0, 8);
  const sobrantes = imagesToUse.length - enviadas.length;

  try {
    sessionStorage.setItem('broquer_editor_images_video', JSON.stringify(enviadas));
  } catch (e) {
    showToast('Las fotos pesan demasiado para transferirlas. Descárgalas y súbelas a la ficha.');
    return;
  }
  if (sobrantes > 0) {
    showToast('Enviando 8 fotos a Video — ' + sobrantes + ' no caben en un recorrido.', 2000);
    setTimeout(() => { location.href = 'video.html'; }, 1400);
  } else {
    location.href = 'video.html';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
