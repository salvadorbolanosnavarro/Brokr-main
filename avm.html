<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-broquer.png"/>
<link rel="apple-touch-icon" href="isotipo-broquer.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover"/>
<title>Broquer — Estimación de Valor</title>
<meta name="theme-color" content="#F7F5EE"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

#app-ui{
  max-width: 680px; margin: 0 auto;
  padding: 24px 20px 60px;
}

.ui-card{
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.ui-card h3{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--mute);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.ui-card h3 .opt{ color:var(--mute-2); font-weight:500; text-transform:none; letter-spacing:0; font-size:11px; font-family:var(--font-sans); }

/* form rows */
.frow{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.frow.three{ grid-template-columns: 1fr 1fr 1fr; }
.frow.single{ grid-template-columns: 1fr; }
.frow:last-child{ margin-bottom:0; }
.f{ display: flex; flex-direction: column; gap: 5px; }
.f label{
  font-size: 12px;
  font-weight: 500;
  color: var(--mute);
  letter-spacing: -0.005em;
}
.f input, .f select, .f textarea{
  padding: 10px 14px;
  background: var(--bone);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  font-size: 13px;
  font-family: var(--font-sans);
  color: var(--ink);
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.f input:focus, .f select:focus, .f textarea:focus{
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(10,10,10,0.06);
}
.f input::placeholder, .f textarea::placeholder{ color: var(--mute-2); }
.f textarea{ resize: vertical; min-height: 90px; }

/* toggle venta/renta */
.toggle{
  display:flex; background:var(--paper-2);
  border-radius:var(--r); padding:3px;
}
.toggle button{
  flex:1; padding:9px 6px;
  font-size:12px; font-weight:600;
  font-family:var(--font-sans);
  border:none; border-radius:calc(var(--r) - 3px);
  background:transparent; color:var(--mute);
  cursor:pointer; transition:all .15s;
}
.toggle button.active{
  background:var(--bone); color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}

/* foto upload */
.foto-upload-area{
  border: 2px dashed var(--line-2);
  border-radius: var(--r);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s var(--ease), background .2s var(--ease);
  background: var(--paper-2);
}
.foto-upload-area:hover{
  border-color: var(--ink);
  background: var(--bone);
}
.foto-upload-area p{
  font-size: 13px;
  color: var(--mute);
  margin-top: 10px;
}
.foto-upload-area svg{ opacity: .55; color: var(--mute); }
.foto-preview{
  position:relative;
  border-radius: var(--r);
  overflow:hidden;
  background:var(--paper-2);
  border:1px solid var(--line);
}
.foto-preview img{ width:100%; max-height:240px; object-fit:cover; display:block; }
.foto-quitar{
  position:absolute; top:10px; right:10px;
  background:rgba(10,10,10,.75); color:white;
  border:none; padding:6px 12px;
  border-radius: var(--r-pill); font-size:11px;
  font-weight:600; cursor:pointer;
  font-family:var(--font-sans);
}

/* botones de acción */
.btn-primary{
  width:100%; padding:14px 20px;
  background:var(--ink); color:white;
  border:none; border-radius:var(--r);
  font-size:14px; font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:opacity .2s, transform .15s;
  font-family:var(--font-sans);
}
.btn-primary:active{ transform:scale(.98); opacity:.92; }
.btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
.btn-secondary{
  width:100%; padding:13px 20px;
  background:transparent; color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r);
  font-size:13px; font-weight:600;
  cursor:pointer; transition:all .15s;
  font-family:var(--font-sans);
  margin-top:10px;
}
.btn-secondary:active{ background:var(--paper-2); }

/* alerta inline */
.alert{
  border-radius:var(--r);
  padding:10px 14px;
  font-size:12.5px; line-height:1.5;
  margin-bottom:12px;
}
.alert.warn{
  background:var(--warn-soft);
  border-left:3px solid var(--warn);
  color:#6B4419;
}

/* loading */
.loading-box{ text-align:center; padding:48px 20px; }
.loading-icon{
  width:44px; height:44px; margin:0 auto 18px;
  border:3px solid var(--paper-2);
  border-top-color:var(--ink);
  border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg)} }
.loading-txt{ font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.loading-sub{ font-size:12px; color:var(--mute); line-height:1.6; max-width:420px; margin:0 auto; }
.loading-step{
  font-size:11px; color:var(--ink);
  font-family:var(--font-mono);
  margin-top:14px; animation:pulse 1.6s ease-in-out infinite;
  text-transform:uppercase; letter-spacing:.1em;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }

/* ─── Vista previa editable ─── */
.hero-card{
  background:var(--bone);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:20px 22px;
  margin-bottom:14px;
}
.hero-lbl{
  font-family:var(--font-mono);
  font-size:11px; font-weight:600;
  color:var(--mute); text-transform:uppercase;
  letter-spacing:.12em; margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.hero-val-input{
  width:100%;
  font-family:var(--font-display);
  font-size:34px; font-weight:700;
  color:var(--ink); letter-spacing:-0.025em;
  line-height:1;
  border:1px dashed transparent;
  border-radius:8px;
  padding:4px 8px;
  background:transparent;
  outline:none;
  margin-bottom:8px;
  font-variant-numeric:tabular-nums;
}
.hero-val-input:focus{ border-color:var(--line-2); background:var(--paper-2); }
.hero-rango{ font-size:12px; color:var(--mute); }
.conf-badge{
  display:inline-block;
  padding:3px 10px; border-radius:var(--r-pill);
  font-family:var(--font-mono);
  font-size:9.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.1em;
}
.conf-badge.alta{ background:var(--success-soft); color:var(--success); }
.conf-badge.media{ background:var(--warn-soft); color:var(--warn); }
.conf-badge.baja{ background:var(--danger-soft); color:var(--danger); }

.lista-rec{
  margin-top:14px; padding-top:14px;
  border-top:1px dashed var(--line-2);
  display:flex; justify-content:space-between; align-items:center;
  gap:12px;
}
.lista-rec-lbl{
  font-family:var(--font-mono);
  font-size:10px; font-weight:600;
  color:var(--mute); text-transform:uppercase;
  letter-spacing:.12em;
}
.lista-rec-val-input{
  max-width:170px; text-align:right;
  font-family:var(--font-display);
  font-size:18px; font-weight:700;
  color:var(--forest); letter-spacing:-0.015em;
  border:1px dashed transparent;
  border-radius:6px;
  padding:4px 8px;
  background:transparent;
  outline:none;
  font-variant-numeric:tabular-nums;
}
.lista-rec-val-input:focus{ border-color:var(--line-2); background:var(--paper-2); }

/* inputs/textareas inline editables dentro del resultado */
.ed-input{
  width:100%;
  border:1px dashed var(--line-2);
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  color:var(--ink);
  background:var(--paper-2);
  outline:none;
  font-family:var(--font-sans);
}
.ed-input:focus{ border-color:var(--ink); background:var(--bone); border-style:solid; }
.ed-textarea{
  width:100%;
  border:1px dashed var(--line-2);
  border-radius:10px;
  padding:11px 13px;
  font-family:var(--font-sans);
  font-size:13px;
  color:var(--ink);
  background:var(--paper-2);
  resize:vertical;
  outline:none;
  min-height:90px;
  line-height:1.65;
}
.ed-textarea:focus{ border-color:var(--ink); background:var(--bone); border-style:solid; }

.ed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
.ed-field-lbl{
  font-size:11px; color:var(--mute); font-weight:500;
  margin-bottom:4px; letter-spacing:-0.005em;
}

.restaurar-btn{
  background:none; border:none;
  font-size:10px; color:var(--ink);
  cursor:pointer; font-weight:600;
  font-family:var(--font-sans);
  text-transform:none; letter-spacing:0;
}

/* pasos del razonamiento */
.paso-card{
  background:var(--paper-2);
  border-left:3px solid var(--ink);
  border-radius:0 var(--r) var(--r) 0;
  padding:14px 16px;
  margin-bottom:10px;
}
.paso-head{
  display:flex; align-items:center; gap:10px;
  margin-bottom:8px;
}
.paso-num{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px;
  background:var(--ink); color:white;
  border-radius:50%;
  font-family:var(--font-mono);
  font-size:11px; font-weight:700;
  flex-shrink:0;
}
.paso-titulo-input{
  flex:1;
  border:1px dashed transparent;
  border-radius:6px;
  padding:4px 8px;
  font-size:13px; font-weight:600;
  color:var(--ink);
  background:transparent;
  outline:none;
  font-family:var(--font-sans);
}
.paso-titulo-input:focus{ border-color:var(--line-2); background:var(--bone); }
.paso-cont-textarea{
  width:100%;
  border:1px dashed var(--line-2);
  border-radius:8px;
  padding:10px 12px;
  font-family:var(--font-sans);
  font-size:12px;
  color:var(--ink);
  background:var(--bone);
  resize:vertical;
  outline:none;
  min-height:80px;
  line-height:1.65;
}
.paso-cont-textarea:focus{ border-color:var(--ink); border-style:solid; }

/* tabla comparables */
.comp-tabla{
  width:100%; border-collapse:collapse;
  font-size:12px; margin-top:4px;
}
.comp-tabla th{
  font-family:var(--font-mono);
  font-size:9.5px; font-weight:600;
  color:var(--mute); text-transform:uppercase;
  letter-spacing:.1em;
  text-align:left; padding:8px 6px;
  border-bottom:1.5px solid var(--ink);
}
.comp-tabla td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
.comp-tabla td input{
  width:100%;
  border:1px dashed transparent;
  border-radius:6px;
  padding:4px 7px;
  font-size:12px;
  color:var(--ink);
  background:transparent;
  outline:none;
  font-family:var(--font-sans);
}
.comp-tabla td input:focus{ border-color:var(--ink); background:var(--bone); border-style:solid; }
.comp-tabla td .right{ text-align:right; font-variant-numeric:tabular-nums; }
.comp-tabla .fuente-sub{
  display:block;
  font-size:10px; color:var(--mute);
  font-style:italic; margin-top:2px;
}

/* recomendaciones editables */
.rec-item{
  display:flex; gap:8px;
  padding:6px 0;
  border-bottom:1px solid var(--line);
  align-items:flex-start;
}
.rec-item:last-of-type{ border-bottom:none; }
.rec-bullet{
  color:var(--ink); font-weight:700;
  font-size:14px; flex-shrink:0; line-height:1.5;
}
.rec-input{
  flex:1;
  border:1px dashed transparent;
  border-radius:6px;
  padding:4px 8px;
  font-size:12.5px;
  color:var(--ink);
  background:transparent;
  outline:none;
  font-family:var(--font-sans);
  line-height:1.55;
  resize:vertical;
  min-height:30px;
}
.rec-input:focus{ border-color:var(--ink); background:var(--bone); border-style:solid; }
.rec-remove{
  background:none; border:none;
  color:var(--mute); font-size:14px;
  cursor:pointer; padding:4px 6px;
}
.rec-add{
  margin-top:10px;
  background:none; border:1px dashed var(--line-2);
  color:var(--mute); padding:7px 12px;
  border-radius:8px; font-size:11px;
  font-weight:600; cursor:pointer;
  font-family:var(--font-sans);
}
.rec-add:hover{ border-color:var(--ink); color:var(--ink); }

/* foto en vista previa */
.foto-preview-result{
  width:100%; height:200px;
  border-radius:var(--r);
  overflow:hidden;
  background:var(--paper-2);
  border:1px solid var(--line);
  position:relative;
}
.foto-preview-result img{
  width:100%; height:100%;
  object-fit:cover; display:block;
}
.foto-cambiar{
  position:absolute; bottom:10px; right:10px;
  background:rgba(10,10,10,.75); color:white;
  border:none; padding:7px 14px;
  border-radius:var(--r-pill); font-size:11px;
  font-weight:600; cursor:pointer;
  font-family:var(--font-sans);
}
.foto-agregar-result{
  width:100%; padding:14px;
  border:1.5px dashed var(--line-2);
  border-radius:var(--r);
  background:var(--paper-2);
  color:var(--mute);
  font-size:12px; font-weight:600;
  cursor:pointer;
  text-align:center;
  font-family:var(--font-sans);
}
.foto-agregar-result:hover{
  border-color:var(--ink); color:var(--ink);
  background:var(--bone);
}
</style>
</head>
<body data-app="avm">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API = "https://api.navarroai.com.mx";

const TIPOS = [
  { id:"casa",         label:"Casa" },
  { id:"departamento", label:"Departamento" },
  { id:"terreno",      label:"Terreno" },
  { id:"local",        label:"Local comercial" },
  { id:"oficina",      label:"Oficina" },
  { id:"bodega",       label:"Bodega" },
];

const fmtMXN = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("es-MX");

function EstimacionValor() {
  const [form, setForm] = useState({
    tipo: "casa",
    operacion: "venta",
    colonia: "",
    ciudad: "Morelia",
    m2_terreno: "",
    m2_construccion: "",
    recamaras: "",
    banos: "",
    estacionamientos: "",
    condicion_terreno: "plano",
    comentarios: "",
  });

  const [foto, setFoto] = useState("");
  const fileInputRef = useRef(null);

  const [estado, setEstado] = useState("idle");
  const [resultado, setResultado] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [pdfLoading, setPdfLoading] = useState(false);

  const [edit, setEdit] = useState(null);

  const u = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const esTerreno = form.tipo === "terreno";
  const esConstruccion = ["casa","departamento","local","oficina","bodega"].includes(form.tipo);

  // ── Shaark postMessage ──
  useEffect(() => {
    window.__avmIAFill = (data) => {
      if (data.tipo_inmueble)     setForm(p => ({ ...p, tipo: data.tipo_inmueble }));
      if (data.colonia)           setForm(p => ({ ...p, colonia: data.colonia }));
      if (data.ciudad)            setForm(p => ({ ...p, ciudad: data.ciudad }));
      if (data.m2_terreno)        setForm(p => ({ ...p, m2_terreno: String(data.m2_terreno) }));
      if (data.m2_construccion)   setForm(p => ({ ...p, m2_construccion: String(data.m2_construccion) }));
      if (data.recamaras)         setForm(p => ({ ...p, recamaras: String(data.recamaras) }));
      if (data.banos)             setForm(p => ({ ...p, banos: String(data.banos) }));
      if (data.condicion_terreno) setForm(p => ({ ...p, condicion_terreno: data.condicion_terreno }));
      if (data.operacion)         setForm(p => ({ ...p, operacion: data.operacion }));
    };
    window.__avmFill = window.__avmIAFill;

    const onMsg = (e) => {
      if (e.data && (e.data.tipo === "opinion_valor_web" || e.data.tipo === "llenar_avm")) {
        window.__avmIAFill(e.data);
        setTimeout(() => {
          const btn = document.getElementById("btn-analizar-ia");
          if (btn) btn.click();
        }, 300);
      }
    };
    window.addEventListener("message", onMsg);
    return () => {
      window.removeEventListener("message", onMsg);
      delete window.__avmIAFill;
      delete window.__avmFill;
    };
  }, []);

  const onFotoChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      alert("La imagen es muy pesada (máx 8 MB). Intenta con una más pequeña.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => setFoto(reader.result);
    reader.readAsDataURL(file);
  };

  const analizar = async () => {
    if (!form.colonia.trim()) { setErrorMsg("Escribe la colonia o fraccionamiento."); return; }
    const supPrincipal = esTerreno ? parseFloat(form.m2_terreno) : parseFloat(form.m2_construccion);
    if (!supPrincipal || supPrincipal <= 0) {
      setErrorMsg(esTerreno ? "Ingresa los m² de terreno." : "Ingresa los m² de construcción.");
      return;
    }
    setErrorMsg("");
    setEstado("loading");
    try {
      const body = {
        colonia: form.colonia.trim(),
        tipo_inmueble: form.tipo,
        operacion: form.operacion,
        m2_terreno: parseFloat(form.m2_terreno) || 0,
        m2_construccion: parseFloat(form.m2_construccion) || 0,
        recamaras: parseInt(form.recamaras) || 0,
        banos: parseFloat(form.banos) || 0,
        estacionamientos: parseInt(form.estacionamientos) || 0,
        condicion_terreno: form.condicion_terreno || "",
        ciudad: form.ciudad || "Morelia",
        comentarios: form.comentarios || "",
      };
      const r = await fetch(`${API}/api/avm-websearch`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Error en el análisis");
      setResultado(data);
      setEdit(JSON.parse(JSON.stringify(data)));
      setEstado("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      setErrorMsg(e.message || "No se pudo conectar. Intenta de nuevo.");
      setEstado("error");
    }
  };

  const descargarPDF = async () => {
    if (!edit) return;
    setPdfLoading(true);
    try {
      const r = await fetch(`${API}/avm-pdf`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ resultado: edit, foto_inmueble: foto || "" }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Error generando PDF");
      const pdfResp = await fetch(`${API}/avm-pdf/${data.token}`);
      if (!pdfResp.ok) throw new Error("No se pudo obtener el PDF");
      const blob = await pdfResp.blob();
      const filename = data.filename || "Estimacion_de_Valor.pdf";

      if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: "application/pdf" })] })) {
        const file = new File([blob], filename, { type: "application/pdf" });
        await navigator.share({ files: [file], title: "Estimación de Valor", text: "Estimación de Valor generada con Broquer" });
      } else {
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(blobUrl); }, 500);
      }
    } catch (e) {
      if (e.name !== "AbortError") alert("Error al generar PDF: " + e.message);
    } finally { setPdfLoading(false); }
  };

  const updEdit = (k, v) => setEdit(p => ({ ...p, [k]: v }));
  const updPaso = (idx, k, v) => setEdit(p => ({
    ...p,
    razonamiento_pasos: p.razonamiento_pasos.map((paso, i) => i === idx ? { ...paso, [k]: v } : paso)
  }));
  const updComp = (idx, k, v) => setEdit(p => ({
    ...p,
    comparables: p.comparables.map((c, i) => i === idx ? { ...c, [k]: v } : c)
  }));
  const updRec = (idx, v) => setEdit(p => ({
    ...p,
    recomendaciones: p.recomendaciones.map((r, i) => i === idx ? v : r)
  }));
  const removeRec = (idx) => setEdit(p => ({
    ...p,
    recomendaciones: p.recomendaciones.filter((_, i) => i !== idx)
  }));
  const addRec = () => setEdit(p => ({
    ...p,
    recomendaciones: [...(p.recomendaciones || []), ""]
  }));
  const restaurar = (campo) => setEdit(p => ({ ...p, [campo]: resultado[campo] }));

  // ═══════════════════════════════════════════════════════════
  // FORMULARIO
  // ═══════════════════════════════════════════════════════════
  if (estado === "idle" || estado === "error") {
    return (
      <div id="app-ui">

        <div className="ui-card">
          <h3>Tipo de inmueble</h3>
          <div className="frow single" style={{marginBottom:12}}>
            <div className="f">
              <select value={form.tipo} onChange={e => u("tipo", e.target.value)}>
                {TIPOS.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>
          </div>
          <div className="toggle">
            <button className={form.operacion === "venta" ? "active" : ""} onClick={() => u("operacion","venta")}>Venta</button>
            <button className={form.operacion === "renta" ? "active" : ""} onClick={() => u("operacion","renta")}>Renta</button>
          </div>
        </div>

        <div className="ui-card">
          <h3>Ubicación</h3>
          <div className="frow single">
            <div className="f">
              <label>Colonia / Fraccionamiento *</label>
              <input type="text" value={form.colonia}
                onChange={e => u("colonia", e.target.value)}
                placeholder="Vistas Altozano, Chapultepec Norte..." />
            </div>
          </div>
          <div className="frow single">
            <div className="f">
              <label>Ciudad</label>
              <input type="text" value={form.ciudad}
                onChange={e => u("ciudad", e.target.value)}
                placeholder="Morelia" />
            </div>
          </div>
        </div>

        <div className="ui-card">
          <h3>Superficies</h3>
          <div className="frow">
            {(esTerreno || esConstruccion) && (
              <div className="f">
                <label>m² de terreno{esTerreno ? " *" : ""}</label>
                <input type="number" inputMode="decimal" value={form.m2_terreno}
                  onChange={e => u("m2_terreno", e.target.value)} placeholder="200" />
              </div>
            )}
            {esConstruccion && (
              <div className="f">
                <label>m² construidos *</label>
                <input type="number" inputMode="decimal" value={form.m2_construccion}
                  onChange={e => u("m2_construccion", e.target.value)} placeholder="180" />
              </div>
            )}
          </div>
          {esTerreno && (
            <div className="frow single">
              <div className="f">
                <label>Condición del terreno</label>
                <select value={form.condicion_terreno} onChange={e => u("condicion_terreno", e.target.value)}>
                  <option value="plano">Plano</option>
                  <option value="pendiente">Con pendiente</option>
                  <option value="irregular">Irregular</option>
                </select>
              </div>
            </div>
          )}
        </div>

        {esConstruccion && (
          <div className="ui-card">
            <h3>Características</h3>
            <div className="frow three">
              <div className="f">
                <label>Recámaras</label>
                <input type="number" inputMode="numeric" value={form.recamaras}
                  onChange={e => u("recamaras", e.target.value)} placeholder="3" />
              </div>
              <div className="f">
                <label>Baños</label>
                <input type="number" inputMode="decimal" value={form.banos}
                  onChange={e => u("banos", e.target.value)} placeholder="2" />
              </div>
              <div className="f">
                <label>Estac.</label>
                <input type="number" inputMode="numeric" value={form.estacionamientos}
                  onChange={e => u("estacionamientos", e.target.value)} placeholder="2" />
              </div>
            </div>
          </div>
        )}

        <div className="ui-card">
          <h3>Observaciones <span className="opt">opcional</span></h3>
          <div className="frow single">
            <div className="f">
              <textarea value={form.comentarios}
                onChange={e => u("comentarios", e.target.value)}
                placeholder="Esquina, vista panorámica, cerca de área verde..." />
            </div>
          </div>
        </div>

        <div className="ui-card">
          <h3>Foto del inmueble <span className="opt">opcional</span></h3>
          {!foto ? (
            <div className="foto-upload-area" onClick={() => fileInputRef.current?.click()}>
              <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.6">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <p>Toca para agregar una foto desde tu celular o computadora</p>
            </div>
          ) : (
            <div className="foto-preview">
              <img src={foto} alt="Inmueble"/>
              <button className="foto-quitar" onClick={() => setFoto("")}>Quitar</button>
            </div>
          )}
          <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFotoChange}/>
        </div>

        {errorMsg && <div className="alert warn">{errorMsg}</div>}

        <button id="btn-analizar-ia" className="btn-primary" onClick={analizar}>
          Generar Estimación de Valor
        </button>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // LOADING
  // ═══════════════════════════════════════════════════════════
  if (estado === "loading") {
    return (
      <div id="app-ui">
        <div className="ui-card loading-box">
          <div className="loading-icon"></div>
          <div className="loading-txt">Analizando el mercado</div>
          <div className="loading-sub">
            Buscamos 5 comparables vigentes en Inmuebles24, Lamudi, Vivanuncios, Propiedades.com y Mercado Libre, y aplicamos los 6 pasos del Método Comparativo de Mercado.
          </div>
          <div className="loading-step">30–60 segundos</div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // RESULTADO EDITABLE
  // ═══════════════════════════════════════════════════════════
  if (estado === "result" && edit) {
    const confClass = edit.nivel_confianza === "alta" ? "alta" : edit.nivel_confianza === "media" ? "media" : "baja";

    return (
      <div id="app-ui">

        {/* Foto */}
        <div className="ui-card">
          <h3>Foto del inmueble <span className="opt">aparecerá en el PDF</span></h3>
          {foto ? (
            <div className="foto-preview-result">
              <img src={foto} alt="Inmueble"/>
              <button className="foto-cambiar" onClick={() => fileInputRef.current?.click()}>Cambiar</button>
            </div>
          ) : (
            <button className="foto-agregar-result" onClick={() => fileInputRef.current?.click()}>
              + Agregar foto
            </button>
          )}
          <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFotoChange}/>
        </div>

        {/* Valor */}
        <div className="hero-card">
          <div className="hero-lbl">
            Valor comercial estimado
            <span className={"conf-badge " + confClass}>Confianza {edit.nivel_confianza || "media"}</span>
          </div>
          <input className="hero-val-input"
            type="text"
            value={fmtMXN(edit.valor_estimado)}
            onChange={e => updEdit("valor_estimado", parseFloat(e.target.value.replace(/[^\d.-]/g, "")) || 0)} />
          <div className="hero-rango">
            Rango: {fmtMXN(edit.valor_minimo)} — {fmtMXN(edit.valor_maximo)}
            {edit.valor_por_m2 > 0 && ` · ${fmtMXN(edit.valor_por_m2)}/m²`}
          </div>
          {edit.precio_lista_recomendado > 0 && (
            <div className="lista-rec">
              <span className="lista-rec-lbl">Precio de lista recomendado</span>
              <input className="lista-rec-val-input"
                type="text"
                value={fmtMXN(edit.precio_lista_recomendado)}
                onChange={e => updEdit("precio_lista_recomendado", parseFloat(e.target.value.replace(/[^\d.-]/g, "")) || 0)} />
            </div>
          )}
        </div>

        {/* Datos del inmueble */}
        <div className="ui-card">
          <h3>Datos del inmueble</h3>
          <div className="ed-grid">
            <div>
              <div className="ed-field-lbl">Tipo</div>
              <input className="ed-input" value={edit.tipo_inmueble || ""} onChange={e => updEdit("tipo_inmueble", e.target.value)} />
            </div>
            <div>
              <div className="ed-field-lbl">Operación</div>
              <input className="ed-input" value={edit.operacion || ""} onChange={e => updEdit("operacion", e.target.value)} />
            </div>
            <div>
              <div className="ed-field-lbl">Colonia</div>
              <input className="ed-input" value={edit.colonia || ""} onChange={e => updEdit("colonia", e.target.value)} />
            </div>
            <div>
              <div className="ed-field-lbl">Ciudad</div>
              <input className="ed-input" value={edit.ciudad || ""} onChange={e => updEdit("ciudad", e.target.value)} />
            </div>
            {edit.m2_terreno > 0 && (
              <div>
                <div className="ed-field-lbl">m² terreno</div>
                <input className="ed-input" type="number" value={edit.m2_terreno || 0} onChange={e => updEdit("m2_terreno", parseFloat(e.target.value) || 0)} />
              </div>
            )}
            {edit.m2_construccion > 0 && (
              <div>
                <div className="ed-field-lbl">m² construcción</div>
                <input className="ed-input" type="number" value={edit.m2_construccion || 0} onChange={e => updEdit("m2_construccion", parseFloat(e.target.value) || 0)} />
              </div>
            )}
            {edit.recamaras > 0 && (
              <div>
                <div className="ed-field-lbl">Recámaras</div>
                <input className="ed-input" type="number" value={edit.recamaras || 0} onChange={e => updEdit("recamaras", parseInt(e.target.value) || 0)} />
              </div>
            )}
            {edit.banos > 0 && (
              <div>
                <div className="ed-field-lbl">Baños</div>
                <input className="ed-input" type="number" value={edit.banos || 0} onChange={e => updEdit("banos", parseFloat(e.target.value) || 0)} />
              </div>
            )}
            {edit.estacionamientos > 0 && (
              <div>
                <div className="ed-field-lbl">Estacionamientos</div>
                <input className="ed-input" type="number" value={edit.estacionamientos || 0} onChange={e => updEdit("estacionamientos", parseInt(e.target.value) || 0)} />
              </div>
            )}
          </div>
        </div>

        {/* Resumen */}
        <div className="ui-card">
          <h3>
            Resumen ejecutivo
            {edit.resumen_ejecutivo !== resultado.resumen_ejecutivo && (
              <button className="restaurar-btn" onClick={() => restaurar("resumen_ejecutivo")}>↺ Restaurar</button>
            )}
          </h3>
          <textarea className="ed-textarea"
            value={edit.resumen_ejecutivo || ""}
            onChange={e => updEdit("resumen_ejecutivo", e.target.value)} />
        </div>

        {/* Razonamiento */}
        {edit.razonamiento_pasos && edit.razonamiento_pasos.length > 0 && (
          <div className="ui-card">
            <h3>Cómo llegamos a este valor</h3>
            {edit.razonamiento_pasos.map((paso, i) => (
              <div key={i} className="paso-card">
                <div className="paso-head">
                  <span className="paso-num">{paso.paso || i + 1}</span>
                  <input className="paso-titulo-input"
                    value={paso.titulo || ""}
                    onChange={e => updPaso(i, "titulo", e.target.value)} />
                </div>
                <textarea className="paso-cont-textarea"
                  value={paso.contenido || ""}
                  onChange={e => updPaso(i, "contenido", e.target.value)} />
              </div>
            ))}
          </div>
        )}

        {/* Comparables */}
        {edit.comparables && edit.comparables.length > 0 && (
          <div className="ui-card">
            <h3>Comparables encontrados ({edit.comparables.length})</h3>
            <table className="comp-tabla">
              <thead>
                <tr>
                  <th style={{width:24}}>#</th>
                  <th>Descripción</th>
                  <th style={{textAlign:"right"}}>Sup. m²</th>
                  <th style={{textAlign:"right"}}>Precio</th>
                  <th style={{textAlign:"right"}}>$/m²</th>
                </tr>
              </thead>
              <tbody>
                {edit.comparables.map((c, i) => (
                  <tr key={i}>
                    <td style={{color:"var(--mute)",fontWeight:600}}>{i + 1}</td>
                    <td>
                      <input value={c.descripcion || ""} onChange={e => updComp(i, "descripcion", e.target.value)} />
                      <span className="fuente-sub">{c.fuente || "—"}</span>
                    </td>
                    <td className="right">
                      <input className="right" type="number" value={c.superficie_m2 || 0} onChange={e => updComp(i, "superficie_m2", parseFloat(e.target.value) || 0)} />
                    </td>
                    <td className="right">
                      <input className="right" type="number" value={c.precio || 0} onChange={e => updComp(i, "precio", parseFloat(e.target.value) || 0)} />
                    </td>
                    <td className="right" style={{color:"var(--ink)",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtMXN(c.precio_m2_homologado || c.precio_m2_crudo || 0)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* Análisis de zona */}
        {edit.analisis_zona !== undefined && (
          <div className="ui-card">
            <h3>
              Análisis de zona y plusvalía
              {edit.analisis_zona !== resultado.analisis_zona && (
                <button className="restaurar-btn" onClick={() => restaurar("analisis_zona")}>↺ Restaurar</button>
              )}
            </h3>
            <textarea className="ed-textarea"
              value={edit.analisis_zona || ""}
              onChange={e => updEdit("analisis_zona", e.target.value)} />
          </div>
        )}

        {/* Recomendaciones */}
        {edit.recomendaciones && (
          <div className="ui-card">
            <h3>Recomendaciones para el agente</h3>
            {edit.recomendaciones.map((rec, i) => (
              <div key={i} className="rec-item">
                <span className="rec-bullet">›</span>
                <textarea className="rec-input"
                  value={rec}
                  onChange={e => updRec(i, e.target.value)}
                  rows={1} />
                <button className="rec-remove" onClick={() => removeRec(i)}>✕</button>
              </div>
            ))}
            <button className="rec-add" onClick={addRec}>+ Agregar recomendación</button>
          </div>
        )}

        {/* Advertencia */}
        {edit.advertencias !== undefined && (
          <div className="ui-card">
            <h3>
              Nota
              {edit.advertencias !== resultado.advertencias && (
                <button className="restaurar-btn" onClick={() => restaurar("advertencias")}>↺ Restaurar</button>
              )}
            </h3>
            <textarea className="ed-textarea"
              value={edit.advertencias || ""}
              onChange={e => updEdit("advertencias", e.target.value)} />
          </div>
        )}

        <button className="btn-primary" onClick={descargarPDF} disabled={pdfLoading}>
          {pdfLoading ? (
            <>
              <div style={{width:16,height:16,border:"2px solid rgba(255,255,255,.3)",borderTopColor:"white",borderRadius:"50%",animation:"spin .7s linear infinite"}}></div>
              Generando PDF...
            </>
          ) : (
            <>
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              Descargar PDF
            </>
          )}
        </button>
        <button className="btn-secondary" onClick={() => { setEstado("idle"); setResultado(null); setEdit(null); }}>
          Nueva estimación
        </button>

      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EstimacionValor />);
</script>

<script src="app-shell.js" defer></script>
</body>
</html>
