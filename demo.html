<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Broquer — Demo</title>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  background: var(--sky-navy);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-sans);
}
.demo-wrap {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-5);
  color: rgba(255,255,255,.75); font-size: var(--fs-sm);
}
.demo-logo { height: 36px; width: auto; display: block; }
.demo-spin {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.demo-err {
  color: var(--danger); background: var(--danger-soft);
  border: 1px solid var(--danger);
  border-radius: var(--r); padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-sm); max-width: 340px; text-align: center; display: none;
}
</style>
</head>
<body>
<div class="demo-wrap">
  <img class="demo-logo" src="logotipo-white.png" alt="Broquer"
       onerror="this.style.display='none'"/>
  <div class="demo-spin" id="spin"></div>
  <div id="msg" style="text-align:center">Entrando a la demo…</div>
  <div class="demo-err" id="err"></div>
</div>
<script>
(async function () {
  var SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
  var SB_KEY = 'sb_publishable_EVGLfmHVorBpQQWAh-vypA_hANNk_-i';
  var EMAIL  = 'demo@broquer.app';
  var PASS   = '1234567890';

  function mostrarError(texto) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').style.display  = 'none';
    var err = document.getElementById('err');
    err.textContent = texto;
    err.style.display = 'block';
  }

  // Si ya hay un token guardado y no expiró, ir directo — sin round-trip a Supabase.
  try {
    var tokenGuardado = localStorage.getItem('sb_token');
    var expiresAt     = parseInt(localStorage.getItem('sb_expires_at') || '0', 10);
    var ahora         = Math.floor(Date.now() / 1000);
    // Margen de 60 s para evitar falsos positivos al borde de la expiración
    if (tokenGuardado && expiresAt && (expiresAt - ahora) > 60) {
      sessionStorage.setItem('sb_token', tokenGuardado);
      sessionStorage.setItem('sb_user',  localStorage.getItem('sb_user') || '{}');
      window.location.replace('index.html');
      return;
    }
  } catch (_) {}

  try {
    var r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
      body: JSON.stringify({ email: EMAIL, password: PASS }),
    });
    var d = await r.json().catch(function(){ return {}; });

    if (!r.ok || !d.access_token) {
      mostrarError('No se pudo iniciar la demo. Avisa al equipo de Broquer.');
      return;
    }

    try {
      var expiresIn = d.expires_in || 3600;
      localStorage.setItem('sb_token',      d.access_token);
      localStorage.setItem('sb_refresh',    d.refresh_token || '');
      localStorage.setItem('sb_user',       JSON.stringify(d.user || {}));
      localStorage.setItem('sb_expires_at', String(Math.floor(Date.now() / 1000) + expiresIn));
      localStorage.setItem('sesion_activa', 'true');
      sessionStorage.setItem('sb_token',    d.access_token);
      sessionStorage.setItem('sb_user',     JSON.stringify(d.user || {}));
    } catch (_) {}

    window.location.replace('index.html');

  } catch (e) {
    mostrarError('Sin conexión. Revisa tu internet e intenta de nuevo.');
  }
})();
</script>
</body>
</html>
