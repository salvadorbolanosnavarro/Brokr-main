<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Estadísticas · Broquer</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#05203C"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
/* layout owned by app-shell.js (.bk-page is the scroll container) */

.es-body { padding: 0 0 120px; }

/* ── Hero: la tesis de la página, cambia según el tab activo ─────── */
.es-hero {
  position: relative;
  background: var(--sky-navy);
  color: var(--bone);
  padding: 34px 28px 30px;
  overflow: hidden;
  isolation: isolate;
}
.es-hero::before {
  content: '';
  position: absolute; inset: -40% -10% auto auto;
  width: 620px; height: 620px;
  background: radial-gradient(circle, rgba(0,98,227,.55) 0%, rgba(0,98,227,0) 68%);
  z-index: -1;
  pointer-events: none;
}
.es-hero::after {
  content: '';
  position: absolute; inset: auto auto -50% -8%;
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(0,85,204,.35) 0%, rgba(0,85,204,0) 70%);
  z-index: -1;
  pointer-events: none;
}
.es-hero__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.es-hero__brand { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.03em; }
.es-hero__sub { font-size: var(--fs-sm); color: rgba(255,255,255,.62); margin-top: 3px; }

.es-periodo.bk-seg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); }
.es-periodo.bk-seg .bk-seg__btn { color: rgba(255,255,255,.68); }
.es-periodo.bk-seg .bk-seg__btn:hover { color: var(--bone); }
.es-periodo.bk-seg .bk-seg__btn.is-active { background: var(--bone); color: var(--ink); }

.es-hero__main { display: flex; align-items: flex-end; gap: 36px; flex-wrap: wrap; }
.es-hero__figure { font-family: var(--font-display); font-size: 76px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.es-hero__lbl { font-size: var(--fs-body); color: rgba(255,255,255,.72); margin-top: 8px; max-width: 30ch; }
.es-hero__minis { display: flex; gap: 30px; flex-wrap: wrap; padding-bottom: 6px; }
.es-hero__mini-n { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.es-hero__mini-lbl { font-size: var(--fs-xs); color: rgba(255,255,255,.6); margin-top: 2px; }

@media (max-width: 720px) {
  .es-hero { padding: 24px 16px 26px; }
  .es-hero__figure { font-size: 52px; }
  .es-hero__main { gap: 20px; }
  .es-hero__minis { gap: 20px; }
}

/* ── Menú de estadísticas (tabs) ───────────────────────────────── */
.es-tabsbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 0 28px;
}
.es-tabsbar .bk-tabs { border-bottom: none; overflow-x: auto; scrollbar-width: none; }
.es-tabsbar .bk-tabs::-webkit-scrollbar { display: none; }
.es-tabsbar .bk-tab { padding-top: var(--sp-4); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
@media (max-width: 720px) { .es-tabsbar { padding: 0 16px; } }

.es-panel { padding: 24px 28px 0; max-width: 1120px; }
@media (max-width: 720px) { .es-panel { padding: 16px 16px 0; } }
.es-panel[hidden] { display: none; }

/* Sección */
.es-section { margin-bottom: 34px; }
.es-section__hdr { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.es-section__hdr .t { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.es-section__hdr .s { font-size: var(--fs-xs); color: var(--mute); }

/* KPIs */
.es-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 18px; }
.es-kpi { padding: var(--sp-5) var(--sp-5); }
.es-kpi__n { font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.es-kpi__lbl { font-size: var(--fs-xs); color: var(--mute); margin-top: 3px; }
.es-kpi__n.is-good { color: var(--success); }
.es-kpi__n.is-warn { color: var(--warn); }

/* Barras horizontales (fuente / etapa / tipo) */
.es-bars { padding: 4px var(--sp-5); }
.es-bar-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.es-bar-row:last-child { border-bottom: none; }
.es-bar-row__dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.es-bar-row__lbl { width: 152px; flex-shrink: 0; font-size: var(--fs-sm); font-weight: 500; color: var(--ink); letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.es-bar-track { flex: 1; height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.es-bar-fill { height: 100%; border-radius: 4px; transition: width .6s var(--ease); }
.es-bar-row__n { width: 96px; flex-shrink: 0; text-align: right; font-size: var(--fs-xs); color: var(--mute); font-variant-numeric: tabular-nums; }
.es-bar-row__n b { color: var(--ink); font-weight: 700; }

/* Donut + leyenda */
.es-donut-wrap { padding: var(--sp-6); display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
.es-donut-svg circle { transition: stroke-dashoffset .7s var(--ease), stroke-dasharray .7s var(--ease); }
.es-legend { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
.es-legend-row { display: flex; align-items: center; gap: 10px; }
.es-legend-row__dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.es-legend-row__lbl { flex: 1; font-size: var(--fs-sm); color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.es-legend-row__pct { font-size: var(--fs-xs); color: var(--mute); font-variant-numeric: tabular-nums; }
.es-legend-row__n { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }

/* Embudo */
.es-funnel { display: flex; flex-direction: column; gap: 6px; }
.es-funnel-row { display: flex; align-items: center; gap: 14px; }
.es-funnel-row__lbl { width: 112px; flex-shrink: 0; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); text-align: right; }
.es-funnel-bar-wrap { flex: 1; display: flex; justify-content: center; }
.es-funnel-bar {
  height: 38px; border-radius: var(--r); display: flex; align-items: center; justify-content: center;
  color: var(--bone); font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums;
  transition: width .6s var(--ease); min-width: 46px; letter-spacing: -0.01em;
  box-shadow: var(--shadow-xs);
}
.es-funnel-row__pct { width: 54px; flex-shrink: 0; font-size: var(--fs-caption); color: var(--mute); text-align: left; font-variant-numeric: tabular-nums; }

/* Tendencia */
.es-trend-wrap { padding: var(--sp-5) var(--sp-5) var(--sp-3); }
.es-trend-legend { display: flex; gap: 18px; margin-bottom: 6px; flex-wrap: wrap; }
.es-trend-legend__item { display: flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; }
.es-trend-legend__sw { width: 10px; height: 10px; border-radius: 3px; }
.es-trend-svg { width: 100%; height: auto; display: block; }
.es-trend-tip { font-size: 9px; fill: var(--mute); font-family: var(--font-mono); }

/* Lista de inmuebles top */
.es-props { display: flex; flex-direction: column; gap: 8px; }
.es-prop-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.es-prop-row__rank { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; background: var(--paper-2); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); font-weight: 700; }
.es-prop-row__info { flex: 1; min-width: 0; }
.es-prop-row__title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.es-prop-row__sub { font-size: var(--fs-caption); color: var(--mute); margin-top: 1px; }
.es-prop-row__n { font-family: var(--font-display); font-size: var(--fs-sm); color: var(--forest); font-weight: 700; flex-shrink: 0; }

.es-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 20px; gap: 6px; color: var(--mute); }
.es-empty p { font-size: var(--fs-sm); margin: 0; max-width: 340px; line-height: var(--lh); }

.es-loading { padding: 60px 20px; text-align: center; color: var(--mute); font-size: var(--fs-sm); }

@media (max-width: 620px) {
  .es-funnel-row__lbl { width: 78px; font-size: var(--fs-caption); }
  .es-bar-row__lbl { width: 108px; }
  .es-donut-wrap { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  .es-bar-fill, .es-funnel-bar, .es-donut-svg circle { transition: none !important; }
}
</style>
</head>
<body data-app="estadisticas">

<div class="es-hero" id="es-hero">
  <div class="es-hero__top">
    <div>
      <div class="es-hero__brand">Estadísticas</div>
      <div class="es-hero__sub" id="hero-sub">Cargando…</div>
    </div>
    <div class="es-periodo bk-seg" id="es-periodo">
      <button class="bk-seg__btn" data-p="semana" onclick="setPeriodo('semana')">Semana</button>
      <button class="bk-seg__btn" data-p="mes" onclick="setPeriodo('mes')">Mes</button>
      <button class="bk-seg__btn" data-p="trimestre" onclick="setPeriodo('trimestre')">Trimestre</button>
      <button class="bk-seg__btn is-active" data-p="todo" onclick="setPeriodo('todo')">Todo</button>
    </div>
  </div>
  <div class="es-hero__main">
    <div>
      <div class="es-hero__figure" id="hero-figure">—</div>
      <div class="es-hero__lbl" id="hero-lbl">&nbsp;</div>
    </div>
    <div class="es-hero__minis" id="hero-minis"></div>
  </div>
</div>

<div class="es-tabsbar">
  <div class="bk-tabs" id="es-tabs">
    <button class="bk-tab is-active" data-tab="resumen" onclick="setTab('resumen')">Resumen</button>
    <button class="bk-tab" data-tab="leads" onclick="setTab('leads')">Leads</button>
    <button class="bk-tab" data-tab="propiedades" onclick="setTab('propiedades')">Propiedades</button>
  </div>
</div>

<div class="es-body" id="es-body">
  <div class="es-loading">Cargando estadísticas…</div>
</div>

<script src="app-shell.js" defer></script>

<script>
function g(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

async function sbFetch(path) {
  if (!window.brokrSb || !window.brokrSb.rest) {
    throw new Error('La app aún se está cargando. Intenta de nuevo en un segundo.');
  }
  return await window.brokrSb.rest(path, { method: 'GET' });
}

/* ── Etapas del pipeline — mismo criterio que contactos.html/leads.html ── */
const ETAPAS_DEFAULT = [
  { clave:'nuevo',      nombre:'Nuevo',      color:'var(--forest)'  },
  { clave:'activo',     nombre:'Activo',     color:'var(--success)' },
  { clave:'contactado', nombre:'Contactado', color:'var(--warn)'    },
  { clave:'cerrado',    nombre:'Cerrado',    color:'var(--ink-3)'   },
];
let ETAPAS = ETAPAS_DEFAULT.slice();

const ROLES_LBL = {
  arrendador: 'Propietario', arrendatario: 'Inquilino', comprador: 'Comprador',
  vendedor: 'Vendedor', obligado_solidario: 'Oblig. solidario',
  colega: 'Colega', notario: 'Notario', otro: 'Otro',
};
const TIPO_PROP_LBL = {
  casa: 'Casa', departamento: 'Departamento', terreno: 'Terreno',
  local: 'Local comercial', oficina: 'Oficina', bodega: 'Bodega',
};

/* Paleta de acento tomada 1:1 de los tokens de marca (brokr-theme.css) */
const PALETA = ['var(--sky-blue)', 'var(--sky-navy-mid)', 'var(--forest-2)', 'var(--ink-3)', 'var(--sky-navy)', 'var(--mute)', 'var(--ink-2)', 'var(--mute-2)'];

/* ── Estado ──────────────────────────────────────────────────────── */
let contactos = [], props = [], interesRows = [];
let periodoActual = 'todo';
let tabActual = 'resumen';

function fechaDesde(periodo) {
  if (periodo === 'todo') return null;
  const d = new Date();
  d.setHours(0,0,0,0);
  const dias = periodo === 'semana' ? 7 : periodo === 'mes' ? 30 : 90;
  d.setDate(d.getDate() - dias);
  return d;
}
function enPeriodo(iso) {
  if (periodoActual === 'todo') return true;
  if (!iso) return false;
  const desde = fechaDesde(periodoActual);
  return new Date(iso) >= desde;
}

/* ── Carga: un solo lote paralelo ─────────────────────────────────── */
async function cargarTodo() {
  const body = g('es-body');
  body.innerHTML = '<div class="es-loading">Cargando estadísticas…</div>';
  try {
    const [et, c, p, ip] = await Promise.all([
      sbFetch('pipeline_etapas?select=nombre,orden,color&order=orden.asc').catch(() => []),
      sbFetch('contactos?select=id,tipo,estatus,fuente,es_potencial,created_at,fecha_cambio_estatus&limit=5000'),
      sbFetch('propiedades?select=id,titulo,clave_interna,tipo,operacion,estatus,precio,moneda,archivada,created_at,updated_at&limit=3000'),
      sbFetch('contactos_propiedades?select=contacto_id,propiedad_id,relacion&relacion=eq.interes&limit=5000'),
    ]);
    if (Array.isArray(et) && et.length) {
      ETAPAS = et.map(r => ({ clave: String(r.nombre || '').toLowerCase().trim(), nombre: r.nombre, color: r.color || 'var(--forest)' })).filter(e => e.clave);
    }
    contactos = Array.isArray(c) ? c : [];
    props = Array.isArray(p) ? p : [];
    interesRows = Array.isArray(ip) ? ip : [];
    render();
  } catch (e) {
    body.innerHTML = '<div class="es-empty"><p>No se pudieron cargar las estadísticas. ' + esc(e.message || '') + '</p></div>';
  }
}

function setPeriodo(p) {
  periodoActual = p;
  document.querySelectorAll('#es-periodo button').forEach(b => b.classList.toggle('is-active', b.dataset.p === p));
  render();
}

function setTab(t) {
  tabActual = t;
  document.querySelectorAll('#es-tabs .bk-tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === t));
  render();
}

/* ── Utilidades numéricas ──────────────────────────────────────────── */
function sumPorMoneda(items, campo) {
  const out = {};
  items.forEach(p => { const m = p.moneda || 'MXN'; out[m] = (out[m] || 0) + (Number(p[campo]) || 0); });
  return out;
}
function fmtMoneyShort(n, moneda) {
  n = Math.round(n || 0);
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  let s;
  if (abs >= 1e6) s = (abs/1e6).toFixed(abs >= 1e7 ? 0 : 1) + 'M';
  else if (abs >= 1e3) s = Math.round(abs/1e3) + 'k';
  else s = String(abs);
  return sign + '$' + s + ' ' + (moneda || 'MXN');
}
function nf(n) { return Number(n || 0).toLocaleString('es-MX'); }

/* ── Cálculos: Leads ───────────────────────────────────────────────
   "leads" = es_potencial true HOY (snapshot). Un lead que ya se cerró
   pierde esa bandera, así que las fuentes/tipo no arrastran historial
   de contactos que ya se convirtieron — es una limitación conocida
   del esquema actual, no del cálculo. */
function calcResumenLeads() {
  const nuevosEnP = contactos.filter(c => enPeriodo(c.created_at));
  const leadsActivos = contactos.filter(c => c.es_potencial);
  const leadsNuevosEnP = leadsActivos.filter(c => enPeriodo(c.created_at));
  const ultimaEtapa = ETAPAS.length ? ETAPAS[ETAPAS.length - 1].clave : 'cerrado';
  const cerradosEnP = nuevosEnP.filter(c => String(c.estatus||'nuevo').toLowerCase() === ultimaEtapa);
  const tasaCierre = nuevosEnP.length ? Math.round((cerradosEnP.length / nuevosEnP.length) * 100) : 0;

  const conCambio = nuevosEnP.filter(c => c.fecha_cambio_estatus && c.created_at && c.fecha_cambio_estatus !== c.created_at);
  let diasProm = null;
  if (conCambio.length) {
    const totalDias = conCambio.reduce((acc, c) => acc + (new Date(c.fecha_cambio_estatus) - new Date(c.created_at)) / 86400000, 0);
    diasProm = Math.round(totalDias / conCambio.length);
  }
  return {
    contactosTotales: contactos.length,
    contactosNuevos: nuevosEnP.length,
    leadsActivos: leadsActivos.length,
    leadsNuevos: leadsNuevosEnP.length,
    tasaCierre, cerrados: cerradosEnP.length,
    diasProm, conCambio: conCambio.length,
  };
}

function calcFuentesLeads() {
  const leads = contactos.filter(c => c.es_potencial);
  const enP = leads.filter(c => enPeriodo(c.created_at));
  const porFuente = {};
  enP.forEach(c => { const f = c.fuente || 'Sin especificar'; porFuente[f] = (porFuente[f] || 0) + 1; });
  const arr = Object.entries(porFuente).sort((a,b) => b[1]-a[1]);
  return { total: enP.length, arr };
}

function calcTipoLeads() {
  const leads = contactos.filter(c => c.es_potencial);
  const enP = leads.filter(c => enPeriodo(c.created_at));
  const porTipo = {};
  enP.forEach(c => { const t = c.tipo || 'otro'; porTipo[t] = (porTipo[t] || 0) + 1; });
  const arr = Object.entries(porTipo).sort((a,b) => b[1]-a[1]);
  return { total: enP.length, arr };
}

function calcEmbudo() {
  const enP = contactos.filter(c => enPeriodo(c.created_at));
  const porEtapa = {};
  enP.forEach(c => { const k = String(c.estatus || 'nuevo').toLowerCase(); porEtapa[k] = (porEtapa[k] || 0) + 1; });
  const stages = ETAPAS.map(e => ({ ...e, n: porEtapa[e.clave] || 0 }));
  return { total: enP.length, stages };
}

/* ── Cálculos: Propiedades ─────────────────────────────────────────
   "cerradas" (vendida/rentada) se detecta con estatus + updated_at
   como aproximación de la fecha de cierre: no hay columna dedicada de
   fecha de venta en el esquema actual, así que updated_at puede
   moverse por otras ediciones del inmueble. Es la mejor señal
   disponible sin agregar una columna nueva. */
function calcResumenPropiedades() {
  const captadasEnP = props.filter(p => enPeriodo(p.created_at));
  const cerradas = props.filter(p => ['vendida','rentada'].includes(p.estatus) && enPeriodo(p.updated_at));
  const vendidas = cerradas.filter(p => p.estatus === 'vendida');
  const rentadas = cerradas.filter(p => p.estatus === 'rentada');
  const valorPorMoneda = sumPorMoneda(cerradas, 'precio');
  const inventarioActivo = props.filter(p => !p.archivada && p.estatus === 'activa').length;

  const conAmbasFechas = cerradas.filter(p => p.created_at && p.updated_at);
  let diasMercadoProm = null;
  if (conAmbasFechas.length) {
    const totalDias = conAmbasFechas.reduce((acc,p) => acc + (new Date(p.updated_at) - new Date(p.created_at))/86400000, 0);
    diasMercadoProm = Math.round(totalDias / conAmbasFechas.length);
  }
  return {
    captadas: captadasEnP.length,
    cerradas: cerradas.length, vendidas: vendidas.length, rentadas: rentadas.length,
    valorPorMoneda, diasMercadoProm,
    inventarioActivo, inventarioTotal: props.filter(p => !p.archivada).length,
  };
}

function calcTipoPropiedadesCaptadas() {
  const enP = props.filter(p => enPeriodo(p.created_at));
  const porTipo = {};
  enP.forEach(p => { const t = p.tipo || 'otro'; porTipo[t] = (porTipo[t] || 0) + 1; });
  const arr = Object.entries(porTipo).sort((a,b) => b[1]-a[1]);
  return { total: enP.length, arr };
}

function calcCierreVentaRenta() {
  const cerradas = props.filter(p => ['vendida','rentada'].includes(p.estatus) && enPeriodo(p.updated_at));
  const vendidas = cerradas.filter(p => p.estatus === 'vendida').length;
  const rentadas = cerradas.filter(p => p.estatus === 'rentada').length;
  return { total: cerradas.length, vendidas, rentadas };
}

function calcInmuebles() {
  const activos = props.filter(p => !p.archivada).length;
  const contactoIdx = Object.fromEntries(contactos.map(c => [String(c.id), c]));
  const conteo = {}, conteoPot = {};
  interesRows.forEach(r => {
    const pid = String(r.propiedad_id);
    conteo[pid] = (conteo[pid] || 0) + 1;
    const contacto = contactoIdx[String(r.contacto_id)];
    if (contacto && contacto.es_potencial) conteoPot[pid] = (conteoPot[pid] || 0) + 1;
  });
  const propIdx = Object.fromEntries(props.map(p => [String(p.id), p]));
  const top = Object.entries(conteo)
    .map(([id, n]) => ({ prop: propIdx[String(id)], n, potenciales: conteoPot[id] || 0 }))
    .filter(x => x.prop)
    .sort((a,b) => b.n - a.n)
    .slice(0, 8);
  return { activos, total: props.length, top };
}

/* ── Series temporales compartidas (leads / propiedades) ──────────── */
function bucketConfig(periodo) {
  if (periodo === 'semana') return { unit:'day', n:7,  fmt: d => d.toLocaleDateString('es-MX',{weekday:'short'}) };
  if (periodo === 'mes')    return { unit:'day', n:30, fmt: d => d.getDate() + '/' + (d.getMonth()+1) };
  if (periodo === 'trimestre') return { unit:'week', n:13, fmt: d => d.getDate() + '/' + (d.getMonth()+1) };
  return { unit:'month', n:12, fmt: d => d.toLocaleDateString('es-MX',{month:'short'}) };
}
function buildBuckets(periodo) {
  const cfg = bucketConfig(periodo);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const buckets = [];
  for (let i = cfg.n - 1; i >= 0; i--) {
    const d = new Date(hoy);
    if (cfg.unit === 'day') d.setDate(d.getDate() - i);
    else if (cfg.unit === 'week') d.setDate(d.getDate() - i * 7);
    else d.setMonth(d.getMonth() - i, 1);
    buckets.push({ date: d });
  }
  return { cfg, buckets };
}
function countSeries(items, dateField, bb) {
  const { cfg, buckets } = bb;
  const counts = new Array(buckets.length).fill(0);
  items.forEach(it => {
    const raw = it[dateField];
    if (!raw) return;
    const cd = new Date(raw);
    for (let i = buckets.length - 1; i >= 0; i--) {
      const b = buckets[i];
      let within;
      if (cfg.unit === 'day') within = cd.toDateString() === b.date.toDateString();
      else if (cfg.unit === 'week') { const start = new Date(b.date); const end = new Date(b.date); end.setDate(end.getDate()+7); within = cd >= start && cd < end; }
      else within = cd.getFullYear() === b.date.getFullYear() && cd.getMonth() === b.date.getMonth();
      if (within) { counts[i]++; break; }
    }
  });
  return counts;
}

/* ── Helpers de render ─────────────────────────────────────────────── */
function barra(color, pct) {
  return `<div class="es-bar-track"><div class="es-bar-fill" style="width:${Math.max(pct,3)}%;background:${color}"></div></div>`;
}

function renderDonut(entries, centroLbl, centroSub) {
  const total = entries.reduce((a,x) => a + x.n, 0);
  const R = 52, C = 2 * Math.PI * R;
  let offset = 0;
  const segs = !total ? '' : entries.map(e => {
    const frac = e.n / total;
    const len = frac * C;
    const dasharray = `${len} ${C - len}`;
    const dashoffset = -offset;
    offset += len;
    return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${e.color}" stroke-width="18"
      stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 70 70)">
      <title>${esc(e.label)}: ${e.n} (${Math.round(frac*100)}%)</title>
    </circle>`;
  }).join('');
  return `<svg viewBox="0 0 140 140" width="140" height="140" class="es-donut-svg">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--paper-2)" stroke-width="18"/>
    ${segs}
    <text x="70" y="66" text-anchor="middle" font-family="var(--font-display)" font-size="22" font-weight="700" fill="var(--ink)">${esc(centroLbl)}</text>
    <text x="70" y="84" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--mute)">${esc(centroSub)}</text>
  </svg>`;
}

function renderLegend(entries) {
  const total = entries.reduce((a,x) => a + x.n, 0) || 1;
  return `<div class="es-legend">${entries.map(e => `
    <div class="es-legend-row">
      <span class="es-legend-row__dot" style="background:${e.color}"></span>
      <span class="es-legend-row__lbl">${esc(e.label)}</span>
      <span class="es-legend-row__pct">${Math.round((e.n/total)*100)}%</span>
      <span class="es-legend-row__n">${e.n}</span>
    </div>`).join('')}</div>`;
}

function renderBarsList(entries, opts) {
  opts = opts || {};
  const max = Math.max(1, ...entries.map(e => e.n));
  const total = entries.reduce((a,x)=>a+x.n,0) || 1;
  return `<div class="es-bars">${entries.map(e => `
    <div class="es-bar-row">
      <div class="es-bar-row__lbl"><span class="es-bar-row__dot" style="background:${e.color}"></span>${esc(e.label)}</div>
      ${barra(e.color, (e.n/max)*100)}
      <div class="es-bar-row__n"><b>${e.n}</b> · ${Math.round((e.n/total)*100)}%</div>
    </div>`).join('')}</div>`;
}

function renderTrendMulti(bb, series) {
  const { buckets, cfg } = bb;
  const W = 900, H = 210, PAD_L = 30, PAD_B = 24, PAD_T = 14, PAD_R = 10;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
  const maxN = Math.max(1, ...series.flatMap(s => s.counts));
  const stepX = buckets.length > 1 ? innerW / (buckets.length - 1) : innerW;

  const seriesSvg = series.map((s, si) => {
    const pts = s.counts.map((n, i) => {
      const x = PAD_L + i * stepX;
      const y = PAD_T + innerH - (n / maxN) * innerH;
      return [x, y];
    });
    const line = pts.map((p,i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    let fillPath = '';
    if (series.length === 1) {
      fillPath = `<path d="${line} L${pts[pts.length-1][0].toFixed(1)},${PAD_T+innerH} L${pts[0][0].toFixed(1)},${PAD_T+innerH} Z" fill="url(#trendGrad${si})" stroke="none"/>`;
    }
    const dots = pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"><title>${esc(s.label)} · ${esc(cfg.fmt(buckets[i].date))}: ${s.counts[i]}</title></circle>`).join('');
    return `
      <defs><linearGradient id="trendGrad${si}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${fillPath}
      <path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}`;
  }).join('');

  const showEvery = Math.ceil(buckets.length / 8);
  const labels = buckets.map((b,i) => {
    if (i % showEvery !== 0 && i !== buckets.length-1) return '';
    const x = PAD_L + i * stepX;
    return `<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle" class="es-trend-tip">${esc(cfg.fmt(b.date))}</text>`;
  }).join('');

  const legend = series.length > 1 ? `<div class="es-trend-legend">${series.map(s => `
    <div class="es-trend-legend__item"><span class="es-trend-legend__sw" style="background:${s.color}"></span>${esc(s.label)}</div>
  `).join('')}</div>` : '';

  return legend + `<svg viewBox="0 0 ${W} ${H}" class="es-trend-svg" preserveAspectRatio="none">
    <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+innerH}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${PAD_L}" y1="${PAD_T+innerH}" x2="${W-PAD_R}" y2="${PAD_T+innerH}" stroke="var(--line)" stroke-width="1"/>
    ${seriesSvg}
    ${labels}
  </svg>`;
}

/* ── Animación de conteo (respeta prefers-reduced-motion) ─────────── */
function animateNumber(el, to, fmt) {
  fmt = fmt || (n => nf(n));
  if (REDUCE_MOTION || to === 0) { el.textContent = fmt(to); return; }
  const dur = 800;
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(to * eased));
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  } else {
    sub.textContent = 'Tu negocio de un vistazo, ' + periodoLbl;

    const monedas = Object.keys(RP.valorPorMoneda);
    const principal = monedas.sort((a,b) => RP.valorPorMoneda[b]-RP.valorPorMoneda[a])[0] || 'MXN';
    minis.innerHTML = `

      <div><div class="es-hero__mini-n" id="hm-2">0</div><div class="es-hero__mini-lbl">Inmuebles captados ${periodoLbl}</div></div>
      <div><div class="es-hero__mini-n" id="hm-3">0</div><div class="es-hero__mini-lbl">Inmuebles cerrados ${periodoLbl}</div></div>`;
    animateNumber(g('hm-1'), RL.leadsNuevos);
    animateNumber(g('hm-2'), RP.captadas);
    animateNumber(g('hm-3'), RP.cerradas);
  }
}

  const RL = calcResumenLeads();

  else body.innerHTML = panelResumen(RL, RP);
}
