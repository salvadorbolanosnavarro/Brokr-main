<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover"/>
<title>Broquer — Ficha Técnica</title>
<meta name="theme-color" content="#05203C"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
/* ─── App UI (chat above the document preview) ─────────────────── */
*{box-sizing:border-box;margin:0;padding:0}

#app-ui{
  max-width: 520px; margin: 0 auto;
  padding: 24px 20px 60px;
}

.ui-card{
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
  margin-bottom: 14px;
}
.ui-card h2{
  font-family: var(--font-display);
  font-size: 18px; font-weight: 600;
  letter-spacing: -0.018em;
  color: var(--ink);
  margin-bottom: 4px;
}
.ui-card p{
  font-size: 13px;
  color: var(--mute);
  margin-bottom: 16px;
  line-height: 1.5;
}

.ui-input-row{ display: flex; gap: 10px; }
@media (max-width: 768px){ .ui-input-row{ flex-direction: column; } }

.ui-input{
  flex: 1;
  height: 48px;
  padding: 0 14px;
  background: var(--bone);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  color: var(--ink);
  font-size: 14px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.ui-input:focus{
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(22,22,22,0.06);
}
.ui-input::placeholder{ color: var(--mute-2); }

.ui-btn{
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 18px;
  background: var(--ink);
  color: var(--bone);
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  font-size: 13px; font-weight: 600;
  font-family: var(--font-sans);
  letter-spacing: -0.005em;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.ui-btn:hover{ background: var(--ink-2); }
.ui-btn:active{ transform: scale(.98); }
.ui-btn.forest{ background: var(--forest); }
.ui-btn.forest:hover{ background: var(--forest-2); }

#print-bar{
  display: none;
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 14px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#print-bar.show{ display: flex; }
#print-bar span{
  font-size: 13px;
  color: var(--mute);
  font-weight: 500;
}

.ui-error{
  background: var(--danger-soft);
  border: 1px solid var(--danger);
  border-radius: var(--r);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--danger);
  margin-top: 10px;
  display: none;
}

.ui-loading{
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  gap: 12px;
}
.ui-loading.show{ display: flex; }
.spinner{
  width: 28px; height: 28px;
  border: 2.5px solid var(--paper-2);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.ui-loading p{
  font-size: 13px;
  color: var(--mute);
  font-weight: 500;
}

/* ─── FICHA (preview container) ─────────────── */
#ficha{ display: none; margin-bottom: 40px; }
#ficha.show{ display: block; }

/* ═══════════════════════════════════════════════
   FICHA PAGE — A4 exact (this becomes the PDF)
═══════════════════════════════════════════════ */
.ficha-page{
  width: 210mm;
  background: var(--bone);
  margin: 0 auto 24px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--r);
}

/* ─── COVER (page 1) ─────────────────────────── */
.cover-hero{
  width: 100%;
  height: 110mm;
  object-fit: cover;
  display: block;
  flex-shrink: 0;
}
.cover-hero-placeholder{
  width: 100%; height: 110mm;
  background: linear-gradient(135deg, var(--ink), var(--ink-2));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.cover-info{
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
}
.cover-badge{
  display: inline-block;
  background: var(--forest);
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  margin-bottom: 10px;
}
.cover-precio{
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1;
  margin-bottom: 6px;
}
.cover-titulo{
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}
.cover-ubicacion{
  font-size: 12px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* specs strip */
.cover-specs{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--line);
}
.spec-item{
  padding: 12px 16px;
  text-align: center;
  border-right: 1px solid var(--line);
}
.spec-item:last-child{ border-right: none; }
.spec-ico{
  width: 24px; height: 24px;
  margin: 0 auto 6px;
  color: var(--mute);
}
.spec-ico svg{ width: 100%; height: 100%; }
.spec-val{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.spec-lbl{
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mute);
  margin-top: 3px;
}

/* description */
.cover-desc-wrap{
  padding: 16px 24px;
  flex: 1;
}
.cover-desc-ttl{
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  display: inline-block;
  letter-spacing: -0.015em;
}
.cover-desc{
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.65;
}

/* ─── GALLERY PAGES ──────────────────────────── */
.gallery-header{
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
}
.photo-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 82mm 82mm 82mm;
  gap: 3px;
  padding: 3px;
  height: 246mm;
  overflow: hidden;
  flex-shrink: 0;
}
.photo-grid img{
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* ─── CARACTERÍSTICAS PAGE ───────────────────── */
.chars-header{
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--line);
}
.chars-header h2{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
}
.chars-body{
  padding: 16px 24px;
  flex: 1;
}
.char-table{
  width: 100%;
  border-collapse: collapse;
}
.char-table tr{
  border-bottom: 1px solid var(--line);
}
.char-table tr:last-child{ border-bottom: none; }
.char-table td{
  padding: 8px 12px;
  font-size: 12px;
  vertical-align: middle;
}
.char-table td:first-child{
  color: var(--mute);
  width: 42%;
  font-weight: 400;
}
.char-table td:last-child{
  color: var(--ink);
  font-weight: 500;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.char-table tr:nth-child(even) td{ background: var(--paper-2); }

.amen-section{ margin-top: 16px; }
.amen-ttl{
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--mute);
  margin-bottom: 8px;
}
.amen-grid{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.amen-item{
  font-size: 11px;
  padding: 5px 10px;
  background: var(--paper-2);
  border-radius: var(--r-pill);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

/* ─── FOOTER (en cada página del PDF) ────────── */
.ficha-footer{
  width: 100%;
  height: 40px;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}
.ft-logo img{
  height: 22px;
  width: auto;
  display: block;
}
.ft-id{
  font-family: var(--font-mono);
  font-size: 9px;
  color: rgba(255,255,255,.55);
  letter-spacing: .08em;
}

/* ─── PRINT (para que el PDF salga bien) ─────── */
@media print{
  *{
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  html, body{ margin: 0; padding: 0; background: white; }
  #app-ui{ display: none; }
  #ficha{ display: block; margin: 0; }
  .ficha-page{
    width: 210mm;
    height: 297mm;
    margin: 0;
    padding: 0;
    box-shadow: none;
    border: none;
    border-radius: 0;
    page-break-after: always;
    page-break-inside: avoid;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .ficha-page:last-child{ page-break-after: avoid; }
  .cover-hero, .cover-hero-placeholder{ height: 110mm; }
  .photo-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 82mm 82mm 82mm;
    gap: 3px;
    padding: 3px;
    flex-shrink: 0;
    height: 246mm;
    overflow: hidden;
  }
  .photo-grid img{ width: 100%; height: 100%; object-fit: cover; }
  .chars-body{ overflow: hidden; }
  .cover-desc-wrap{ overflow: hidden; }
  @page{ size: A4 portrait; margin: 0; }
}

/* ─── MOBILE ─────────────────────────────────── */
@media(max-width: 768px){
  #app-ui{ padding: 20px 16px 40px; }
  .ficha-page{ width: 100%; margin-bottom: 12px; }
  .cover-hero, .cover-hero-placeholder{ height: 55vw; }
  .cover-specs{ grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body data-app="ficha">

<!-- ═══ APP UI ═══════════════════════════════ -->
<div id="app-ui">

  <div class="ui-card">
    <h2>Ficha Técnica</h2>
    <p>Ingresa el ID de la propiedad en EasyBroker para generar la ficha.</p>
    <div class="ui-input-row">
      <input class="ui-input" id="prop-id" type="text" placeholder="EB-AB1234" autocomplete="off"
             onkeydown="if(event.key==='Enter') generarFicha()"/>
      <button class="ui-btn" onclick="generarFicha()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        Generar
      </button>
    </div>
    <div class="ui-error" id="err-msg"></div>
  </div>

  <div class="ui-loading" id="loading">
    <div class="spinner"></div>
    <p id="loading-txt">Cargando...</p>
  </div>

  <div id="print-bar">
    <span id="print-bar-txt">Ficha lista</span>
    <button class="ui-btn forest" id="pdf-btn" onclick="descargarPDF()">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      Descargar PDF
    </button>
  </div>
</div>

<!-- ═══ FICHA ════════════════════════════════ -->
<div id="ficha"></div>

<script>
const API = 'https://api.broquer.app';

function g(id){ return document.getElementById(id); }

function fmt(n){
  if(!n && n!==0) return '—';
  return '$' + new Intl.NumberFormat('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0}).format(n);
}
function fmtM2(n){
  if(!n) return '—';
  return new Intl.NumberFormat('es-MX').format(n) + ' m²';
}

function setLoading(show, txt='Cargando...'){
  const el = g('loading');
  if(show){ el.classList.add('show'); g('loading-txt').textContent = txt; }
  else    { el.classList.remove('show'); }
}
function showError(msg){ const e=g('err-msg'); e.textContent=msg; e.style.display='block'; }
function hideError(){ const e=g('err-msg'); e.style.display='none'; }

// ── FOOTER ──────────────────────────────────────
function footer(id){
  return `<div class="ficha-footer">
    <div class="ft-logo"><img src="logotipo-white.png" alt="Broquer" style="height: 22px; width: auto;"/></div>
    ${id ? `<div class="ft-id">${id}</div>` : ''}
  </div>`;
}

// ── ICONOS PARA SPECS (SVG en lugar de emojis) ──
const SPEC_ICONS = {
  bed:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 18v-6a3 3 0 013-3h12a3 3 0 013 3v6M3 18h18M3 18v2m18-2v2M7 12V8a1 1 0 011-1h3a1 1 0 011 1v4"/></svg>',
  bath:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12V6a2 2 0 012-2h2a2 2 0 012 2M3 12h18v3a4 4 0 01-4 4H7a4 4 0 01-4-4v-3zM6 19v2m12-2v2"/></svg>',
  area:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4z M4 8h16 M4 16h16 M8 4v16 M16 4v16"/></svg>',
  land:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12c2-1 4-2 6-2s4 2 6 2 4-1 6-2v8H3v-6z M3 12V8 M21 10V6"/></svg>',
  parking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M5 17a2 2 0 104 0 2 2 0 00-4 0zM15 17a2 2 0 104 0 2 2 0 00-4 0zM3 17h2m4 0h6 M5 17V9l2-4h10l2 4v8h-2"/></svg>',
};

// ── IMAGE → BASE64 via Railway proxy ─────────────────
async function imgToBase64(url) {
  if(!url) return null;
  try {
    const proxyUrl = `https://api.broquer.app/img?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    if(!res.ok) return url; // fallback to original URL
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror  = () => resolve(url);
      reader.readAsDataURL(blob);
    });
  } catch(e) {
    return url; // fallback
  }
}

async function convertAllImages(fotos) {
  const MAX = 30; // cap to avoid memory issues
  const limited = fotos.slice(0, MAX);
  const converted = await Promise.all(
    limited.map(async (f) => {
      const url = f.url || f.original || null;
      if(!url) return f;
      const b64 = await imgToBase64(url);
      return { ...f, url: b64 || url };
    })
  );
  return converted;
}

// ── RENDER ──────────────────────────────────────
let _propData = null; // store for PDF generation

function renderFicha(p){
  _propData = p;
  const id      = p.public_id || p.id || '';
  const titulo  = p.title || p.property_type || 'Propiedad';
  const op      = p.operations?.[0];
  const tipo_op = op?.type === 'sale' ? 'EN VENTA' : op?.type === 'rental' ? 'EN RENTA' : 'EN VENTA';
  const precio  = op ? `${fmt(op.amount)} ${op.currency||'MXN'}` : '—';
  const ciudad  = p.location?.city || '';
  const colonia = p.location?.name || '';
  const dir     = p.address || '';
  const ubic    = [colonia,ciudad].filter(Boolean).join(', ') || dir || '—';
  const rec     = p.bedrooms;
  const ban     = p.bathrooms;
  const mban    = p.half_bathrooms;
  const m2c     = p.construction_size;
  const m2t     = p.lot_size;
  const parking = p.parking_spaces;
  const pisos   = p.floors;
  const edad    = p.age;
  const desc    = (p.description||'').replace(/<[^>]*>/g,'').trim();
  const amenids = p.amenities || [];
  const fotos   = p.property_images || [];
  const tipo_inm= p.property_type || '';

  // ── BUILD SPECS ──
  const specs = [];
  if(rec)     specs.push({ico:SPEC_ICONS.bed,    val:rec,    lbl:'Recámaras'});
  if(ban)     specs.push({ico:SPEC_ICONS.bath,   val:ban,    lbl:'Baños'});
  if(m2c)     specs.push({ico:SPEC_ICONS.area,   val:m2c,    lbl:'m² Const.'});
  if(m2t)     specs.push({ico:SPEC_ICONS.land,   val:m2t,    lbl:'m² Terreno'});
  if(parking && specs.length<4) specs.push({ico:SPEC_ICONS.parking, val:parking, lbl:'Estacion.'});

  const specsHTML = specs.length ? `<div class="cover-specs">
    ${specs.slice(0,4).map(s=>`<div class="spec-item">
      <div class="spec-ico">${s.ico}</div>
      <div class="spec-val">${s.val}</div>
      <div class="spec-lbl">${s.lbl}</div>
    </div>`).join('')}
  </div>` : '';

  // ── HERO PHOTO ──
  const hero = fotos[0]?.url || fotos[0]?.original || null;
  const heroHTML = hero
    ? `<img class="cover-hero" src="${hero}" alt="portada"/>`
    : `<div class="cover-hero-placeholder"></div>`;

  // ── PAGE 1: PORTADA ──
  let pages = `
  <div class="ficha-page">
    ${heroHTML}
    <div class="cover-info">
      <div class="cover-badge">${tipo_op}</div>
      <div class="cover-precio">${precio}</div>
      <div class="cover-titulo">${titulo}</div>
      <div class="cover-ubicacion">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        ${ubic}
      </div>
    </div>
    ${specsHTML}
    ${desc ? `<div class="cover-desc-wrap">
      <div class="cover-desc-ttl">Descripción</div>
      <div class="cover-desc">${desc}</div>
    </div>` : '<div style="flex:1"></div>'}
    ${footer(id)}
  </div>`;

  // ── GALLERY PAGES (6 fotos per page) ──
  const galleryFotos = fotos.slice(1).map(f=>f.url||f.original).filter(Boolean);
  for(let i=0; i<galleryFotos.length; i+=6){
    const batch = galleryFotos.slice(i, i+6);
    // Pad to 6 if needed for grid
    while(batch.length < 6) batch.push(null);
    pages += `
    <div class="ficha-page">
      <div class="gallery-header"><h2>Galería fotográfica</h2></div>
      <div class="photo-grid">
        ${batch.map(src => src
          ? `<img src="${src}" alt="foto"/>`
          : `<div style="background:var(--paper-2)"></div>`
        ).join('')}
      </div>
      ${footer(id)}
    </div>`;
  }

  // ── CHARACTERISTICS TABLE ──
  const rows = [];
  if(tipo_inm) rows.push(['Tipo de inmueble', tipo_inm]);
  if(tipo_op)  rows.push(['Operación', tipo_op]);
  if(precio)   rows.push(['Precio', precio]);
  if(rec)      rows.push(['Recámaras', rec]);
  if(ban)      rows.push(['Baños completos', ban]);
  if(mban)     rows.push(['Medios baños', mban]);
  if(m2c)      rows.push(['Superficie construida', fmtM2(m2c)]);
  if(m2t)      rows.push(['Superficie de terreno', fmtM2(m2t)]);
  if(parking)  rows.push(['Estacionamientos', parking]);
  if(pisos)    rows.push(['Niveles', pisos]);
  if(edad){
    const yr = parseInt(edad);
    const now = new Date().getFullYear();
    if(yr>1900 && yr<=now){
      const diff = now - yr;
      rows.push(['Antigüedad', diff===0 ? 'Nuevo' : diff+(diff===1?' año':' años')]);
    } else {
      rows.push(['Antigüedad', edad+' años']);
    }
  }
  if(colonia)  rows.push(['Colonia', colonia]);
  if(ciudad)   rows.push(['Ciudad', ciudad]);
  if(id)       rows.push(['Clave', id]);

  const amenHTML = amenids.length ? `
    <div class="amen-section">
      <div class="amen-ttl">Amenidades</div>
      <div class="amen-grid">${amenids.map(a=>`<div class="amen-item">${a.name||a}</div>`).join('')}</div>
    </div>` : '';

  pages += `
  <div class="ficha-page">
    <div class="chars-header"><h2>Características del inmueble</h2></div>
    <div class="chars-body">
      <table class="char-table">
        <tbody>
          ${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
        </tbody>
      </table>
      ${amenHTML}
    </div>
    ${footer(id)}
  </div>`;

  const el = g('ficha');
  el.innerHTML = pages;
  el.classList.add('show');
  g('print-bar').classList.add('show');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── DESCARGA PDF VÍA RAILWAY ─────────────────────────────────
async function descargarPDF(){
  if(!_propData){ alert('Genera primero la ficha.'); return; }
  const btn = document.getElementById('pdf-btn');
  const txt = document.getElementById('print-bar-txt');
  const id  = _propData.public_id || _propData.id || 'ficha';
  const colonia = (_propData?.location?.name || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
  const filename = ('Ficha' + (colonia ? '_' + colonia : '') + '.pdf');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Generando PDF...';
  txt.textContent = 'Preparando tu ficha...';
  let blob = null;
  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 120000);
    const res = await fetch(API + '/ficha-pdf', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(_propData),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if(!res.ok) throw new Error('Error servidor: ' + res.status);
    blob = await res.blob();
  } catch(e){
    if(e.name === 'AbortError') alert('Tiempo agotado. Intenta de nuevo.');
    else alert('Error generando PDF: ' + e.message);
    txt.textContent = 'Ficha lista';
    btn.disabled = false;
    btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Descargar PDF';
    return;
  }

  // PDF ready — now deliver it
  const file = new File([blob], filename, {type:'application/pdf'});
  const canShare = navigator.share && navigator.canShare && navigator.canShare({files:[file]});

  const downloadBtnHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Descargar / Compartir PDF';

  try {
    if (window.broquerDeliverBlob) {
      await window.broquerDeliverBlob(blob, filename, { type:'application/pdf', title:'Ficha lista', text:'Ficha técnica generada por Broquer' });
    } else if (canShare) {
      await navigator.share({title:'Ficha ' + id, files:[file]});
    } else {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener');
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }
    txt.textContent = 'Ficha lista — comparte desde la pantalla';
  } finally {
    btn.disabled = false;
    btn.innerHTML = downloadBtnHTML;
  }
}

// ── FETCH ────────────────────────────────────────
async function generarFicha(){
  hideError();
  const id = g('prop-id').value.trim().toUpperCase();
  if(!id){ showError('Ingresa el ID de la propiedad.'); return; }
  setLoading(true,'Consultando EasyBroker...');
  try{
    // Multi-tenant: mandamos el token de Supabase del usuario logueado.
    // El backend identifica al usuario y saca SU API key de EasyBroker de forma segura.
    // La API key real nunca pasa por el frontend.
    let sbToken = '';
    try { sbToken = window.parent?.localStorage?.getItem('sb_token') || ''; } catch(e){}
    if (!sbToken) { try { sbToken = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token') || ''; } catch(e){} }
    const fetchHeaders = sbToken ? { 'Authorization': 'Bearer ' + sbToken } : {};
    const res = await fetch(`${API}/propiedad/${encodeURIComponent(id)}`, { headers: fetchHeaders });
    if(!res.ok){
      let d='Error al consultar la propiedad';
      try{const j=await res.json();d=j.detail||d;}catch(e){}
      throw new Error(d);
    }
    const p = await res.json();
    setLoading(false, 'Optimizando imágenes para PDF...');
    // Convert images to base64 for reliable PDF printing on all devices
    if(p.property_images && p.property_images.length) {
      setLoading(true, 'Preparando ' + p.property_images.length + ' fotos...');
      p.property_images = await convertAllImages(p.property_images);
    }
    setLoading(false);
    renderFicha(p);
  } catch(e){
    setLoading(false);
    showError(e.message||'Error desconocido');
  }
}

// ══ SHAARK — cargar propiedad vía postMessage ══
window.addEventListener('message', function(e) {
  const d = e.data;
  if (!d || d.tipo !== 'crear_ficha') return;
  if (d.id_easybroker) {
    const inp = document.getElementById('prop-id');
    if (inp) {
      inp.value = String(d.id_easybroker).toUpperCase();
      generarFicha();
    }
  }
});
