  {

    resumen: 'Dos estudios clásicos de gestión de leads (MIT 2007 y Harvard Business Review 2011) miden algo incómodo: la probabilidad de calificar a un prospecto se desploma en los primeros minutos, y la empresa promedio tarda 42 horas en contestar. En México, donde la mensajería instantánea es la aplicación más usada del país según el INEGI, ese hueco se paga en comisiones. Este artículo explica qué resuelve una recepción automática en WhatsApp, qué es la coexistencia, cuál es la letra chica de Meta y qué te exige a ti la LFPDPPP cuando una IA califica a tus prospectos.',
    fuentes: [
      { texto: 'INEGI — ENDUTIH 2025, reporte de resultados (16 jun 2026): uso de aplicaciones en smartphone', url: 'https://www.inegi.org.mx/contenidos/saladeprensa/boletines/2026/endutih/ENDUTIH_25_RR.pdf' },
      { texto: 'Oldroyd, McElheran y Elkington — "The Short Life of Online Sales Leads", Harvard Business Review 89(3), marzo 2011', url: 'https://hbr.org/2011/03/the-short-life-of-online-sales-leads' },
      { texto: 'Lead Response Management Study — Dr. James Oldroyd, MIT Sloan / InsideSales.com (2007)', url: 'https://www.hbs.edu/faculty/Pages/item.aspx?num=39955' },

      { texto: 'WhatsApp — Política de Mensajería para Empresas', url: 'https://business.whatsapp.com/policy' },
      { texto: 'Ley Federal de Protección de Datos Personales en Posesión de los Particulares — DOF 20 mar 2025, última reforma DOF 14 nov 2025', url: 'https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPDPPP.pdf' },
    ],
    contenido: `
<div class="bl-art-head">
  <div class="bl-art-head__cat">Tecnología / Operación</div>
  <h1>El primero que contesta se lleva el trato: qué hace realmente un WhatsApp con recepción automática</h1>
  <p class="bl-art-head__sub">El 90.6% de los mexicanos con smartphone usa mensajería instantánea. Tu prospecto ya está en WhatsApp. El problema no es el canal: es que tú duermes y él no espera.</p>
  <div class="bl-art-head__meta">
    <span>Broquer Research</span>
    <span class="dot"></span>
    <span>16 de julio de 2026</span>
    <span class="dot"></span>
    <span>11 min de lectura</span>
  </div>
</div>

<div class="bl-art-body">

<h2>El canal ya está decidido, y no lo decidiste tú</h2>
<p>La ENDUTIH 2025 del INEGI, publicada en junio de 2026, midió <strong>104.9 millones de personas usuarias de internet en México</strong>, el 86.1% de la población de 6 años y más. De quienes usan teléfono celular, el <strong>97% usa smartphone</strong>. Y de ese universo, la categoría de aplicación más usada del país no son las redes sociales ni el video: es la <strong>mensajería instantánea, con 90.6%</strong>. Redes sociales quedó en 80.4% y contenidos de audio y video en 77.8%.</p>
<p>Traducción para el agente: no hay ninguna decisión estratégica que tomar sobre el canal. Tu prospecto no va a llenar un formulario, no va a esperar tu correo y con suerte contesta una llamada de número desconocido. Te va a escribir por WhatsApp. Eso ya pasó.</p>
<p>La pregunta que sí está abierta es otra: <strong>¿qué tan rápido le contestas?</strong></p>

<h2>La ventana se cierra en minutos, no en días</h2>
<p>Hay dos estudios que todo el mundo cita mal, mezclándolos en uno solo. Vale la pena separarlos, porque cada uno mide algo distinto y los dos importan.</p>

<h3>El estudio del MIT (2007): la velocidad</h3>
<p>El Dr. James Oldroyd, entonces en la Sloan School of Management del MIT, analizó junto con InsideSales.com tres años de datos de seis empresas que generan y contestan leads web: más de <strong>15,000 leads</strong> y más de <strong>100,000 intentos de contacto</strong>. El hallazgo central:</p>
<ul>
  <li>Contactar a un lead a los <strong>5 minutos</strong> contra hacerlo a los <strong>30 minutos</strong> cambia las probabilidades de <strong>lograr el contacto por un factor de 100</strong>.</li>
  <li>Y las probabilidades de <strong>calificarlo por un factor de 21</strong>.</li>
</ul>
<p>Los autores concluyeron algo que suena obvio pero que casi nadie opera: la inmediatez de la respuesta pesa muchísimo más que el día de la semana o la hora del día. No es que "los martes convierten mejor". Es que quien contesta primero convierte mejor, y el resto es ruido.</p>

<h3>El estudio de Harvard Business Review (2011): la realidad</h3>
<p>Cuatro años después, Oldroyd, Kristina McElheran y David Elkington publicaron en <em>Harvard Business Review</em> una auditoría de <strong>2,241 empresas estadounidenses</strong>, a las que mandaron leads de prueba por su propio sitio web para medir cuánto tardaban en contestar. Los números son brutales:</p>
<ul>
  <li>Solo el <strong>37%</strong> contestó dentro de la primera hora.</li>
  <li>El <strong>24%</strong> tardó más de 24 horas.</li>
  <li>El <strong>23% nunca contestó</strong>.</li>
  <li>El promedio entre las que sí contestaron fue de <strong>42 horas</strong>.</li>
</ul>
<p>Y el costo de esa lentitud, medido sobre un estudio paralelo de 1.25 millones de leads en 42 empresas: las firmas que intentaban contactar dentro de la primera hora eran <strong>casi 7 veces más propensas a calificar el lead</strong> que las que lo intentaban apenas una hora después, y <strong>más de 60 veces más propensas</strong> que las que esperaban 24 horas o más. Calificar, en su definición, significa lograr una conversación con sentido con quien decide.</p>
<p>Junta los dos estudios y tienes el diagnóstico completo: <strong>el valor de un lead se evapora en minutos, y la empresa promedio responde en días</strong>. No hay técnica de cierre que compense eso.</p>

<h2>Por qué el agente inmobiliario pierde esa carrera (y no es por flojera)</h2>
<p>Aquí conviene ser honestos, porque la industria del software adora insinuar que el agente es lento por descuidado. No es eso. Es física.</p>
<ul>
  <li><strong>Estás en una cita.</strong> Enseñando una casa no puedes sacar el celular cada dos minutos. Son dos horas muertas.</li>
  <li><strong>Estás manejando.</strong> Entre Morelia y una propiedad en Pátzcuaro se te acumulan cuarenta minutos de mensajes sin ver.</li>
  <li><strong>Estás dormido.</strong> Un porcentaje enorme de los mensajes por anuncios entra de noche y en fin de semana, porque es cuando la gente busca casa.</li>
  <li><strong>Estás con tu familia.</strong> Y tienes derecho.</li>
  <li><strong>Ya tienes 40 chats sin leer.</strong> El que abriste primero no es el más caliente, es el más reciente.</li>
</ul>
<p>Un agente solo, por bueno que sea, no puede sostener una ventana de cinco minutos las 24 horas. Y su competencia tampoco, lo cual es exactamente donde está la oportunidad: <strong>el estándar del mercado es tan bajo que contestar en treinta segundos, siempre, es una ventaja desproporcionada.</strong></p>

<h2>Qué hace exactamente una recepción automática</h2>
<p>Un servicio de recepción sobre WhatsApp, como el módulo de Recepción de Broquer, hace cuatro cosas concretas. Ni más, ni menos:</p>
<ol>
  <li><strong>Contesta en segundos, siempre.</strong> A las tres de la mañana, en domingo, mientras enseñas una casa. El prospecto obtiene una respuesta humana en tono, inmediata en tiempo.</li>
  <li><strong>Califica sin sonar a interrogatorio.</strong> Averigua qué busca, con cuánto cuenta, si es crédito o contado y para cuándo lo necesita. Es la misma conversación que tendrías tú, en el mismo orden.</li>
  <li><strong>Registra todo en tu CRM.</strong> El contacto se crea solo, con temperatura, presupuesto, forma de pago y un resumen de una línea. Cuando abres el celular en la mañana no encuentras 40 chats: encuentras una lista ordenada por qué tan caliente está cada quien.</li>
  <li><strong>Se quita de en medio.</strong> En el momento en que tú escribes en ese chat desde tu celular, la IA se apaga sola en esa conversación. No hay dos voces peleando por el mismo cliente.</li>
</ol>
<p>El cuarto punto es el que hace que el sistema sea usable. Una recepción que no sabe cuándo callarse es peor que no tener nada.</p>

<h2>La coexistencia: la parte que nadie explica bien</h2>
<p>Históricamente, conectar tu número a la API de WhatsApp significaba <strong>perder la app</strong>. Migrabas el número a la plataforma, y de ahí en adelante solo podías escribirle a tus clientes desde el software. Para un agente inmobiliario eso es un no rotundo: tu WhatsApp es tu vida laboral entera.</p>
<p>Meta resolvió eso con lo que llama, en su documentación oficial, el <em>onboarding de usuarios de la app de WhatsApp Business</em>, conocido como <strong>coexistencia</strong>. El mismo número vive en dos lados a la vez:</p>
<ul>
  <li>Lo que la plataforma envía por la API <strong>aparece automáticamente en tu app</strong> del celular.</li>
  <li>Lo que tú escribes desde tu app le llega a la plataforma mediante un evento que Meta llama <em>message echo</em>. Ese es, técnicamente, el mecanismo que permite que Recepción sepa que ya contestaste y se apague.</li>
</ul>
<p>Es decir: no cambias de número, no contratas uno nuevo, no pierdes tus chats y no dejas de usar tu WhatsApp de siempre. Eso es lo que vuelve viable esta herramienta para un agente individual y no solo para un call center.</p>

<h3>La letra chica, porque sí la hay</h3>
<p>Cualquiera que te venda esto sin decirte lo siguiente te está viendo la cara. Son reglas de Meta, no del proveedor de software, y aplican mientras tu número esté conectado:</p>
<ul>
  <li><strong>Las listas de difusión se deshabilitan.</strong> Las que ya tienes quedan de solo lectura y no puedes crear nuevas. Los envíos masivos pasan a hacerse con plantillas aprobadas.</li>
  <li><strong>Los mensajes temporales, "ver una vez" y la ubicación en tiempo real se desactivan</strong> en todos tus chats individuales.</li>
  <li><strong>Tus dispositivos vinculados se desvinculan</strong> al conectar. Puedes volver a vincular los compatibles, pero <strong>WhatsApp para Windows y para WearOS no son compatibles</strong>: lo que escribas desde ahí no le llega a la plataforma.</li>
  <li><strong>Los chats de grupo no se sincronizan.</strong> Siguen en tu celular, no en el software.</li>
  <li><strong>La palomita azul de cuenta oficial no es compatible</strong> con coexistencia.</li>
  <li><strong>No desinstales la app</strong>, o se rompe el vínculo.</li>
</ul>
<p>Ninguna de estas es un impedimento serio para un agente inmobiliario. Pero enterarte después, no antes, sí es un problema.</p>

<h2>La regla de las 24 horas y por qué cambia tu operación</h2>
<p>La Política de Mensajería para Empresas de WhatsApp establece que, por la API, solo puedes responder con texto libre <strong>dentro de las 24 horas siguientes al último mensaje del usuario</strong>. Fuera de esa ventana, únicamente puedes enviar <strong>plantillas previamente aprobadas por Meta</strong>, y Meta se reserva revisar, aprobar, pausar o rechazar cualquiera de ellas cuando quiera.</p>
<p>Hay un detalle de la coexistencia que casi nadie menciona y que es oro puro: según la propia documentación de Meta, <strong>los mensajes que envías desde tu app de WhatsApp Business no están sujetos a la ventana de 24 horas, siguen siendo gratuitos, y no crean, extienden ni afectan la ventana ni el costo de la API</strong>.</p>
<p>Es decir, la operación sana es: <strong>la IA contesta en caliente dentro de la ventana, tú tomas el chat desde tu celular y lo trabajas sin límite de tiempo ni de costo</strong>. Lo mejor de los dos mundos, literalmente.</p>
<p>Implicación práctica: crea tus plantillas de seguimiento el día uno, no el día en que las necesites. Meta las revisa una por una.</p>

<h2>Lo que la ley te pide a ti, no a tu software</h2>
<p>Aquí es donde la mayoría de los agentes en México va a ciegas, y donde el riesgo es real. Un dato duro: la nueva <strong>Ley Federal de Protección de Datos Personales en Posesión de los Particulares</strong>, publicada en el DOF el 20 de marzo de 2025, abrogó la ley de 2010 y trasladó la autoridad del extinto INAI a la <strong>Secretaría Anticorrupción y Buen Gobierno</strong>. Si tu aviso de privacidad todavía menciona al INAI, está desactualizado.</p>
<p>Cuatro cosas que debes saber:</p>

<h3>1. El responsable eres tú</h3>
<p>Frente a tus prospectos, <strong>tú</strong> eres el responsable del tratamiento de sus datos. Tu plataforma es la <em>persona encargada</em>, que trata los datos por tu cuenta (artículo 2, fracción XII). La multa, si llega, llega a tu nombre.</p>

<h3>2. Calificar con IA es un tratamiento automatizado</h3>
<p>Este es el punto fino. El <strong>artículo 26, fracción II</strong> de la LFPDPPP le da a la persona titular el derecho de oponerse cuando sus datos son objeto de un tratamiento automatizado destinado a evaluar, <strong>sin intervención humana</strong>, aspectos personales como su <strong>situación económica</strong>, fiabilidad o comportamiento.</p>
<p>Una recepción de IA que le pregunta a tu prospecto con cuánto cuenta, le asigna un puntaje del 0 al 100 y lo etiqueta como caliente, tibio o frío está haciendo exactamente eso. Es perfectamente legal, pero <strong>tienes que informarlo en tu aviso de privacidad y tienes que respetar la oposición</strong> si alguien la ejerce. En la práctica: apagas la IA en ese chat y lo atiendes tú.</p>

<h3>3. Aviso de privacidad y opt-in</h3>
<p>Los artículos 14 a 16 te obligan a poner tu aviso de privacidad a disposición <strong>desde el momento en que recabas los datos</strong>, y cuando los recabas por medios electrónicos el aviso simplificado es obligatorio. Por su parte, la política de WhatsApp exige que solo contactes a alguien si te dio su número <strong>y</strong> te dio permiso de escribirle. Comprar bases y meterlas a difusión es la forma más rápida de que Meta te tumbe el número.</p>

<h3>4. Automatización sí, callejón sin salida no</h3>
<p>La Política de Mensajería para Empresas de WhatsApp permite explícitamente usar automatización para responder dentro de la ventana de 24 horas, <strong>pero exige que tengas vías de escalamiento a una persona humana que sean prontas, claras y directas</strong>: transferencia a un agente en el chat, teléfono, correo, soporte web o formulario. Un bot que no te deja llegar a un humano es una violación de política.</p>
<p>Dos prohibiciones más de esa misma política que pegan directo a nuestro giro: <strong>no pidas ni compartas números completos de tarjeta, cuentas financieras o identificaciones oficiales por WhatsApp</strong>, y <strong>no discrimines ni sugieras preferencia</strong> en contra de nadie por características personales. Lo segundo debería ser evidente en el negocio inmobiliario y aun así no siempre lo es.</p>

<h2>Cómo se ve un martes cualquiera</h2>
<p>Menos teoría. Así se ve la diferencia:</p>
<p><strong>Sin recepción.</strong> 11:40 p.m., alguien ve tu anuncio de una casa en Altozano y escribe "¿sigue disponible?". A las 8:15 a.m. tú abres el celular, ves ese mensaje entre otros doce y contestas "Sí, ¿te interesa verla?". Son <strong>8 horas y 35 minutos</strong>. Según el estudio de HBR, para ese punto tus probabilidades de calificarlo cayeron a una fracción de lo que eran. Y lo más probable es que él le haya escrito a tres agentes esa misma noche.</p>
<p><strong>Con recepción.</strong> 11:40 p.m., escribe. 11:40 p.m., Recepción contesta que sí sigue disponible y le pregunta qué está buscando. 11:43, él dice que quiere algo de tres recámaras, hasta cuatro millones, con crédito Infonavit, para mudarse en octubre. 11:44, Recepción le ofrece agendar una visita. A las 8:15 a.m. tú no abres un chat: abres tu bandeja y ves <em>"Caliente · 82 · 4 mdp · crédito · 3 recámaras · listo para visita"</em>. Escribes desde tu celular, la IA se apaga, y tú entras a cerrar, no a contestar "sí sigue disponible".</p>
<p>Esa es toda la tesis. La IA no cierra la venta. <strong>Te compra las ocho horas y media que te estaban costando el prospecto.</strong></p>

<h2>Qué no hace, para que no te vendan humo</h2>
<ul>
  <li><strong>No cierra tratos.</strong> Califica y agenda. El trato lo cierras tú, en persona, como siempre.</li>
  <li><strong>No adivina.</strong> Si tu inventario no está bien capturado, va a contestar con generalidades.</li>
  <li><strong>No es infalible.</strong> Es un modelo de lenguaje: puede equivocarse. Tú eres el responsable de todo lo que sale de tu número, lo hayas escrito tú o no.</li>
  <li><strong>No te garantiza la conexión.</strong> Meta decide la elegibilidad de cada número a su criterio, considerando antigüedad de la cuenta y calidad de mensajería. Un número recién dado de alta casi nunca es elegible de inmediato.</li>
  <li><strong>No te sale gratis.</strong> Los mensajes que salen por la API se rigen por el tarifario de Meta, se cobran por conversación de 24 horas y van por tu cuenta con Meta. Los que tú mandas desde tu celular sí son gratis.</li>
</ul>

<h2>Resumen para el agente</h2>
<p>La mensajería instantánea es la aplicación más usada de México y ahí llegan tus leads. Dos estudios independientes miden que el valor de un lead cae por un factor de 21 a 100 en los primeros minutos, y que la empresa promedio tarda 42 horas en contestar. Un agente humano no puede ganar esa carrera solo, pero <strong>tampoco necesita ganarla solo</strong>: la coexistencia de Meta permite que una recepción automática cubra los huecos sin quitarte tu número ni tu app, y que se apague en cuanto tú entras.</p>
<p>Lo que sí es tuyo y de nadie más: informar en tu aviso de privacidad que hay un perfilamiento automatizado, tener el opt-in de tu gente, respetar la oposición del artículo 26 fracción II, dejar siempre una salida hacia un humano y no pedir identificaciones ni datos bancarios por chat.</p>
<p>Si conectas tu número hoy, la guía paso a paso está en <a href="guia-agente.html#whatsapp">Ayuda</a>, y el detalle legal completo en <a href="legal.html#whatsapp">WhatsApp y Datos</a>.</p>

<p>El <strong>artículo 93, fracción XIX, inciso a)</strong> de la Ley del ISR establece que <strong>no se pagará ISR</strong> sobre la ganancia obtenida por la enajenación de la casa habitación del contribuyente, siempre que:</p>

<h2>¿Por qué existe esta obligación?</h2>

<p>La <strong>Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita</strong> (LFPIORPI), conocida como Ley Antilavado, está vigente desde octubre de 2013. Su objetivo es impedir que el sistema financiero y la economía formal sean usados para reciclar dinero de origen ilícito.</p>

<p>El sector inmobiliario es uno de los más vulnerables a este riesgo a nivel global — así lo ha documentado el GAFI (Grupo de Acción Financiera Internacional). En México, la ley fue reformada de manera importante en julio de 2025 (DOF 16/07/2025) y su reglamento en marzo de 2026 (DOF 27/03/2026), endureciendo plazos, umbrales y obligaciones.</p>

<h2>¿Por qué te aplica a ti como agente?</h2>

<p>El <strong>Artículo 17, Fracción V</strong> de la LFPIORPI clasifica como "actividad vulnerable" la <em>intermediación habitual y profesional en la transmisión de la propiedad o constitución de derechos sobre bienes inmuebles</em>. Si estás cobrando comisión por facilitar una compraventa o arrendamiento, estás realizando esta actividad.</p>

<p>El umbral de aviso se calcula sobre el <strong>monto sin IVA</strong> (según el Reglamento reformado del 27 de marzo de 2026). Para arrendamiento, si un mismo cliente acumula operaciones iguales o superiores a 1,605 UMA en un período de 6 meses, también se activa la obligación aunque cada operación individual esté por debajo.</p>

<h2>Documentos que debes recopilar</h2>

<p>El expediente único es el conjunto de documentos que acreditan la identidad y origen de fondos de tus clientes. Debe integrarse <strong>antes o durante</strong> la operación, nunca después. Aquí está la lista completa según el tipo de cliente:</p>

<h3>Para persona física (comprador, vendedor, arrendatario, aval)</h3>

<ol>
  <li><strong>Identificación oficial vigente con fotografía</strong> — INE/IFE (ambas caras), pasaporte mexicano o extranjero vigente, o cédula profesional. No se aceptan identificaciones vencidas.</li>
  <li><strong>CURP</strong> — Clave Única de Registro de Población. Puedes verificarla en línea en renapo.gob.mx.</li>
  <li><strong>RFC con homoclave</strong> — Constancia de situación fiscal del SAT. Verifica que coincida con el nombre en la identificación.</li>
  <li><strong>Comprobante de domicilio</strong> — No mayor a 3 meses. Recibo de CFE, Telmex, agua, predial o estado de cuenta bancario. Debe mostrar nombre y dirección.</li>
  <li><strong>Datos de contacto verificables</strong> — Teléfono celular y correo electrónico. Documenta el medio por el que los obtuviste.</li>
  <li><strong>Declaración de origen de fondos</strong> — Obligatoria cuando la operación alcanza el umbral de aviso (≥$941,412.75 MXN para compraventa). El cliente declara por escrito de dónde proviene el dinero para la operación.</li>
  <li><strong>Carta laboral o comprobantes de ingresos</strong> — Estados de cuenta de los últimos 3-6 meses, nóminas o declaración anual de ISR. Especialmente importante cuando el origen de fondos no es evidente.</li>
  <li><strong>Declaración de Persona Políticamente Expuesta (PEP)</strong> — Si el cliente es o ha sido servidor público federal, estatal o municipal en los últimos 2 años, o familiar directo de uno. Se requiere diligencia reforzada.</li>
</ol>

<h3>Para persona moral (empresa compradora, vendedora o arrendataria)</h3>

<ol>
  <li><strong>Acta constitutiva</strong> con todas sus reformas — copia certificada o cotejada.</li>
  <li><strong>Poder notarial vigente</strong> del representante legal que va a firmar la operación.</li>
  <li><strong>Identificación oficial vigente del representante legal</strong> (igual que persona física).</li>
  <li><strong>RFC de la persona moral</strong> — Constancia de situación fiscal del SAT actualizada.</li>
  <li><strong>Comprobante de domicilio fiscal</strong> de la empresa — no mayor a 3 meses.</li>
  <li><strong>Identificación de todos los beneficiarios controladores</strong> — Desde la reforma de 2025, debes identificar a toda persona física que directa o indirectamente posea o controle el <strong>25% o más</strong> de la empresa (el porcentaje se redujo de 50% a 25%). Para cada uno se requiere la misma documentación que para persona física.</li>
  <li><strong>Estructura corporativa simplificada</strong> — Si la empresa tiene socios que son otras empresas, debes trazar la cadena hasta llegar a la persona física beneficiaria final.</li>
  <li><strong>Objeto social</strong> del acta que ampare la realización de operaciones inmobiliarias.</li>
</ol>

<div class="bl-callout danger">
  <div class="bl-callout__label">Punto crítico de la reforma 2025</div>
  <p>El umbral de participación para identificar beneficiarios controladores bajó del 50% al <strong>25%</strong>. Revisa tus expedientes anteriores de personas morales: si solo identificaste al socio mayoritario, es posible que ahora necesites complementar con socios con 25-49% de participación.</p>
</div>

<h2>Plazo de conservación</h2>

<p>La reforma de julio de 2025 amplió el plazo de conservación de <strong>5 a 10 años</strong> contados a partir de la fecha de realización de la operación. Esto aplica a todos los documentos, correspondencia y análisis relacionados con la operación y con el cliente.</p>

<p>Lo anterior significa que una operación realizada hoy, en mayo de 2026, deberás conservar su expediente hasta mayo de 2036 como mínimo.</p>

<h2>Cómo registrarte en el SPPLD del SAT</h2>

<p>Antes de realizar cualquier operación como agente, debes estar dado de alta como sujeto obligado. El proceso es:</p>

<ol>
  <li>Contar con <strong>e.firma (FIEL) vigente</strong>. Si no la tienes, tramítala en el SAT con cita previa.</li>
  <li>Ingresar al <strong>Portal SPPLD</strong> en <em>sppld.sat.gob.mx</em> con tu e.firma.</li>
  <li>Registrarte bajo la categoría <strong>"Actividades Vulnerables — Fracción V"</strong> (comercialización e intermediación de inmuebles).</li>
  <li>Designar un <strong>Representante Encargado de Cumplimiento</strong>. Si eres persona física actuando de manera independiente, puedes ser tú mismo con tu propia e.firma.</li>
  <li>Elaborar un <strong>Manual de Cumplimiento</strong> que documente tus políticas internas para identificar clientes, detectar operaciones inusuales y presentar avisos. No existe un formato único; debe adaptarse a tu operación específica.</li>
</ol>

<h2>Avisos mensuales al SAT</h2>

<p>Cuando una operación alcanza el umbral de aviso, debes reportarla a la Unidad de Inteligencia Financiera (UIF) a través del SPPLD. Las reglas son:</p>

<ul>
  <li><strong>Aviso normal</strong> — Se presenta antes del <strong>día 17 del mes siguiente</strong> al cierre de la operación, en formato XML a través del portal SPPLD.</li>
  <li><strong>Informe en ceros</strong> — Si en un mes no tuviste operaciones objeto de aviso, de todas formas debes presentar este informe antes del día 17. No presentarlo también es una infracción.</li>
  <li><strong>Aviso urgente (24 horas)</strong> — Cuando detectes indicios de que los recursos provienen de fuente ilícita, o cuando tu cliente aparezca en las listas de personas bloqueadas de la UIF. El plazo para este aviso bajó de 3 días a <strong>24 horas</strong> con la reforma 2025.</li>
</ul>

<h2>Sanciones por incumplimiento</h2>

<div class="bl-table-wrap">
  <table class="bl-table">
    <thead>
      <tr><th>Tipo de infracción</th><th>Multa mínima</th><th>Multa máxima</th></tr>
    </thead>
    <tbody>
      <tr><td>No registrarse en el SPPLD</td><td class="num">200 UMA ($23,462)</td><td class="num">2,000 UMA ($234,620)</td></tr>
      <tr><td>No presentar avisos o informes en ceros</td><td class="num">200 UMA ($23,462)</td><td class="num">2,000 UMA ($234,620)</td></tr>
      <tr><td>No integrar expediente del cliente</td><td class="num">200 UMA ($23,462)</td><td class="num">2,000 UMA ($234,620)</td></tr>
      <tr><td>Reincidencia en cualquier infracción</td><td class="num">10,000 UMA ($1,173,100)</td><td class="num">65,000 UMA ($7,625,150)</td></tr>
      <tr><td>Colaboración con lavado (penal)</td><td colspan="2" style="text-align:center">Prisión de 5 a 15 años + multa (Art. 400 Bis CPF)</td></tr>
    </tbody>
  </table>
</div>

<p>Montos calculados con UMA 2026 = $117.31 MXN/día. Adicionalmente, el SAT puede ordenar la <strong>suspensión temporal o definitiva</strong> de la actividad.</p>

<h2>Los cambios clave de la reforma 2025-2026</h2>

<p>Si ya tenías prácticas de cumplimiento previas a julio de 2025, estas son las actualizaciones que debes incorporar:</p>

<ul>
  <li>Plazo de conservación de expedientes: <strong>5 → 10 años</strong></li>
  <li>Umbral para identificar beneficiarios controladores en personas morales: <strong>50% → 25%</strong> de participación</li>
  <li>Plazo para aviso por operación sospechosa: <strong>72 horas → 24 horas</strong></li>
  <li>Mecanismos automatizados de monitoreo: ahora son <strong>obligatorios</strong> por ley (Art. 18, Fr. X) — ya no es suficiente con registros en Excel</li>
  <li>Nueva fracción <strong>V Bis</strong>: el desarrollo inmobiliario se separa como actividad vulnerable independiente</li>
  <li>Para notarios: umbral de aviso por transmisión de inmuebles bajó de 16,000 a <strong>8,000 UMA</strong></li>
  <li>El monto límite para pago en efectivo (Art. 32) ahora se calcula <strong>incluyendo IVA y accesorios</strong></li>
</ul>

<h2>Recomendación práctica</h2>

<p>El expediente único no es burocracia — es tu protección. Si alguna de tus operaciones es investigada por la UIF y no tienes el expediente completo, eres vulnerable a sanciones independientemente de si la operación era legítima. Con el expediente en regla, tienes evidencia documentada de que realizaste la diligencia debida.</p>

<p>Digitaliza tus expedientes desde el primer día: escanea todos los documentos, guárdalos en una carpeta organizada por cliente y fecha, y haz respaldo en la nube. El módulo de Verificador de Documentos de Broquer puede ayudarte a revisar la validez de los documentos antes de archivarlos.</p>

<div class="bl-callout success">
  <div class="bl-callout__label">Próximo paso</div>
  <p>Si aún no estás dado de alta como sujeto obligado, ingresa hoy a <strong>sppld.sat.gob.mx</strong> con tu e.firma. El registro no tiene costo y es el primer paso antes de cualquier operación.</p>
</div>

/* ════════════════════════════════════════════════════════
   Lógica del blog
   ════════════════════════════════════════════════════════ */
(function(){
  const $listView  = document.getElementById('bl-list-view');
  const $artView   = document.getElementById('bl-article');
  const $artContent= document.getElementById('bl-article-content');
  const $list      = document.getElementById('bl-list');
  const $tagsEl    = document.getElementById('bl-tags');
  const $search    = document.getElementById('bl-search');
  const $searchClr = document.getElementById('bl-search-clear');
  const $back      = document.getElementById('bl-back');
  const $head      = document.getElementById('bl-head');

  let currentTag = '';
  let currentQuery = '';

  /* Recopilar todos los tags únicos */
  const allTags = [];
  ARTICULOS.forEach(a => a.tags.forEach(t => { if (!allTags.includes(t)) allTags.push(t); }));

  /* Render tags */
  function renderTags() {
    $tagsEl.innerHTML = '<button class="bl-tag' + (!currentTag ? ' is-active' : '') + '" data-tag="">Todos</button>'
      + allTags.map(t =>
          '<button class="bl-tag' + (currentTag===t?' is-active':'') + '" data-tag="'+esc(t)+'">'+esc(t)+'</button>'
        ).join('');
    $tagsEl.querySelectorAll('.bl-tag').forEach(btn => {
      btn.addEventListener('click', () => { currentTag = btn.dataset.tag; renderTags(); renderList(); });
    });
  }

  /* Filtrar artículos */
  function filteredArticulos() {
    return ARTICULOS.filter(a => {
      const matchTag = !currentTag || a.tags.includes(currentTag);
      const q = currentQuery.toLowerCase().trim();
      const matchQ = !q || [a.titulo, a.subtitulo, a.resumen, ...a.tags].some(x => x.toLowerCase().includes(q));
      return matchTag && matchQ;
    });
  }

  /* Render lista */
  function renderList() {
    const arts = filteredArticulos();
    if (!arts.length) {
      $list.innerHTML = '<div class="bl-empty">'
        + '<svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/></svg>'
        + '<p>No se encontraron artículos para esa búsqueda.</p></div>';
      return;
    }
    $list.innerHTML = arts.map(a => `
      <div class="bl-card" data-id="${esc(a.id)}">
        <div class="bl-card__top">
          <span class="bl-card__cat ${a.catKey}">${esc(a.categoria)}</span>
          <span class="bl-card__meta">${esc(a.lectura)}</span>
        </div>
        <div class="bl-card__title">${esc(a.titulo)}</div>
        <div class="bl-card__sub">${esc(a.resumen)}</div>
        <div class="bl-card__tags">${a.tags.map(t=>'<span class="bl-card__tag">'+esc(t)+'</span>').join('')}</div>
        <div class="bl-card__footer">
          <span class="bl-card__author">${esc(a.autor)} · ${esc(a.fecha)}</span>
          <span class="bl-card__read-more">Leer
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </span>
        </div>
      </div>
    `).join('');

    $list.querySelectorAll('.bl-card').forEach(card => {
      card.addEventListener('click', () => openArticle(card.dataset.id));
    });
  }

  /* Abrir artículo */
  function openArticle(id) {
    const art = ARTICULOS.find(a => a.id === id);
    if (!art) return;
    const sourcesHtml = art.fuentes && art.fuentes.length
      ? '<div class="bl-sources"><div class="bl-sources__title">Fuentes oficiales</div><ul>'
          + art.fuentes.map(f => `<li>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.texto)}</a>` : esc(f.texto)}</li>`).join('')
          + '</ul></div>'
      : '';
    $artContent.innerHTML = art.contenido + sourcesHtml;
    $listView.classList.add('is-off');
    $artView.classList.add('is-on');
    $head.style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Volver */
  $back.addEventListener('click', () => {
    $artView.classList.remove('is-on');
    $listView.classList.remove('is-off');
    $head.style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* Search */
  $search.addEventListener('input', () => {
    currentQuery = $search.value;
    $searchClr.classList.toggle('is-on', !!currentQuery);
    renderList();
  });
  $searchClr.addEventListener('click', () => {
    $search.value = '';
    currentQuery = '';
    $searchClr.classList.remove('is-on');
    renderList();
    $search.focus();
  });

  function esc(s) { return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* Init */
  renderList();

  /* Si la URL tiene ?art=ID abrir directamente */
  const params = new URLSearchParams(location.search);
  if (params.get('art')) openArticle(params.get('art'));

})();
</script>
</body>
</html>
