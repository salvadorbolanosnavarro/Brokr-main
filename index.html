<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<!-- Sin maximum-scale/user-scalable: bloquear el pinch-zoom viola WCAG 1.4.4
     y no deja acercarse a leer algo. Ningún input vive en esta pantalla. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Broquer — Inicio</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="theme-color" content="#081C4E"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --sky-navy -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Broquer"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
/* ─── Home — tercera generación: launcher de módulos ──────────────
   El inicio deja de ser un dashboard operativo (KPIs del día, tareas,
   leads, pipeline, inventario) y se vuelve la puerta de entrada a toda
   la app: una barra superior (mismo azul del rail lateral) con la foto
   del agente, una frase y el logotipo; debajo, las 3 cifras que de
   verdad importan para el negocio; debajo de eso, todos los módulos
   seguidos uno del otro en tarjetas grandes de un solo color, sin
   categorías. La foto de perfil abre su propio menú (Mi perfil/Ayuda/
   Admin), igual que en el rail lateral. El rail/topbar/mobile-head compartidos
   (app-shell.js) se ocultan SOLO en esta pantalla — el resto de la app
   no cambia. */

.dash-scroll {
  padding: 0 28px 48px; max-width: 1180px; margin: 0 auto;
  font-family: var(--font-sans);
  color: var(--ink);
  letter-spacing: -0.012em;
}
@media (max-width: 720px) { .dash-scroll { padding: 0 14px 40px; } }

/* ── Banner "sin conexión" — discreto, arriba de todo lo demás ──
   El bug real de por qué seguía apareciendo con la conexión bien: esta
   regla ponía `display:flex` a secas, y una regla de autor con `display`
   siempre le gana a la regla del navegador `[hidden]{display:none}` sin
   importar la especificidad ni lo que haga el JS con `.hidden = true` —
   el atributo `hidden` nunca tuvo efecto real. La única forma correcta es
   que el propio selector de autor respete `[hidden]` explícitamente. */
.dash-offline[hidden] { display: none; }
.dash-offline {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--warn-soft); color: var(--warn);
  border-radius: var(--r-sm); padding: 8px 14px;
  font-size: var(--fs-xs); font-weight: 600;
  margin: 14px 0 0;
}

/* ── Ocultar el rail/topbar/mobile-head compartidos SOLO aquí ──
   .bk-content ya es flex:1 (ver app-shell.js), así que al quitar el
   rail (flex-shrink:0, ancho fijo) el contenido reclama el ancho
   completo sin tocar esa regla. Especificidad (0,2,1) le gana a la
   de las reglas compartidas (incluida su @media) sin importar el
   orden de inyección en el <head>. */
body[data-app="home"] .bk-sidebar,
body[data-app="home"] .bk-mobile-head,
body[data-app="home"] .bk-topbar {
  display: none;
}

/* ── Barra superior propia: perfil · frase · logotipo ──
   Mismo azul que el rail lateral (--sb-bg) — misma superficie de marca,
   aunque el rail esté oculto en esta pantalla. Pegada arriba (el scroll
   real de la app es #bk-page, inyectado por app-shell.js —
   position:sticky ya es un patrón usado en todos los módulos sobre ese
   mismo contenedor). */
.home-top {
  position: sticky; top: 14px; z-index: 5;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 16px 20px; margin: 14px 0 0;
  border-radius: var(--r-lg);
  background: var(--sb-bg);
  box-shadow: var(--sb-glow);
}
.home-avatar-wrap { position: relative; flex: 0 0 auto; }
.home-avatar {
  width: 44px; height: 44px; border-radius: var(--r-pill);
  border: none; padding: 0; cursor: pointer; overflow: hidden;
  background: #FFFFFF; color: var(--sky-navy);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-sm); font-weight: 700;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.home-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.home-avatar:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.home-avatar:focus-visible { outline: none; box-shadow: var(--focus); }
/* Menú de la foto de perfil: Mi perfil / Ayuda / Admin (solo si aplica) —
   igual que el flyout "Más" del rail lateral, pero desde el avatar. Sin
   `display` propio: [hidden] lo oculta con la regla del propio
   navegador, sin el bug de display-vs-[hidden] que ya mordió a esta
   pantalla dos veces (ver .dash-offline arriba). */
.home-avatar-menu {
  position: absolute; top: 100%; left: 0;
  margin-top: 8px; z-index: 20; min-width: 190px;
  background: var(--bone); border: 1px solid var(--line-2);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  padding: 8px;
}
.home-avatar-menu a {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 10px 12px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink);
  text-decoration: none;
}
.home-avatar-menu a:hover { background: var(--paper-2); }
.home-avatar-menu a svg { width: 18px; height: 18px; color: var(--data-1); flex: 0 0 auto; }
.home-phrase {
  flex: 1 1 auto; min-width: 0;
  text-align: center;
  font-size: var(--fs-sm); font-weight: 600; color: #FFFFFF;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  opacity: 0; transition: opacity .4s var(--ease);
}
.home-phrase.is-visible { opacity: 1; }
.home-phrase .quote-author { color: rgba(255,255,255,.68); font-weight: 500; }
.home-phrase .quote-author::before { content: ' — '; }
@media (max-width: 640px) {
  /* En una línea no cabe la cita completa en un teléfono: se permite
     una segunda línea y se quita el truncado agresivo. */
  .home-phrase { white-space: normal; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--fs-xs); }
}
.home-logo {
  flex: 0 0 auto; height: 79px; width: auto; display: block; margin: -21px 0;
  /* logo-broquer.png es un trazo oscuro; el fondo de .home-top es
     siempre el azul de marca (--sb-bg), en claro y en oscuro — se
     invierte a blanco sin condicionar al modo del sistema, igual que
     .bk-sidebar__brand img en app-shell.js sobre ese mismo azul. */
  filter: brightness(0) invert(1); opacity: .96;
}

/* ── Las 3 cifras que de verdad importan para una agencia ── */
.home-kpis {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-4); margin: var(--sp-5) 0;
}
@media (max-width: 640px) { .home-kpis { grid-template-columns: 1fr; } }
.home-kpi { text-decoration: none; color: inherit; display: block; -webkit-tap-highlight-color: transparent; transition: background var(--dur) var(--ease); }
.home-kpi:active { background: var(--paper-2); }
.home-kpi:focus-visible { outline: none; box-shadow: var(--focus); }
.home-kpi__lab {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-sm); color: var(--mute); font-weight: 600;
}
.home-kpi__ic {
  width: 26px; height: 26px; border-radius: var(--r-xs); flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
}
.home-kpi__ic--1 { background: var(--data-1-soft); color: var(--data-1); }
.home-kpi__ic--2 { background: var(--data-2-soft); color: var(--data-2); }
.home-kpi__ic--3 { background: var(--data-3-soft); color: var(--data-3); }
.home-kpi__val {
  font-size: var(--fs-h2); font-weight: 800; letter-spacing: -0.02em;
  margin-top: var(--sp-2); font-variant-numeric: tabular-nums;
}

/* ── Todos los módulos, seguidos uno del otro, sin categorías ──
   Un solo color (el azul de marca, el mismo de la barra superior y el
   rail) — nada de 6 colores distintos por grupo; tarjetas más grandes
   para un target de toque más cómodo que el mínimo de 44px. */
.home-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: var(--sp-3); margin: var(--sp-5) 0;
}
.home-card {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  text-align: center; text-decoration: none; color: inherit;
  padding: var(--sp-5) var(--sp-3);
  border: none; background: none; font: inherit; width: 100%;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
a.home-card, button.home-card { cursor: pointer; }
.home-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--line-2); }
.home-card:active { transform: translateY(0); background: var(--paper-2); }
.home-card:focus-visible { outline: none; box-shadow: var(--focus); }
.home-card__ic {
  width: 56px; height: 56px; border-radius: var(--r-sm); flex: 0 0 auto;
  background: var(--data-1-soft); color: var(--data-1);
  display: inline-flex; align-items: center; justify-content: center;
}
.home-card__ic svg { width: 26px; height: 26px; }
.home-card__label { font-size: var(--fs-sm); font-weight: 700; line-height: 1.25; }

@media (prefers-reduced-motion: reduce) {
  .home-avatar, .home-card, .home-phrase { transition: none; }
  .home-card:hover { transform: none; }
}

/* Insignia Meta Tech Provider: pie de página, viaja con el contenido. */
.dash-meta {
  width: max-content; margin: var(--sp-7) auto 0;
  display: inline-flex; align-items: center;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 6px 11px;
  box-shadow: var(--shadow-sm);
  pointer-events: none; user-select: none; opacity: .9;
}
.dash-meta img { height: 16px; width: auto; display: block; -webkit-user-drag: none; }
@media (max-width: 880px) {
  .dash-meta { padding: 5px 9px; }
  .dash-meta img { height: 14px; }
}

/* ── Ajuste móvil: nada se desborda del ancho de la pantalla ── */
@media (max-width: 900px) {
  .dash-scroll { overflow-x: clip; }
  .home-kpis, .home-grid { max-width: 100%; }
}
</style>
</head>

<script>
/* ── Invitación pendiente a un equipo ──
   Si la persona abrió un link de invitación sin sesión, unirse.html guarda
   el token y la manda a iniciar sesión. Al terminar el login siempre se cae
   aquí: la regresamos a unirse.html para que acepte con un clic. */
(function(){
  // Enlaces de autenticación de Supabase que caen en la raíz (recuperación de
  // contraseña, confirmaciones). Se reenvían ANTES de que el app-shell haga su
  // chequeo de sesión — sin esto, el chequeo redirige a landing.html y el
  // token se pierde en el camino.
  try {
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    var tipo = q.get('type') || h.get('type') || '';
    var hayToken = q.get('token_hash') || h.get('access_token');
    var hayCode = q.get('code') || h.get('code');
    var hayError = q.get('error') || h.get('error') || q.get('error_description') || h.get('error_description');
    if (tipo === 'recovery' || (q.get('token_hash') && !tipo) || (hayError && !hayToken)) {
      window.location.replace('reset-password.html' + location.search + location.hash);
      return;
    }
    // Cualquier otro parámetro de autenticación (confirmación de correo,
    // magic link, ?code= de PKCE): reenviar a login.html CONSERVANDO la URL.
    // Sin esto, app-shell detecta "sin sesión", redirige a landing.html y el
    // token se pierde en el camino — el usuario ve la landing y nada más.
    if (hayToken || hayCode || hayError || tipo) {
      window.location.replace('login.html' + location.search + location.hash);
      return;
    }
  } catch(_){}
  try {
    var inv = localStorage.getItem('inv_pendiente');
    if (inv) { window.location.replace('unirse.html?inv=' + encodeURIComponent(inv)); }
  } catch(_){}
})();

/* ── Service worker: ya existía (sw.js: network-first con fallback a
   caché, push notifications) pero nunca se registraba en NINGÚN lado —
   0 service workers activos con manifest.json ya listo. Un asesor en un
   fraccionamiento sin señal abría la app y no veía nada. Se registra
   aquí (el scope de un service worker es del origen completo, no
   depende de qué página hizo el registro). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
})();

/* ── Banner "sin conexión" ── NO se enciende con navigator.onLine a
   secas: esa bandera solo dice si el sistema operativo tiene una interfaz
   de red activa, no si Internet responde de verdad, y en iPadOS/Safari
   puede reportar `false` por unos segundos (p.ej. al cambiar de wifi a
   datos) sin que ninguna petición real haya fallado — así fue como el
   aviso apareció encima de datos frescos y recién cargados: un falso
   "sin conexión" del navegador, no una falla real.
   Ahora la única fuente que lo enciende es una petición real que de
   verdad no se pudo completar (window.brokrReportarConexion(false),
   llamado desde fxCount), y CUALQUIER petición que sí obtuvo respuesta
   del servidor —exitosa o no— lo apaga y usa esa hora como
   "datos de las X:XX". */
(function () {
  const banner = document.getElementById('dash-offline');
  const horaEl = document.getElementById('dash-offline-hora');
  if (!banner) return;
  function horaUltimaCarga() {
    try {
      const iso = localStorage.getItem('brokr_ultima_carga');
      if (iso) return new Date(iso).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    } catch (_) {}
    return null;
  }
  function ocultar() { banner.hidden = true; }
  function mostrar() {
    const hora = horaUltimaCarga();
    if (horaEl) horaEl.textContent = hora || 'esta sesión';
    banner.hidden = false;
  }
  window.addEventListener('online', ocultar);
  window.brokrReportarConexion = function (ok) {
    if (ok) { ocultar(); return; }
    if (!navigator.onLine) mostrar();
  };
})();
</script>

    { t: 'El mercado siempre puede permanecer irracional más tiempo del que tú puedes permanecer solvente.', a: 'John Maynard Keynes' },

    { t: 'El que no arriesga, no gana.', a: 'Refrán popular' },
    { t: 'Cada batalla se gana antes de pelearla.', a: 'Sun Tzu' },

    { t: 'Lo importante no es lo que te pasa, sino cómo reaccionas a lo que te pasa.', a: 'Epicteto' },
    { t: 'Si no estás dispuesto a arriesgarlo todo, no esperes lograr nada.', a: 'Muhammad Ali' },
    { t: 'En los negocios, lo que es peligroso es no evolucionar.', a: 'Jeff Bezos' },
    { t: 'El precio es lo que pagas. El valor es lo que recibes.', a: 'Warren Buffett' },
    { t: 'No se trata de ideas. Se trata de hacer que las ideas sucedan.', a: 'Scott Belsky' },
    { t: 'Si lo construyes, ellos vendrán.', a: 'Field of Dreams' },
    { t: 'La codicia, a falta de una mejor palabra, es buena.', a: 'Wall Street — Gordon Gekko' },
    { t: 'Siempre estar cerrando.', a: 'Glengarry Glen Ross' },
    { t: 'La gente no compra productos: compra la versión mejor de sí misma.', a: 'Don Draper — Mad Men' },
    { t: 'El que tiene un porqué para vivir, puede soportar casi cualquier cómo.', a: 'Friedrich Nietzsche' },
    { t: 'Lo que hagas hoy puede mejorar todos tus mañanas.', a: 'Ralph Marston' },
    { t: 'No persigas el éxito: vuélvete una persona de valor y el éxito te seguirá.', a: 'Albert Einstein' },
  ];
  const el = document.getElementById('home-phrase');
  if (!el) return;
  let idx = -1;
  function mostrar() {
    let next = Math.floor(Date.now() / (1000 * 60 * 60)) % QUOTES.length;
    if (next === idx) next = (next + 1) % QUOTES.length;
    idx = next;
    const q = QUOTES[next];
    el.classList.remove('is-visible');

      el.innerHTML = q.t + '<span class="quote-author">' + q.a + '</span>';
      el.classList.add('is-visible');

  mostrar();
  let lastHour = new Date().getHours();

    if (h !== lastHour) { lastHour = h; mostrar(); }

/* ── Datos reales cuando el shell termina la autenticación ──
   3 conteos para las tarjetas KPI, la foto de perfil (o iniciales de
   respaldo) para el avatar, y el módulo de Admin solo si aplica. */
window.addEventListener('brokr-shell-ready', async (e) => {
  const profile = e.detail?.profile;
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
  const SB_KEY = 'sb_publishable_EVGLfmHVorBpQQWAh-vypA_hANNk_-i';

  /* Cuenta exacta con HEAD + Prefer: count=exact (no descarga registros).
     Cada intento avisa a window.brokrReportarConexion si la red respondió
     de verdad (aunque la respuesta sea un error HTTP) o si de plano no se
     pudo ni completar la petición — es la única señal real que enciende o
     apaga el banner "sin conexión", nunca navigator.onLine a secas. */
  async function fxCount(path) {
    try {
      const opts = { method: 'HEAD', headers: { Prefer: 'count=exact', Range: '0-0' } };
      let r;
      if (window.brokrSb && window.brokrSb.fetch) {
        r = await window.brokrSb.fetch('rest/v1/' + path, opts);
      } else {
        const tok = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token') || SB_KEY;
        r = await fetch(SB_URL + '/rest/v1/' + path, {
          ...opts, headers: { ...opts.headers, apikey: SB_KEY, Authorization: 'Bearer ' + tok } });
      }
      if (window.brokrReportarConexion) window.brokrReportarConexion(true);
      if (!r.ok && r.status !== 206) return 0;
      const cr = r.headers.get('Content-Range') || '';
      return Number(cr.split('/').pop()) || 0;
    } catch (err) {
      if (window.brokrReportarConexion) window.brokrReportarConexion(false);
      return 0;
    }
  }
  async function fxRest(path) {
    try {
      if (window.brokrSb && window.brokrSb.rest) {
        const d = await window.brokrSb.rest(path, { method: 'GET' });
        if (window.brokrReportarConexion) window.brokrReportarConexion(true);
        return d;
      }
      const tok = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token');
      if (!tok) return [];
      const r = await fetch(SB_URL + '/rest/v1/' + path,
        { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + tok } });
      if (window.brokrReportarConexion) window.brokrReportarConexion(true);
      return r.ok ? await r.json() : [];
    } catch (err) {
      if (window.brokrReportarConexion) window.brokrReportarConexion(false);
      return [];
    }
  }

  const iso = d => d.toISOString();
  const lunes = new Date(); lunes.setHours(0,0,0,0);
  lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
  const mes1 = new Date(); mes1.setDate(1); mes1.setHours(0,0,0,0);

  const [activos, pros, cierres] = await Promise.all([
    fxCount('propiedades?select=id&estatus=eq.activa&archivada=not.is.true'),
    fxCount('contactos?select=id&created_at=gte.' + encodeURIComponent(iso(lunes))),
    fxCount('contratos?select=id&created_at=gte.' + encodeURIComponent(iso(mes1))),
  ]);
  document.getElementById('home-kpi-activos').textContent = activos;
  document.getElementById('home-kpi-pros').textContent = pros;
  document.getElementById('home-kpi-cierres').textContent = cierres;

  /* ── Avatar: foto real si existe, iniciales de respaldo si no ──
     Reemplaza el contenido del botón (nunca alterna un `hidden`) para no
     repetir el bug de display-vs-[hidden] que ya mordió a esta pantalla
     dos veces. El clic lo maneja el IIFE de más abajo (abre el menú). */
  const avatarBtn = document.getElementById('home-avatar');
  const nombre = (profile?.profile?.nombre || '').trim();
  const iniciales = nombre
    ? nombre.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase()
    : '';
  if (avatarBtn) {
    avatarBtn.textContent = iniciales || '?';
    avatarBtn.setAttribute('aria-label', nombre ? 'Menú de ' + nombre : 'Menú de cuenta');
  }
  try {
    const uid = profile?.user?.id;
    if (uid) {
      const filas = await fxRest('usuarios?id=eq.' + encodeURIComponent(uid) + '&select=foto_url');
      const fotoUrl = Array.isArray(filas) && filas[0] && filas[0].foto_url;
      if (fotoUrl && avatarBtn) {
        avatarBtn.innerHTML = '<img src="' + esc(fotoUrl) + '" alt=""/>';
      }
    }
  } catch (_) {}

  /* ── Admin: el único módulo condicional, se agrega al menú de la foto
     de perfil en vez de alternar `hidden` — mismo motivo que el avatar
     arriba. Solo para quien de verdad es administrador (profile.isAdmin,
     calculado en app-shell.js a partir de usuarios.rol === 'admin'):
     nadie más ve este enlace. */
  if (profile?.isAdmin) {
    const menu = document.getElementById('home-avatar-menu');

/* ── Menú de la foto de perfil: abre/cierra al clic, Escape y clic
   afuera lo cierran. Sin alternar `display` en CSS — el propio [hidden]
   basta, ya que .home-avatar-menu no fija `display` propio. */
(function () {
  const btn = document.getElementById('home-avatar');
  const menu = document.getElementById('home-avatar-menu');
  if (!btn || !menu) return;
  function abrir() {
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('click', onClickFuera, true);
  }
  function cerrar() {
    menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKeydown);
    document.removeEventListener('click', onClickFuera, true);
  }
  function onKeydown(e) { if (e.key === 'Escape') { cerrar(); btn.focus(); } }
  function onClickFuera(e) { if (!menu.contains(e.target) && e.target !== btn) cerrar(); }
  btn.addEventListener('click', () => { if (menu.hidden) abrir(); else cerrar(); });
})();
</script>
