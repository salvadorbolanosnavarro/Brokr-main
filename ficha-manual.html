<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover"/>
<title>Broquer — Ficha Manual</title>
<meta name="theme-color" content="#F7F5EE"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ─── App UI ─────────────────────────────────── */
#app-ui{
  max-width: 680px; margin: 0 auto;
  padding: 24px 20px 60px;
}

.ui-card{
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.ui-card h3{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--mute);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

/* form rows */
.frow{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.frow.three{ grid-template-columns: 1fr 1fr 1fr; }
.frow.single{ grid-template-columns: 1fr; }
.f{ display: flex; flex-direction: column; gap: 5px; }
.f label{
  font-size: 12px;
  font-weight: 500;
  color: var(--mute);
  letter-spacing: -0.005em;
}
.f input, .f select, .f textarea{
  padding: 10px 14px;
  background: var(--bone);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  font-size: 13px;
  font-family: var(--font-sans);
  color: var(--ink);
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.f input:focus, .f select:focus, .f textarea:focus{
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(10,10,10,0.06);
}
.f input::placeholder, .f textarea::placeholder{ color: var(--mute-2); }
.f textarea{ resize: vertical; min-height: 90px; }

#precio-renta-row{ display: none; }

/* foto upload */
.foto-upload-area{
  border: 2px dashed var(--line-2);
  border-radius: var(--r);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s var(--ease), background .2s var(--ease);
  background: var(--paper-2);
}
.foto-upload-area:hover{
  border-color: var(--ink);
  background: var(--bone);
}
.foto-upload-area p{
  font-size: 13px;
  color: var(--mute);
  margin-top: 10px;
}
.foto-upload-area svg{ opacity: .55; color: var(--mute); }

#photos-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.photo-thumb{
  position: relative;
  border-radius: var(--r);
  overflow: hidden;
  aspect-ratio: 1;
  cursor: grab;
  border: 2px solid transparent;
  transition: border-color .15s var(--ease);
}
.photo-thumb.drag-over{ border-color: var(--ink); }
.photo-thumb.dragging{ opacity: .5; }
.photo-thumb img{ width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-main-badge{
  position: absolute;
  bottom: 5px; left: 5px;
  background: var(--forest);
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--r-pill);
  letter-spacing: .06em;
  text-transform: uppercase;
}
.photo-del{
  position: absolute;
  top: 5px; right: 5px;
  background: rgba(10,10,10,.65);
  color: var(--bone);
  border: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
#drag-hint{
  display: none;
  font-size: 11px;
  color: var(--mute);
  text-align: center;
  margin-top: 8px;
}
#drag-hint.show{ display: block; }

/* AI desc button */
.ai-btn{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  background: var(--ink);
  color: var(--bone);
  border: none;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  margin-top: 10px;
  transition: background var(--dur) var(--ease);
}
.ai-btn:hover{ background: var(--ink-2); }
.ai-hint{
  font-size: 11px;
  color: var(--mute);
  margin-top: 8px;
}

/* action buttons */
.actions{
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.ui-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 20px;
  background: var(--ink);
  color: var(--bone);
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-sans);
  letter-spacing: -0.005em;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.ui-btn:hover{ background: var(--ink-2); }
.ui-btn:active{ transform: scale(.98); }
.ui-btn.forest{ background: var(--forest); }
.ui-btn.forest:hover{ background: var(--forest-2); }
.ui-btn.outline{
  background: transparent;
  color: var(--ink);
  border-color: var(--line-2);
}
.ui-btn.outline:hover{ background: var(--paper-2); }

#print-bar{
  display: none;
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 18px;
  margin-bottom: 14px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#print-bar.show{ display: flex; }
#print-bar span{
  font-size: 13px;
  color: var(--mute);
  font-weight: 500;
}

/* ─── FICHA PAGES ─────────────────────────────── */
#ficha{ display: none; margin-bottom: 40px; }
#ficha.show{ display: block; }
#ficha-pages{}

.ficha-page{
  width: 210mm;
  background: var(--bone);
  margin: 0 auto 24px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--r);
}

/* ─── COVER (page 1) ─────────────────────────── */
.cover-hero{
  width: 100%;
  height: 110mm;
  object-fit: cover;
  display: block;
  flex-shrink: 0;
}
.cover-hero-placeholder{
  width: 100%; height: 110mm;
  background: linear-gradient(135deg, var(--ink), var(--ink-2));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.cover-info{
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
}
.cover-badge{
  display: inline-block;
  background: var(--forest);
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  margin-bottom: 10px;
}
.cover-precio{
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1;
  margin-bottom: 6px;
}
.cover-titulo{
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}
.cover-ubicacion{
  font-size: 12px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 6px;
}

.cover-specs{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--line);
}
.spec-item{
  padding: 12px 16px;
  text-align: center;
  border-right: 1px solid var(--line);
}
.spec-item:last-child{ border-right: none; }
.spec-ico{
  width: 24px; height: 24px;
  margin: 0 auto 6px;
  color: var(--mute);
}
.spec-ico svg{ width: 100%; height: 100%; }
.spec-val{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.spec-lbl{
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mute);
  margin-top: 3px;
}

.cover-desc-wrap{
  padding: 16px 24px;
  flex: 1;
}
.cover-desc-ttl{
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  display: inline-block;
  letter-spacing: -0.015em;
}
.cover-desc{
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.65;
}

/* ─── GALLERY ──────────────────────────────────── */
.gallery-header{
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
}
.photo-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 82mm 82mm 82mm;
  gap: 3px;
  padding: 3px;
  height: 246mm;
  overflow: hidden;
  flex-shrink: 0;
}
.photo-grid img{
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* ─── CARACTERÍSTICAS ──────────────────────────── */
.chars-header{
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--line);
}
.chars-header h2{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
}
.chars-body{
  padding: 16px 24px;
  flex: 1;
}
.char-table{
  width: 100%;
  border-collapse: collapse;
}
.char-table tr{
  border-bottom: 1px solid var(--line);
}
.char-table tr:last-child{ border-bottom: none; }
.char-table td{
  padding: 8px 12px;
  font-size: 12px;
  vertical-align: middle;
}
.char-table td:first-child{
  color: var(--mute);
  width: 42%;
  font-weight: 400;
}
.char-table td:last-child{
  color: var(--ink);
  font-weight: 500;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.char-table tr:nth-child(even) td{ background: var(--paper-2); }

.amen-section{ margin-top: 16px; }
.amen-ttl{
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--mute);
  margin-bottom: 8px;
}
.amen-grid{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.amen-item{
  font-size: 11px;
  padding: 5px 10px;
  background: var(--paper-2);
  border-radius: var(--r-pill);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

/* ─── FOOTER PDF ───────────────────────────────── */
.ficha-footer{
  width: 100%;
  height: 40px;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}
.ft-logo img{
  height: 22px;
  width: auto;
  display: block;
}
.ft-id{
  font-family: var(--font-mono);
  font-size: 9px;
  color: rgba(247,245,238,.55);
  letter-spacing: .08em;
}

/* ─── PRINT ────────────────────────────────────── */
@media print{
  *{
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  html, body{ margin: 0; padding: 0; background: white; }
  #app-ui{ display: none; }
  #ficha{ display: block; margin: 0; }
  .ficha-page{
    width: 210mm;
    height: 297mm;
    margin: 0;
    padding: 0;
    box-shadow: none;
    border: none;
    border-radius: 0;
    page-break-after: always;
    page-break-inside: avoid;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .ficha-page:last-child{ page-break-after: avoid; }
  .cover-hero, .cover-hero-placeholder{ height: 110mm; }
  .photo-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 82mm 82mm 82mm;
    gap: 3px;
    padding: 3px;
    flex-shrink: 0;
    height: 246mm;
    overflow: hidden;
  }
  .photo-grid img{ width: 100%; height: 100%; object-fit: cover; }
  .chars-body{ overflow: hidden; }
  .cover-desc-wrap{ overflow: hidden; }
  @page{ size: A4 portrait; margin: 0; }
}

/* ─── MOBILE ───────────────────────────────────── */
@media(max-width: 768px){
  #app-ui{ padding: 18px 14px 40px; }
  .frow, .frow.three{ grid-template-columns: 1fr; }
  #photos-grid{ grid-template-columns: repeat(3, 1fr); }
  .ficha-page{ width: 100%; margin-bottom: 12px; }
  .cover-hero, .cover-hero-placeholder{ height: 55vw; }
  .cover-specs{ grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body data-app="ficha-manual">

<!-- ═══ APP UI ═══════════════════════════════ -->
<div id="app-ui">

  <!-- FOTOS -->
  <div class="ui-card">
    <h3>Fotos</h3>
    <div class="foto-upload-area" onclick="document.getElementById('foto-input').click()">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <p>Toca para agregar fotos desde tu celular o computadora</p>
    </div>
    <input type="file" id="foto-input" accept="image/*" multiple style="display:none" onchange="addPhotos(this)"/>
    <div id="photos-grid"></div>
    <div id="drag-hint">Arrastra para reordenar · La primera foto será la portada</div>
  </div>

  <!-- DATOS BÁSICOS -->
  <div class="ui-card">
    <h3>Datos básicos</h3>
    <div class="frow">
      <div class="f">
        <label>Tipo de inmueble</label>
        <select id="d-tipo" onchange="onTipoFichaChange()">
          <option value="">Seleccionar</option>
          <option value="Casa">Casa</option>
          <option value="Departamento">Departamento</option>
          <option value="Edificio">Edificio</option>
          <option value="Terreno">Terreno</option>
          <option value="Local comercial">Local comercial</option>
          <option value="Oficina">Oficina</option>
          <option value="Bodega">Bodega</option>
          <option value="Rancho">Rancho</option>
        </select>
      </div>
      <div class="f">
        <label>Operación</label>
        <select id="d-op" onchange="onOpChange()">
          <option value="Venta">Venta</option>
          <option value="Renta">Renta</option>
          <option value="Venta y renta">Venta y Renta</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="f">
        <label>Precio de venta</label>
        <input type="text" id="d-precio" placeholder="$2,500,000" oninput="propFmtMoney(this)"/>
      </div>
      <div class="f" id="precio-renta-row">
        <label>Precio de renta / mes</label>
        <input type="text" id="d-precio-renta" placeholder="$15,000" oninput="propFmtMoney(this)"/>
      </div>
    </div>
  </div>

  <!-- UBICACIÓN -->
  <div class="ui-card">
    <h3>Ubicación</h3>
    <div class="frow">
      <div class="f">
        <label>Colonia</label>
        <input type="text" id="d-colonia" placeholder="Las Palmas"/>
      </div>
      <div class="f">
        <label>Ciudad</label>
        <input type="text" id="d-ciudad" placeholder="Ciudad de México" value="Morelia"/>
      </div>
    </div>
    <div class="frow single">
      <div class="f">
        <label>Dirección</label>
        <input type="text" id="d-dir" placeholder="Av. Insurgentes 123"/>
      </div>
    </div>
  </div>

  <!-- CARACTERÍSTICAS -->
  <div class="ui-card">
    <h3>Características</h3>
    <div class="frow three" id="frow-rec-ban">
      <div class="f" id="fld-rec"><label>Recámaras</label><input type="number" id="d-rec" placeholder="3" min="0"/></div>
      <div class="f" id="fld-ban"><label>Baños completos</label><input type="number" id="d-ban" placeholder="2" min="0" step="0.5"/></div>
      <div class="f" id="fld-mban"><label>Medios baños</label><input type="number" id="d-mban" placeholder="1" min="0"/></div>
    </div>
    <div class="frow three">
      <div class="f"><label>m² Construcción</label><input type="number" id="d-m2c" placeholder="180" min="0"/></div>
      <div class="f"><label>m² Terreno</label><input type="number" id="d-m2t" placeholder="220" min="0"/></div>
      <div class="f"><label>Estacionamientos</label><input type="number" id="d-est" placeholder="2" min="0"/></div>
    </div>
    <div class="frow">
      <div class="f"><label>Niveles</label><input type="number" id="d-niv" placeholder="2" min="0"/></div>
      <div class="f"><label>Año de construcción</label><input type="number" id="d-anio" placeholder="2015" min="1900" max="2030"/></div>
    </div>
  </div>

  <!-- DESCRIPCIÓN -->
  <div class="ui-card">
    <h3>Descripción</h3>
    <div class="f">
      <label>Descripción comercial</label>
      <textarea id="d-desc" rows="5" placeholder="Describe la propiedad de forma atractiva..."></textarea>
      <button class="ai-btn" id="ai-btn" onclick="generarDescripcion()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
        </svg>
        Generar con IA
      </button>
      <div class="ai-hint" id="ai-hint">La IA redactará una descripción basada en los datos del formulario.</div>
    </div>
  </div>

  <!-- AMENIDADES -->
  <div class="ui-card">
    <h3>Amenidades</h3>
    <div class="f">
      <label>Lista separada por comas</label>
      <input type="text" id="d-amen" placeholder="Alberca, Jardín, Cuarto de servicio, Roof garden"/>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="ui-card">
    <label style="display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;font-size:13px;color:var(--ink)">
      <input type="checkbox" id="ficha-save-inmueble" checked style="width:18px;height:18px;cursor:pointer;accent-color:var(--ink)"/>
      <span><strong>Guardar en Tus inmuebles</strong> <span style="color:var(--mute)">— quedará disponible en tu inventario.</span></span>
    </label>
    <div class="actions">
      <button class="ui-btn" onclick="generarFicha()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        Generar ficha
      </button>
    </div>
  </div>

  <div id="print-bar">
    <span id="print-bar-txt">Ficha lista</span>
    <button class="ui-btn forest" id="pdf-btn" onclick="abrirPDF()">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      Ver / Compartir PDF
    </button>
  </div>
</div>

<!-- ═══ FICHA ════════════════════════════════ -->
<div id="ficha">
  <div id="ficha-pages"></div>
</div>

<script>
const API = 'https://api.broquer.app';

function g(id){ return document.getElementById(id); }
function gv(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function propFmtMoney(input){
  const raw = getRawNum(input.value);
  if(!raw){ input.value = ''; return; }
  input.value = '$' + raw.toLocaleString('es-MX', {minimumFractionDigits:0,maximumFractionDigits:0});
}

// ── FOTOS ────────────────────────────────────
let fotos = []; // {url, name}

// Precargar fotos enviadas desde el Editor de imágenes (sessionStorage)
(function preloadFromEditor(){
  try {
    const raw = sessionStorage.getItem('broquer_editor_images');
    if (!raw) return;
    const imgs = JSON.parse(raw);
    if (Array.isArray(imgs) && imgs.length) {
      imgs.forEach(img => { if (img && img.url) fotos.push({ url: img.url, name: img.name || 'editada.jpg' }); });
      sessionStorage.removeItem('broquer_editor_images');
      // Renderizar cuando el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => renderThumbs());
      } else {
        setTimeout(renderThumbs, 0);
      }
    }
  } catch(_) {}
})();

// ── PRICE FORMATTING ──
function onOpChange(){
  const op = document.getElementById('d-op').value;
  const renta = document.getElementById('precio-renta-row');
  if(op === 'Venta y renta'){
    renta.style.display = 'flex';
  } else {
    renta.style.display = 'none';
  }
}

function getRawNum(val){
  return parseInt(val.split('.')[0].replace(/[^0-9]/g, '') || '0', 10);
}

function fmtInput(input){
  const n = getRawNum(input.value);
  if(!n){ input.value = ''; return; }
  input.value = n.toLocaleString('en-US');
}

function fmtInputBlur(input){
  const n = getRawNum(input.value);
  if(!n){ input.value = ''; return; }
  input.value = n.toLocaleString('en-US') + '.00';
}

function fmtPrecio(input){ fmtInput(input); }
function fmtPrecioBlur(input){ fmtInputBlur(input); }

function getPrecioFormateado(fieldId){
  const id = fieldId || 'd-precio';
  const n = getRawNum(document.getElementById(id)?.value || '');
  if(!n) return '';
  return '$' + n.toLocaleString('en-US') + '.00';
}

// ── PHOTOS ──
function addPhotos(input){
  const files = Array.from(input.files || input);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      fotos.push({ url: e.target.result, name: file.name });
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderThumbs(){
  const grid = document.getElementById('photos-grid');
  grid.innerHTML = fotos.map((f,i) => `
    <div class="photo-thumb" draggable="true" data-idx="${i}"
      ondragstart="dragStart(event,${i})"
      ondragover="dragOver(event,${i})"
      ondrop="dragDrop(event,${i})"
      ondragend="dragEnd(event)">
      <img src="${f.url}" alt="foto ${i+1}"/>
      ${i===0 ? '<div class="photo-main-badge">Portada</div>' : ''}
      <button class="photo-del" onclick="deletePhoto(${i})">×</button>
    </div>`).join('');
  const hint = document.getElementById('drag-hint');
  if(hint) hint.classList[fotos.length > 1 ? 'add' : 'remove']('show');
}

let dragSrcIdx = null;

function dragStart(e, idx){
  dragSrcIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('dragging');
}
function dragOver(e, idx){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.photo-thumb').forEach(el => el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
  return false;
}
function dragDrop(e, idx){
  e.preventDefault();
  if(dragSrcIdx === null || dragSrcIdx === idx) return;
  const moved = fotos.splice(dragSrcIdx, 1)[0];
  fotos.splice(idx, 0, moved);
  renderThumbs();
}
function dragEnd(e){
  document.querySelectorAll('.photo-thumb').forEach(el => {
    el.classList.remove('dragging');
    el.classList.remove('drag-over');
  });
  dragSrcIdx = null;
}

function deletePhoto(idx){
  fotos.splice(idx, 1);
  renderThumbs();
}

async function generarDescripcion(){
  const btn  = document.getElementById('ai-btn');
  const hint = document.getElementById('ai-hint');
  const desc = document.getElementById('d-desc');

  if(btn){ btn.disabled = true; btn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></span> Generando...'; }
  if(hint){ hint.textContent = desc.value.trim() ? 'Mejorando tu texto con IA...' : 'Conectando con IA...'; }

  const datos = getDatos();
  const lineas = [
    datos.tipo    ? '- Tipo: '            + datos.tipo    : '',
    datos.op      ? '- Operación: '       + datos.op      : '',
    datos.colonia ? '- Colonia: '         + datos.colonia + ', ' + datos.ciudad : '- Ciudad: ' + datos.ciudad,
    datos.rec     ? '- Recámaras: '       + datos.rec     : '',
    datos.ban     ? '- Baños: '           + datos.ban     : '',
    datos.m2c     ? '- Construcción: '    + datos.m2c + ' m²' : '',
    datos.m2t     ? '- Terreno: '         + datos.m2t + ' m²' : '',
    datos.est     ? '- Estacionamientos: '+ datos.est     : '',
    datos.anio    ? '- Año: '             + datos.anio    : '',
    datos.amen    ? '- Amenidades: '      + datos.amen    : '',
  ].filter(Boolean).join('\n');

  const textoUsuario = desc.value.trim();
  const prompt = textoUsuario
    ? 'Eres un agente inmobiliario experto en México. El usuario ha redactado la siguiente descripción para una propiedad. Mejórala: hazla más atractiva, profesional y fluida, conservando fielmente las ideas y detalles que el usuario mencionó. Máximo 180 palabras. Sin emojis. Sin mencionar precio.\n\nDatos de la propiedad:\n' + lineas + '\n\nTexto original del usuario:\n' + textoUsuario + '\n\nRedacta solo la descripción mejorada:'
    : 'Eres un agente inmobiliario experto en México. Redacta una descripción comercial atractiva y profesional para esta propiedad. Máximo 180 palabras. Sin emojis. Sin mencionar precio.\n\nDatos:\n' + lineas + '\n\nRedacta solo la descripción:';

  try{
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ messages: [{role:'user', content: prompt}], max_tokens: 400, temperature: 0.7 })
    });
    const txt = await r.text();
    if(!r.ok) throw new Error('Error ' + r.status + ': ' + txt);
    let data;
    try{ data = JSON.parse(txt); } catch(e){ throw new Error('Respuesta inválida: ' + txt.slice(0,100)); }
    const respuesta = data.choices?.[0]?.message?.content || data.content || data.text || '';
    if(!respuesta) throw new Error('Sin contenido');
    desc.value = respuesta.trim();
    if(hint){ hint.textContent = 'Descripción generada — puedes editarla.'; }
  } catch(e){
    alert('Error generando descripción: ' + e.message);
    if(hint){ hint.textContent = 'La IA redactará una descripción basada en los datos del formulario.'; }
  } finally{
    if(btn){ btn.disabled = false; btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/></svg> Generar con IA'; }

// ── RENDER FICHA ─────────────────────────────
function buildFicha(d, fotos){
  const id = d.id || '';
  const titulo = (d.tipo || 'Propiedad') + (d.op ? ' en ' + d.op : '');
  const tipo_op = (d.op || 'Venta').toUpperCase();
  const ubicacion = [d.colonia, d.ciudad].filter(Boolean).join(', ') || d.dir || '—';

  // SPECS
  const specs = [];
  if(d.rec)  specs.push({ico:SPEC_ICONS.bed,    val:d.rec,  lbl:'Recámaras'});
  if(d.ban)  specs.push({ico:SPEC_ICONS.bath,   val:d.ban,  lbl:'Baños'});
  if(d.m2c)  specs.push({ico:SPEC_ICONS.area,   val:d.m2c,  lbl:'m² Const.'});
  if(d.m2t)  specs.push({ico:SPEC_ICONS.land,   val:d.m2t,  lbl:'m² Terreno'});
  if(d.est && specs.length<4)  specs.push({ico:SPEC_ICONS.parking, val:d.est, lbl:'Estacion.'});

  const specsHTML = specs.length ? `<div class="cover-specs">
    ${specs.slice(0,4).map(s=>`<div class="spec-item">
      <div class="spec-ico">${s.ico}</div>
      <div class="spec-val">${s.val}</div>
      <div class="spec-lbl">${s.lbl}</div>
    </div>`).join('')}
  </div>` : '';

  // HERO
  const hero = fotos[0]?.url || null;
  const heroHTML = hero
    ? `<img class="cover-hero" src="${hero}" alt="portada"/>`
    : `<div class="cover-hero-placeholder"></div>`;

  // PAGE 1
  let pages = `
  <div class="ficha-page">
    ${heroHTML}
    <div class="cover-info">
      <div class="cover-badge">${tipo_op}</div>
      <div class="cover-precio">${d.precio || '—'}</div>
      <div class="cover-titulo">${titulo}</div>
      <div class="cover-ubicacion">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        ${ubicacion}
      </div>
    </div>
    ${specsHTML}
    ${d.desc ? `<div class="cover-desc-wrap"><div class="cover-desc-ttl">Descripción</div><div class="cover-desc">${d.desc}</div></div>` : '<div style="flex:1"></div>'}
    ${footer(id)}
  </div>`;

  // GALLERY PAGES (6 per page)
  const galleryFotos = fotos.slice(1).map(f=>f.url).filter(Boolean);
  for(let i=0; i<galleryFotos.length; i+=6){
    const batch = galleryFotos.slice(i,i+6);
    while(batch.length < 6) batch.push(null);
    pages += `
    <div class="ficha-page">
      <div class="gallery-header"><h2>Galería fotográfica</h2></div>
      <div class="photo-grid">
        ${batch.map(src => src
          ? `<img src="${src}" alt="foto"/>`
          : `<div style="background:var(--paper-2)"></div>`
        ).join('')}
      </div>
      ${footer(id)}
    </div>`;
  }

  // CARACTERÍSTICAS
  const rows = [];
  if(d.tipo)   rows.push(['Tipo de inmueble', d.tipo]);
  if(d.op)     rows.push(['Operación', d.op]);
  if(d.precio) rows.push(['Precio', d.precio]);
  if(d.rec)    rows.push(['Recámaras', d.rec]);
  if(d.ban)    rows.push(['Baños completos', d.ban]);
  if(d.mban)   rows.push(['Medios baños', d.mban]);
  if(d.m2c)    rows.push(['Superficie construida', d.m2c+' m²']);
  if(d.m2t)    rows.push(['Superficie de terreno', d.m2t+' m²']);
  if(d.est)    rows.push(['Estacionamientos', d.est]);
  if(d.niv)    rows.push(['Niveles', d.niv]);
  if(d.anio)   rows.push(['Año de construcción', d.anio]);
  if(d.colonia) rows.push(['Colonia', d.colonia]);
  if(d.ciudad)  rows.push(['Ciudad', d.ciudad]);
  if(d.dir)     rows.push(['Dirección', d.dir]);

  const amenList = d.amen ? d.amen.split(',').map(a=>a.trim()).filter(Boolean) : [];
  const amenHTML = amenList.length ? `
    <div class="amen-section">
      <div class="amen-ttl">Amenidades</div>
      <div class="amen-grid">${amenList.map(a=>`<div class="amen-item">${a}</div>`).join('')}</div>
    </div>` : '';

  pages += `
  <div class="ficha-page">
    <div class="chars-header"><h2>Características del inmueble</h2></div>
    <div class="chars-body">
      <table class="char-table"><tbody>
        ${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      </tbody></table>
      ${amenHTML}
    </div>
    ${footer(id)}
  </div>`;

  return pages;
}

    niv:     gv('d-niv'),
    anio:    gv('d-anio'),
    desc:    gv('d-desc'),

async function generarFicha(){
  const d = getDatos();
  if(!fotos.length && !d.tipo && !d.colonia){
    alert('Agrega al menos una foto y los datos básicos de la propiedad.');
    return;
  }
  const btn = document.querySelector('.actions .ui-btn');
  btn.disabled = true;
  btn.innerHTML = `<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;"></span> Generando ficha...`;
  try{
    const rawNum = (v) => parseFloat((v||'').replace(/[$,]/g,'').trim()) || null;
    const propData = {
      id: null,
      public_id: null,
      title: [d.tipo, d.op ? 'en ' + d.op : ''].filter(Boolean).join(' ') || 'Propiedad',
      property_type: d.tipo || 'Propiedad',
      description: d.desc || '',
      operations: d.precio ? [{
        type: d.op === 'Renta' ? 'rental' : 'sale',
        amount: rawNum(d.precio),
        currency: 'MXN'
      }] : [],
      location: { name: d.colonia || '', city: d.ciudad || 'Morelia' },
      address: d.dir || '',
      bedrooms: d.rec ? parseFloat(d.rec) : null,
      bathrooms: d.ban ? parseFloat(d.ban) : null,
      half_bathrooms: d.mban ? parseFloat(d.mban) : null,
      construction_size: d.m2c ? parseFloat(d.m2c) : null,
      lot_size: d.m2t ? parseFloat(d.m2t) : null,
      parking_spaces: d.est ? parseFloat(d.est) : null,
      floors: d.niv ? parseFloat(d.niv) : null,
      age: d.anio || null,
      amenities: d.amen ? d.amen.split(',').map(a=>({name:a.trim()})).filter(a=>a.name) : [],
      property_images: fotos.map(f => ({ url: f.url, original: f.url }))
    };

    const res = await fetch(API + '/ficha-pdf', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(propData)
    });
    if(!res.ok) throw new Error('Error servidor: ' + res.status);
    const data = await res.json();
    const pdfUrl = API + '/ficha-pdf/' + data.token;
    _lastPdfToken = data.token;
    window.open(pdfUrl, '_blank');
    g('print-bar').classList.add('show');
    document.getElementById('print-bar-txt').textContent = 'Ficha lista — comparte desde el visor';
  } catch(e){
    alert('Error generando ficha: ' + e.message);
  } finally{
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg> Generar ficha`;
  }
}

// ══ SHAARK — llenar ficha manual vía postMessage ══
window.addEventListener('message', function(e) {
  const d = e.data;
  if (!d || d.tipo !== 'crear_ficha_manual') return;

  const set = (id, val) => { const el = document.getElementById(id); if (el && val !== undefined && val !== null) el.value = val; };

  if (d.tipo_inmueble) {
    const el = document.getElementById('d-tipo');
    if (el) {
      const opt = Array.from(el.options).find(o => o.value.toLowerCase() === String(d.tipo_inmueble).toLowerCase());
      if (opt) el.value = opt.value;
    }
  }
  if (d.operacion) {
    const el = document.getElementById('d-op');
    if (el) {
      const opt = Array.from(el.options).find(o => o.value.toLowerCase() === String(d.operacion).toLowerCase());
      if (opt) { el.value = opt.value; if (typeof onOpChange === 'function') onOpChange(); }
    }
  }
  if (d.precio) {
    const el = document.getElementById('d-precio');
    if (el) { el.value = '$' + Number(d.precio).toLocaleString('es-MX'); }
  }
  set('d-colonia', d.colonia);
  set('d-ciudad',  d.ciudad);
  set('d-dir',     d.dir);
  if (d.recamaras !== undefined)       set('d-rec',  d.recamaras);
  if (d.banos !== undefined)           set('d-ban',  d.banos);
  if (d.m2_construccion !== undefined) set('d-m2c',  d.m2_construccion);
  if (d.m2_terreno !== undefined)      set('d-m2t',  d.m2_terreno);
  if (d.estacionamientos !== undefined)set('d-est',  d.estacionamientos);
  if (d.descripcion) set('d-desc', d.descripcion);
});

      const opt = Array.from(el.options).find(o => o.value.toLowerCase() === String(val).toLowerCase());
      if (opt) el.value = opt.value;
    };
    setSelect('d-tipo', d.tipo);
    setSelect('d-op',   d.operacion);
    if (typeof onOpChange === 'function') onOpChange();

    // Precio
    if (d.precio) {
      const el = document.getElementById('d-precio');
      if (el) el.value = '$' + Number(d.precio).toLocaleString('es-MX');
    }
    // Resto de campos
    const setVal = (id, val) => {
      const el = document.getElementById(id);
      if (el && val !== undefined && val !== null && val !== '') el.value = val;
    };
    setVal('d-colonia', d.colonia);
    setVal('d-ciudad',  d.ciudad);
    setVal('d-dir',     d.dir);
    setVal('d-rec',     d.recamaras);
    setVal('d-ban',     d.banos);
    setVal('d-m2c',     d.m2c);
    setVal('d-m2t',     d.m2t);
    setVal('d-est',     d.est);
    setVal('d-anio',    d.anio);
    setVal('d-desc',    d.desc);

    // Fotos: usar las URLs públicas de Supabase tal cual
    if (Array.isArray(d.fotos) && d.fotos.length) {
      fotos.length = 0;
      d.fotos.forEach(f => fotos.push({ url: f.url, name: f.name || 'foto.jpg' }));
      if (typeof renderThumbs === 'function') renderThumbs();
    }
  } catch (e) {
    console.warn('No se pudo precargar la ficha:', e);
  }
})();

// ── Subir fotos al bucket de Storage ──────────────────────────────
// Toma la lista de fotos (que pueden venir como base64 "data:..." cuando
// el agente las acaba de subir desde su dispositivo) y las sube al bucket
// "fotos-propiedades". Devuelve solo las URLs públicas. Las fotos que ya
// son una URL http(s) (vinieron de Mis Inmuebles o del editor) se dejan
// igual. Así la base de datos guarda enlaces ligeros, NO las imágenes como
// texto —que era lo que saturaba el disco de la base—.
async function _fmSubirFotosAlBucket(lista, token) {
  const urls = [];
  for (const f of (lista || [])) {
    const u = f && f.url ? f.url : null;
    if (!u) continue;
    // Ya es una URL pública: se deja tal cual, no se vuelve a subir.
    if (/^https?:\/\//i.test(u)) { urls.push(u); continue; }
    // Es base64 (data:...): convertir a archivo binario y subir al bucket.
    if (u.startsWith('data:')) {
      try {
        const blob = await (await fetch(u)).blob();
        const mime = blob.type || 'image/jpeg';
        const ext  = (mime.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
        const name = `prop_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const r = await fetch(`${SB_URL_FM}/storage/v1/object/fotos-propiedades/${name}`, {
          method: 'POST',
          headers: {
            'apikey': SB_KEY_FM,
            'Authorization': 'Bearer ' + token,
            'Content-Type': mime,
            'x-upsert': 'true'
          },
          body: blob
        });
        if (r.ok) {
          urls.push(`${SB_URL_FM}/storage/v1/object/public/fotos-propiedades/${name}`);
        } else {
          console.warn('No se pudo subir una foto al bucket:', r.status, await r.text());
        }
      } catch (e) {
        console.warn('Error subiendo foto al bucket:', e);
      }
    }
  }
  return urls;
}

// ── Después de generar la ficha: guardar también en Mis Inmuebles ──
async function guardarComoInmueble() {
  // Si ya venía de una propiedad existente, no duplicar
  if (_propIdOrigen) return;

  const userId = _fmGetUserId();
  const token = _fmGetToken();
  if (!userId || !token) return; // sin sesión, no hacemos nada (la ficha igual se generó)

  // Subir las fotos al bucket y quedarnos solo con sus URLs. Esto evita
  // guardar las imágenes como base64 dentro de la fila de la base de datos
  // (el patrón que disparaba el disco al 95% y tiraba todo lo demás).
  const upToken = (window.brokrSb && window.brokrSb.ensureToken ? await window.brokrSb.ensureToken() : null) || token;
  const fotosUrls = await _fmSubirFotosAlBucket(fotos, upToken);

  const d = getDatos();
  const rawNum = (v) => parseFloat((v || '').replace(/[$,]/g, '').trim()) || null;

  // Mapeo: ficha-manual (form IDs) → esquema de Mis Inmuebles
  const inmueble = {
    user_id:           userId,
    titulo:            [d.tipo, d.op ? 'en ' + d.op : '', d.colonia ? '· ' + d.colonia : ''].filter(Boolean).join(' ') || 'Propiedad',
    tipo:              (d.tipo || '').toLowerCase() || null,
    operacion:         (d.op || '').toLowerCase().replace('venta y renta', 'venta') || null,
    estatus:           'activa',
    precio:            rawNum(d.precio),
    moneda:            'MXN',
    calle:             d.dir || null,
    colonia:           d.colonia || null,
    ciudad:            d.ciudad || 'Morelia',
    recamaras:         d.rec ? parseInt(d.rec) : null,
    banos:             d.ban ? parseFloat(d.ban) : null,
    m2_construccion:   d.m2c ? parseFloat(d.m2c) : null,
    m2_terreno:        d.m2t ? parseFloat(d.m2t) : null,
    estacionamientos:  d.est ? parseInt(d.est) : null,
    anio_construccion: d.anio ? parseInt(d.anio) : null,
    descripcion:       d.desc || null,
    fotos:             fotosUrls,
    updated_at:        new Date().toISOString()
  };

  try {
    // Usar brokrSb.rest si está disponible (maneja auto-refresh de token)
    if (window.brokrSb && window.brokrSb.rest) {
      await window.brokrSb.rest('propiedades', { method: 'POST', body: inmueble });
    } else {
      const freshToken = (window.brokrSb?.ensureToken ? await window.brokrSb.ensureToken() : null) || token;
      const r = await fetch(SB_URL_FM + '/rest/v1/propiedades', {
        method: 'POST',
        headers: {
          'apikey': SB_KEY_FM,
          'Authorization': 'Bearer ' + freshToken,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(inmueble)
      });
      if (!r.ok) {
        console.warn('No se pudo guardar en Mis Inmuebles:', await r.text());
        return;
      }
    }
    _mostrarToastInmueble();
  } catch (e) {
    console.warn('Error guardando en Mis Inmuebles:', e);
  }
}

function _mostrarToastInmueble() {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a2035;color:white;padding:11px 18px;border-radius:22px;font-size:13px;z-index:99999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:88vw;text-align:center;';
  toast.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> También se guardó en Mis Inmuebles';
  document.body.appendChild(toast);
  setTimeout(() => toast.style.opacity = '0', 3500);
  setTimeout(() => toast.remove(), 4200);
}

// Wrap de generarFicha para llamar a guardarComoInmueble después
const _generarFichaOriginal = generarFicha;
generarFicha = async function() {
  await _generarFichaOriginal();
  // Solo guardar si la generación fue exitosa (token presente) Y el checkbox sigue marcado
  if (_lastPdfToken) {
    const chk = document.getElementById('ficha-save-inmueble');
    if (!chk || chk.checked) {
      await guardarComoInmueble().catch(err => console.warn('guardarComoInmueble:', err));
    }
  }
};

// Ocultar campos de recámaras/baños para tipos que no aplican
function onTipoFichaChange() {
  const tipoEl = document.getElementById('d-tipo');
  if (!tipoEl) return;
  const tipo = (tipoEl.value || '').toLowerCase();
  const sinHabitaciones = ['terreno', 'local comercial', 'oficina', 'bodega', 'rancho', 'edificio'];
  const hide = sinHabitaciones.includes(tipo);
  ['fld-rec', 'fld-ban', 'fld-mban'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = hide ? 'none' : '';
  });
  // Limpiar valores si se ocultan, para evitar enviar datos irrelevantes
  if (hide) {
    ['d-rec', 'd-ban', 'd-mban'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }
}
