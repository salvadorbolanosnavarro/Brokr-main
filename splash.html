<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Broquer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
}

#splash {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#splash-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Fade out overlay */
#splash.fade-out {
  animation: splashFadeOut 0.4s ease-in forwards;
}
@keyframes splashFadeOut {
  from { opacity: 1; }
  to   { opacity: 0; }
}
</style>
</head>
<body>

<div id="splash">
  <video
    id="splash-video"
    src="brokr-intro.mp4"
    playsinline
    muted
    preload="auto"
    webkit-playsinline
  >
    <source src="brokr-intro.webm" type="video/webm"/>
    <source src="brokr-intro.mp4"  type="video/mp4"/>
  </video>
</div>

<script>
/* ─── Supabase config (mismo que login.html) ───────────────────────────── */
const SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVydGd5c210bnZvcWFsanVobnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM2MjY0MzMsImV4cCI6MjA1OTIwMjQzM30.nFDiE4FPTFbN8GzjRuIfkKcpxMNBXZMNWPfXLfME3Xw';

/* ─── Determinar destino después del splash ────────────────────────────── */
async function getDestino() {
  // ¿Hay token guardado?
  const token = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token');
  if (!token) return 'login.html';

  // Intentar refresh si existe
  const refresh = localStorage.getItem('sb_refresh');
  if (refresh) {
    try {
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refresh })
      });
      const d = await r.json();
      if (d.access_token) {
        localStorage.setItem('sb_token', d.access_token);
        if (d.refresh_token) localStorage.setItem('sb_refresh', d.refresh_token);
        sessionStorage.setItem('sb_token', d.access_token);
        // Verificar si tiene perfil completo
        const rp = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${d.user.id}&select=nombre`, {
          headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${d.access_token}` }
        });
        const profiles = await rp.json();
        return (profiles?.length && profiles[0]?.nombre) ? 'index.html' : 'registro.html';
      }
    } catch(e) {}
  }

  // Validar token existente sin refresh
  try {
    const r = await fetch(`${SB_URL}/auth/v1/user`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${token}` }
    });
    if (r.status === 200) {
      const user = await r.json();
      if (user?.id) {
        const rp = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${user.id}&select=nombre`, {
          headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${token}` }
        });
        const profiles = await rp.json();
        return (profiles?.length && profiles[0]?.nombre) ? 'index.html' : 'registro.html';
      }
    }
  } catch(e) {}

  return 'login.html';
}

/* ─── Lógica principal ─────────────────────────────────────────────────── */
(async function() {
  const video = document.getElementById('splash-video');
  const splash = document.getElementById('splash');

  // Empezar a calcular destino en paralelo mientras corre el video
  const destinoPromise = getDestino();

  // Función para redirigir con fade
  async function redirigir() {
    const destino = await destinoPromise;
    // Mark splash as seen for this session
    sessionStorage.setItem('brokr_splashed', '1');
    splash.classList.add('fade-out');
    setTimeout(() => { window.location.replace(destino); }, 380);
  }

  // Reproducir el video
  try {
    await video.play();
  } catch(e) {
    // Autoplay bloqueado (raro en mobile con muted+playsinline, pero por si acaso)
    // En ese caso esperar 1.6s y continuar igual
    setTimeout(redirigir, 1600);
    return;
  }

  // Al terminar el video → redirigir
  video.addEventListener('ended', redirigir);

  // Safety net: si el video tarda más de 3s en total (buffering), no bloquear al usuario
  setTimeout(redirigir, 3000);
})();
</script>

</body>
</html>
