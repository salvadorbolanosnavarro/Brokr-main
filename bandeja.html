<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Bandeja · Broquer</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#05203C"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --sky-navy -->
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   BANDEJA — no es un clon de WhatsApp: es el escritorio donde el
   agente trabaja los leads que Recepción ya calificó.
   Tres carriles: lista · conversación · expediente.
   El expediente reusa la superficie navy de Broquer (misma ADN que
   los PDF y que el módulo de WhatsApp): score protagonista y
   rejilla de datos de apoyo.
   ═══════════════════════════════════════════════════════════════ */

/* El shell envuelve la página en .bk-page (con scroll y colchón
   inferior). La bandeja necesita alto completo y scroll propio por
   carril, así que aquí se neutraliza. */
body[data-app="bandeja"] .bk-page{
  padding-bottom:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.bx{display:flex;flex:1;min-height:0;background:var(--paper);border-top:1px solid var(--line)}

/* ═══════════ CARRIL 1 · LISTA ═══════════ */
.bx-list{
  width:330px;flex:none;min-width:0;
  display:flex;flex-direction:column;
  background:var(--bone);border-right:1px solid var(--line);
}
.bx-list__head{padding:var(--sp-5) var(--sp-5) var(--sp-3);border-bottom:1px solid var(--line)}
.bx-list__title{display:flex;align-items:baseline;gap:var(--sp-2)}
.bx-list__title h1{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;letter-spacing:-.025em;line-height:var(--lh-tight);margin:0;color:var(--ink)}
.bx-count{font-size:var(--fs-xs);color:var(--mute);font-variant-numeric:tabular-nums}

.bx-search{position:relative;margin-top:var(--sp-4)}
.bx-search svg{position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute);pointer-events:none}
.bx-search input{
  width:100%;height:var(--h-sm);padding:0 var(--sp-3) 0 var(--sp-8);
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-pill);
  font-family:var(--font-sans);font-size:var(--fs-xs);color:var(--ink);
}
.bx-search input:focus{outline:none;border-color:var(--sky-blue);box-shadow:var(--focus)}
.bx-search input::placeholder{color:var(--mute-2)}

.bx-filters{display:flex;gap:2px;padding:3px;margin-top:var(--sp-3);background:var(--paper-2);border-radius:var(--r-pill)}
.bx-filter{
  flex:1;border:0;background:transparent;cursor:pointer;
  padding:var(--sp-2) var(--sp-1);border-radius:var(--r-pill);
  font-family:var(--font-sans);font-size:var(--fs-caption);font-weight:700;color:var(--mute);
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.bx-filter:hover{color:var(--ink-2)}
.bx-filter.is-active{background:var(--bone);color:var(--ink);box-shadow:var(--shadow-xs)}
.bx-filter:focus-visible{outline:none;box-shadow:var(--focus)}

.bx-convs{flex:1;overflow-y:auto;overscroll-behavior:contain}
.bx-conv{
  position:relative;display:flex;gap:var(--sp-3);align-items:center;
  width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--line);
  font-family:var(--font-sans);
  transition:background var(--dur-fast) var(--ease);
}
.bx-conv:hover{background:var(--paper)}
.bx-conv.is-active{background:var(--sky-canvas)}
.bx-conv.is-active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sky-navy)}
.bx-conv:focus-visible{outline:none;box-shadow:var(--focus)}

.bx-ava{
  width:40px;height:40px;border-radius:50%;flex:none;
  background:var(--sky-navy);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:var(--fs-sm);font-weight:700;
}
.bx-conv__main{display:block;flex:1;min-width:0}
.bx-conv__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2)}
.bx-conv__name{font-size:var(--fs-sm);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-conv__time{font-size:var(--fs-caption);color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.bx-conv__prev{
  display:block;
  font-size:var(--fs-xs);color:var(--mute);line-height:var(--lh-snug);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bx-conv__prev b{color:var(--ink-3);font-weight:700}
.bx-conv__tags{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}

.bx-tag{font-size:var(--fs-caption);font-weight:700;padding:2px var(--sp-2);border-radius:var(--r-pill);line-height:1.5}
.bx-tag--hot{background:var(--warn-soft);color:var(--warn)}
.bx-tag--mine{background:var(--forest-soft);color:var(--forest)}

.bx-list__empty{padding:var(--sp-8) var(--sp-5);text-align:center}
.bx-list__empty p{font-size:var(--fs-xs);color:var(--mute);line-height:var(--lh);margin:0}
.bx-list__empty .bx-cta{margin-top:var(--sp-4)}

/* ═══════════ CARRIL 2 · CONVERSACIÓN ═══════════ */
.bx-thread{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}

/* El atributo hidden aplica display:none desde la hoja del navegador, pero
   cualquier display:flex de autor le gana. Sin esto, threadEmpty.hidden=true
   no hacía nada: el estado vacío y el chat se renderizaban a la vez y se
   partían la altura. Selector de 2 clases -> gana por especificidad, sin
   necesidad de !important. */
.bx-blank[hidden],
.bx-thread__inner[hidden]{display:none}

.bx-blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-8);text-align:center}
.bx-blank__icon{width:52px;height:52px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.bx-blank__icon svg{width:24px;height:24px}
.bx-blank h2{font-family:var(--font-display);font-size:var(--fs-h5);font-weight:700;margin:0;color:var(--ink)}
.bx-blank p{font-size:var(--fs-xs);color:var(--mute);max-width:34ch;line-height:var(--lh);margin:0}
.bx-blank .bx-cta{margin-top:var(--sp-3)}

.bx-cta{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h);padding:0 var(--sp-5);border:1px solid var(--sky-blue);
  border-radius:var(--r-pill);background:var(--sky-blue);color:#fff;
  font-family:var(--font-sans);font-size:var(--fs-sm);font-weight:700;
  cursor:pointer;text-decoration:none;
  transition:background var(--dur-fast) var(--ease);
}
.bx-cta:hover{background:var(--sky-blue-press);color:#fff}

.bx-thread__inner{flex:1;display:flex;flex-direction:column;min-height:0}
.bx-th-head{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--line);background:var(--bone);
}
.bx-back{
  display:none;flex:none;width:36px;height:36px;border:0;background:transparent;
  border-radius:50%;cursor:pointer;color:var(--ink);
  align-items:center;justify-content:center;
}
.bx-back:hover{background:var(--paper-2)}
.bx-th-id{flex:1;min-width:0}
.bx-th-id h2{font-family:var(--font-display);font-size:var(--fs-body);font-weight:700;letter-spacing:-.015em;margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-th-id span{display:block;font-size:var(--fs-caption);color:var(--mute);margin-top:1px;font-variant-numeric:tabular-nums}

.bx-ai{display:flex;align-items:center;gap:var(--sp-2);flex:none}
.bx-ai__label{font-size:var(--fs-caption);font-weight:700;color:var(--mute);white-space:nowrap}
.bx-switch{position:relative;width:40px;height:23px;flex:none;cursor:pointer}
.bx-switch input{position:absolute;opacity:0;width:0;height:0}
.bx-switch__track{position:absolute;inset:0;background:var(--line-2);border-radius:var(--r-pill);transition:background var(--dur) var(--ease)}
.bx-switch input:checked + .bx-switch__track{background:var(--brand-whatsapp)}
.bx-switch input:focus-visible + .bx-switch__track{box-shadow:var(--focus)}
.bx-switch__thumb{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease);pointer-events:none;box-shadow:var(--shadow-xs)}
.bx-switch input:checked ~ .bx-switch__thumb{transform:translateX(17px)}

.bx-dossier-btn{display:none;flex:none;width:36px;height:36px;border:1px solid var(--line-2);background:var(--bone);border-radius:50%;cursor:pointer;color:var(--ink);align-items:center;justify-content:center}
.bx-dossier-btn:hover{background:var(--paper-2)}

/* ─── Mensajes ─── */
.bx-msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--sp-6) var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-2)}

.bx-day{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-4) 0 var(--sp-3)}
.bx-day::before,.bx-day::after{content:"";flex:1;height:1px;background:var(--line)}
.bx-day span{font-size:var(--fs-caption);font-weight:700;color:var(--mute);white-space:nowrap}

.bx-row{display:flex;flex-direction:column;max-width:70%}
.bx-row.lead{align-self:flex-start;align-items:flex-start}
.bx-row.ai,.bx-row.agent{align-self:flex-end;align-items:flex-end}

.bx-bub{padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);line-height:var(--lh);white-space:pre-wrap;word-break:break-word}
.bx-row.lead .bx-bub{
  background:var(--bone);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r) var(--r) var(--r) var(--r-xs);
}
.bx-row.ai .bx-bub{
  background:var(--sky-canvas);border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--r) var(--r) var(--r-xs) var(--r);
}
.bx-row.agent .bx-bub{
  background:var(--sky-blue);border:1px solid var(--sky-blue);color:#fff;
  border-radius:var(--r) var(--r) var(--r-xs) var(--r);
}
.bx-meta{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-1) var(--sp-1) 0;font-size:var(--fs-caption);color:var(--mute);font-variant-numeric:tabular-nums}
.bx-meta b{color:var(--sky-blue);font-weight:700}

/* ─── Composer ─── */
.bx-strip{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-6);
  font-size:var(--fs-caption);line-height:var(--lh-snug);color:var(--mute);
  background:var(--paper-2);border-top:1px solid var(--line);
}
.bx-strip i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--brand-whatsapp)}
.bx-strip.is-manual i{background:var(--sky-blue)}

.bx-composer{
  display:flex;gap:var(--sp-3);align-items:flex-end;
  padding:var(--sp-3) var(--sp-6);
  border-top:1px solid var(--line);background:var(--bone);
}
.bx-composer textarea{
  flex:1;resize:none;min-height:var(--h);max-height:132px;
  padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--line-2);border-radius:var(--r);
  font-family:var(--font-sans);font-size:var(--fs-sm);line-height:var(--lh);
  background:var(--paper);color:var(--ink);
}
.bx-composer textarea:focus{outline:none;border-color:var(--sky-blue);box-shadow:var(--focus)}
.bx-composer textarea::placeholder{color:var(--mute-2)}
.bx-send{
  flex:none;width:var(--h);height:var(--h);border-radius:50%;
  border:1px solid var(--sky-blue);background:var(--sky-blue);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.bx-send:hover{background:var(--sky-blue-press)}
.bx-send:active{transform:scale(.94)}
.bx-send:disabled{opacity:.4;cursor:default;transform:none}

/* ═══════════ CARRIL 3 · EXPEDIENTE ═══════════ */
.bx-dossier{
  width:300px;flex:none;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bone);border-left:1px solid var(--line);
  padding:var(--sp-5);
}
.bx-dossier__eyebrow{font-size:var(--fs-label-3);font-weight:700;color:var(--mute);margin:0 0 var(--sp-3)}

.bx-score{
  position:relative;overflow:hidden;
  background:linear-gradient(148deg, var(--sky-navy) 0%, var(--sky-navy-mid) 100%);
  border-radius:var(--r);padding:var(--sp-5);
  display:flex;align-items:center;gap:var(--sp-4);
}
.bx-score__ring{position:relative;width:76px;height:76px;flex:none}
.bx-score__ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.bx-score__val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:var(--fs-h3);font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.bx-score__side{min-width:0}
.bx-score__side p{margin:0;font-size:var(--fs-caption);color:rgba(255,255,255,.62);line-height:var(--lh-snug)}
.bx-temp{display:inline-block;margin-bottom:var(--sp-2);font-size:var(--fs-caption);font-weight:700;padding:3px var(--sp-2);border-radius:var(--r-pill)}
.bx-temp--caliente{background:var(--warn-soft);color:var(--warn)}
.bx-temp--tibio{background:rgba(255,255,255,.12);color:var(--sky-blue-on-dark)}
.bx-temp--frio,.bx-temp--nuevo{background:rgba(255,255,255,.12);color:rgba(255,255,255,.82)}

.bx-facts{margin-top:var(--sp-5);display:flex;flex-direction:column}
.bx-fact{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--line)}
.bx-fact:last-child{border-bottom:0}
.bx-fact dt{font-size:var(--fs-caption);color:var(--mute);flex:none}
.bx-fact dd{margin:0;font-size:var(--fs-xs);font-weight:700;color:var(--ink);text-align:right;line-height:var(--lh-snug)}

.bx-resumen{margin-top:var(--sp-5);padding:var(--sp-4);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm)}
.bx-resumen h3{font-size:var(--fs-label-3);font-weight:700;color:var(--mute);margin:0 0 var(--sp-2)}
.bx-resumen p{font-size:var(--fs-xs);line-height:var(--lh-loose);color:var(--ink-2);margin:0}
.bx-dossier__empty{font-size:var(--fs-xs);color:var(--mute);line-height:var(--lh);margin:var(--sp-4) 0 0}

/* ═══════════ RESPONSIVE ═══════════ */
/* Bajo 1360px el expediente se vuelve un panel que se abre: mejor eso que
   un hilo estrangulado a 390px. */
@media (max-width:1360px){
  .bx-dossier-btn{display:flex}
  .bx-dossier{
    position:absolute;top:0;right:0;bottom:0;z-index:var(--z-popover);
    width:300px;box-shadow:var(--shadow-lg);
    transform:translateX(100%);transition:transform var(--dur) var(--ease);
  }
  .bx.dossier-open .bx-dossier{transform:none}
  .bx{position:relative}
}
/* ≤880px: lista y conversación se apilan */
@media (max-width:880px){
  .bx-list{width:100%;border-right:0}
  .bx-thread{display:none}
  .bx.thread-open .bx-list{display:none}
  .bx.thread-open .bx-thread{display:flex}
  .bx-back{display:flex}
  .bx-msgs{padding:var(--sp-4)}
  .bx-strip{padding:var(--sp-2) var(--sp-4)}
  .bx-composer{padding:var(--sp-3) var(--sp-4) calc(var(--sp-3) + 74px + env(safe-area-inset-bottom, 0px))}
  .bx-dossier{width:min(300px, 88vw)}
  .bx-row{max-width:82%}
}
@media (max-width:480px){
  .bx-th-head > .bx-ava{display:none}
  .bx-ai__label{display:none}
  .bx-th-head{gap:var(--sp-2);padding:var(--sp-3) var(--sp-4)}
}
</style>
</head>
<body data-app="bandeja">

<div class="bx" id="bx">

  <!-- ═══ CARRIL 1 · LISTA ═══ -->
  <aside class="bx-list">
    <div class="bx-list__head">
      <div class="bx-list__title">
        <h1>Bandeja</h1>
        <span class="bx-count" id="bxCount"></span>
      </div>
      <div class="bx-search">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="bxSearch" placeholder="Buscar por nombre o número" autocomplete="off" aria-label="Buscar conversación"/>
      </div>
      <div class="bx-filters" role="tablist">
        <button class="bx-filter is-active" role="tab" data-f="todos" onclick="setFiltro('todos')">Todos</button>
        <button class="bx-filter" role="tab" data-f="calientes" onclick="setFiltro('calientes')">Calientes</button>
        <button class="bx-filter" role="tab" data-f="mios" onclick="setFiltro('mios')">Tú al control</button>
      </div>
    </div>
    <div class="bx-convs" id="convs">
      <div class="bx-list__empty"><p>Cargando…</p></div>
    </div>
  </aside>

  <!-- ═══ CARRIL 2 · CONVERSACIÓN ═══ -->
  <section class="bx-thread">

    <div class="bx-blank" id="threadEmpty">
      <div class="bx-blank__icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10.5h8M8 14h5M21 12a9 9 0 01-9 9c-1.6 0-3.1-.42-4.4-1.15L3 21l1.2-4.4A8.96 8.96 0 013 12a9 9 0 1118 0z"/></svg>
      </div>
      <h2>Elige una conversación</h2>
      <p>Aquí ves el chat completo y, a la derecha, lo que Recepción ya averiguó del prospecto.</p>
    </div>

    <div class="bx-thread__inner" id="threadInner" hidden>
      <div class="bx-th-head">
        <button class="bx-back" onclick="closeThread()" aria-label="Volver a la lista">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="bx-ava" id="thAva">?</div>
        <div class="bx-th-id">
          <h2 id="thName"></h2>
          <span id="thPhone"></span>
        </div>
        <div class="bx-ai">
          <span class="bx-ai__label" id="aiLabel">Recepción</span>
          <label class="bx-switch" aria-label="Recepción automática en este chat">
            <input type="checkbox" id="aiToggle" onchange="toggleAI()"/>
            <span class="bx-switch__track"></span>
            <span class="bx-switch__thumb"></span>
          </label>
        </div>
        <button class="bx-dossier-btn" onclick="toggleDossier()" aria-label="Ver expediente del prospecto">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.1a7.5 7.5 0 0115 0A17.9 17.9 0 0112 21.75c-2.68 0-5.22-.58-7.5-1.63z"/></svg>
        </button>
      </div>

      <div class="bx-msgs" id="msgs"></div>

      <div class="bx-strip" id="aiStrip"><i></i><span id="aiHint"></span></div>

      <div class="bx-composer">
        <textarea id="composer" placeholder="Escribe un mensaje…" rows="1" oninput="growBox(this)" aria-label="Mensaje"></textarea>
        <button class="bx-send" id="sendBtn" onclick="sendMsg()" aria-label="Enviar mensaje">
          <svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.27 3.13A59.77 59.77 0 0121.49 12 59.77 59.77 0 013.27 20.88L6 12zm0 0h7.5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ═══ CARRIL 3 · EXPEDIENTE ═══ -->
  <aside class="bx-dossier" id="dossier">
    <p class="bx-dossier__eyebrow">Expediente del prospecto</p>
    <div id="dossierBody">
      <p class="bx-dossier__empty">Selecciona una conversación para ver qué averiguó Recepción.</p>
    </div>
  </aside>

</div>

<script src="app-shell.js" defer></script>
<script>
/* ── Espera a que app-shell.js exponga window.brokrSb ── */
function _sb(){ if(!window.brokrSb) throw new Error('La app aún carga, intenta en un segundo.'); return window.brokrSb; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function ready(){ for(let i=0;i<40 && !window.brokrSb;i++) await wait(150); }

let CONVS   = [];
let PREVIEW = {};      // conversation_id -> { body, sender }
let ACTIVE  = null;
let FILTRO  = 'todos';
let BUSCA   = '';
let pollTimer = null;
let _sigConvs = '';    // firma para no repintar la lista sin cambios
let _sigMsgs  = '';

/* ── Utilidades ── */
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inicial(n){ return (n||'?').trim().charAt(0).toUpperCase() || '?'; }

function timeAgo(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s<60) return 'ahora';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  if(s<604800) return Math.floor(s/86400)+' d';
  return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}
function hora(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function diaEtiqueta(iso){
  const d = new Date(iso);
  const hoy = new Date(); const ayer = new Date(Date.now()-86400000);
  const mismo = (a,b)=> a.toDateString()===b.toDateString();
  if(mismo(d,hoy))  return 'Hoy';
  if(mismo(d,ayer)) return 'Ayer';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'long'});
}
function fmtTel(raw){
  const d = String(raw||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length===12 && d.startsWith('52')) return '+52 '+d.slice(2,5)+' '+d.slice(5,8)+' '+d.slice(8);
  if(d.length===13 && d.startsWith('521')) return '+52 '+d.slice(3,6)+' '+d.slice(6,9)+' '+d.slice(9);
  return '+'+d;
}
function esCaliente(ct){ return (ct.temperatura||'') === 'Caliente'; }

/* ── Cargar conversaciones (con su contacto embebido) ── */
async function cargarConvs(){
  const r = await _sb().fetch('rest/v1/wa_conversations?select=*,wa_contacts(*)&order=last_message_at.desc.nullslast');
  if(!r.ok){
    document.getElementById('convs').innerHTML = '<div class="bx-list__empty"><p>No se pudo cargar la bandeja ('+r.status+').</p></div>';
    return;
  }
  CONVS = await r.json();
  renderConvs();
}

/* ── Último mensaje de cada conversación, para la vista previa ── */
async function cargarPreviews(){
  try{
    const r = await _sb().fetch('rest/v1/wa_messages?select=conversation_id,body,sender,created_at&order=created_at.desc&limit=300');
    if(!r.ok) return;
    const rows = await r.json();
    const map = {};
    for(const m of rows){ if(!map[m.conversation_id]) map[m.conversation_id] = m; }
    PREVIEW = map;
  }catch(e){ /* sin vista previa: la lista cae al campo "busca" */ }
}

/* ── Filtro + búsqueda ── */
function setFiltro(f){
  FILTRO = f;
  document.querySelectorAll('.bx-filter').forEach(b => b.classList.toggle('is-active', b.dataset.f === f));
  renderConvs(true);
}
function visibles(){
  return CONVS.filter(c => {
    const ct = c.wa_contacts || {};
    if(FILTRO === 'calientes' && !esCaliente(ct)) return false;
    if(FILTRO === 'mios' && c.ai_enabled) return false;
    if(BUSCA){
      const heno = ((ct.nombre||'') + ' ' + (ct.wa_id||'') + ' ' + (ct.busca||'')).toLowerCase();
      if(!heno.includes(BUSCA)) return false;
    }
    return true;
  });
}

function renderConvs(force){
  const lista = visibles();
  const sig = FILTRO + '|' + BUSCA + '|' + (ACTIVE ? ACTIVE.id : '') + '|' +
    lista.map(c => c.id + (c.last_message_at||'') + c.ai_enabled + ((c.wa_contacts||{}).temperatura||'') + ((PREVIEW[c.id]||{}).body||'').slice(0,20)).join(',');
  if(!force && sig === _sigConvs) return;
  _sigConvs = sig;

  document.getElementById('bxCount').textContent = CONVS.length ? CONVS.length + (CONVS.length===1 ? ' conversación' : ' conversaciones') : '';

  const box = document.getElementById('convs');

  if(!CONVS.length){
    box.innerHTML = '<div class="bx-list__empty"><p>Aún no llega ningún mensaje. En cuanto un prospecto te escriba por WhatsApp, la conversación aparece aquí.</p><a class="bx-cta" href="whatsapp.html">Revisar WhatsApp</a></div>';
    return;
  }
  if(!lista.length){
    box.innerHTML = '<div class="bx-list__empty"><p>Ninguna conversación coincide con lo que buscas.</p></div>';
    return;
  }

  box.innerHTML = lista.map(c => {
    const ct     = c.wa_contacts || {};
    const nombre = ct.nombre || fmtTel(ct.wa_id) || 'Prospecto';
    const pv     = PREVIEW[c.id];
    let prev = '';
    if(pv && pv.body){
      const quien = pv.sender === 'lead' ? '' : (pv.sender === 'ai' ? '<b>Recepción:</b> ' : '<b>Tú:</b> ');
      prev = quien + esc(pv.body.replace(/\s+/g,' ').slice(0,70));
    } else if(ct.busca){
      prev = esc(ct.busca.slice(0,70));
    }
    const tags = [];
    if(esCaliente(ct))  tags.push('<span class="bx-tag bx-tag--hot">Caliente</span>');
    if(!c.ai_enabled)   tags.push('<span class="bx-tag bx-tag--mine">Tú al control</span>');

    return `<button type="button" class="bx-conv ${ACTIVE && ACTIVE.id === c.id ? 'is-active' : ''}" onclick="abrir('${c.id}')">
      <span class="bx-ava">${esc(inicial(nombre))}</span>
      <span class="bx-conv__main">
        <span class="bx-conv__top">
          <span class="bx-conv__name">${esc(nombre)}</span>
          <span class="bx-conv__time">${timeAgo(c.last_message_at)}</span>
        </span>
        <span class="bx-conv__prev">${prev}</span>
        ${tags.length ? '<span class="bx-conv__tags">'+tags.join('')+'</span>' : ''}
      </span>
    </button>`;
  }).join('');
}

/* ── Abrir una conversación ── */
async function abrir(id){
  ACTIVE = CONVS.find(c => c.id === id);
  if(!ACTIVE) return;
  _sigMsgs = '';
  document.getElementById('bx').classList.add('thread-open');
  document.getElementById('threadEmpty').hidden = true;
  document.getElementById('threadInner').hidden = false;

  const ct = ACTIVE.wa_contacts || {};
  const nombre = ct.nombre || fmtTel(ct.wa_id) || 'Prospecto';
  document.getElementById('thAva').textContent   = inicial(nombre);
  document.getElementById('thName').textContent  = nombre;
  document.getElementById('thPhone').textContent = fmtTel(ct.wa_id);
  document.getElementById('aiToggle').checked    = !!ACTIVE.ai_enabled;

  pintarAi();
  pintarDossier(ct);
  renderConvs(true);
  await cargarMsgs();
}

function pintarAi(){
  const on = document.getElementById('aiToggle').checked;
  document.getElementById('aiLabel').textContent = on ? 'Recepción' : 'Tú al control';
  document.getElementById('aiStrip').classList.toggle('is-manual', !on);
  document.getElementById('aiHint').textContent = on
    ? 'Recepción está contestando este chat. Si escribes, tomas el control y la IA se apaga.'
    : 'Tú llevas este chat. Prende el switch para que Recepción vuelva a contestar.';
}

/* ── Expediente ── */
function toggleDossier(){ document.getElementById('bx').classList.toggle('dossier-open'); }

function pintarDossier(ct){
  const body = document.getElementById('dossierBody');
  // El esquema trae `score int default 0`: un 0 significa "Recepción todavía no
  // lo califica", no "vale cero". Se pinta como guion, nunca como cero grande.
  const score = (typeof ct.score === 'number' && ct.score > 0) ? ct.score : null;
  const temp  = ct.temperatura || 'Nuevo';
  const tempCls = { 'Caliente':'caliente', 'Tibio':'tibio', 'Frío':'frio', 'Nuevo':'nuevo' }[temp] || 'nuevo';

  const C = 2 * Math.PI * 33;                      // circunferencia del anillo (r=33)
  const dash = score === null ? 0 : C * Math.max(0, Math.min(100, score)) / 100;

  const ring = `<div class="bx-score__ring">
      <svg viewBox="0 0 76 76" aria-hidden="true">
        <circle cx="38" cy="38" r="33" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="6"/>
        <circle cx="38" cy="38" r="33" fill="none" stroke="var(--sky-blue-on-dark)" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>
      </svg>
      <span class="bx-score__val">${score === null ? '—' : score}</span>
    </div>`;

  const facts = [];
  if(ct.presupuesto)  facts.push(['Presupuesto', esc(ct.presupuesto)]);
  if(ct.forma_pago)   facts.push(['Forma de pago', esc(ct.forma_pago)]);
  if(ct.etapa)        facts.push(['Etapa', esc(ct.etapa)]);
  if(ct.busca)        facts.push(['Busca', esc(ct.busca)]);
  if(ACTIVE && ACTIVE.property_ctx) facts.push(['Llegó por', esc(ACTIVE.property_ctx)]);

  body.innerHTML = `
    <div class="bx-score">
      ${ring}
      <div class="bx-score__side">
        <span class="bx-temp bx-temp--${tempCls}">${esc(temp)}</span>
        <p>${score === null ? 'Recepción aún no califica a este prospecto.' : 'Score de calificación sobre 100.'}</p>
      </div>
    </div>
    ${facts.length ? '<dl class="bx-facts">' + facts.map(f => `<div class="bx-fact"><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('') + '</dl>'
                   : '<p class="bx-dossier__empty">Recepción todavía no reúne datos de este prospecto. Aparecerán aquí conforme avance la plática.</p>'}
    ${ct.resumen ? `<div class="bx-resumen"><h3>Resumen</h3><p>${esc(ct.resumen)}</p></div>` : ''}
  `;
}

/* ── Mensajes ── */
async function cargarMsgs(){
  if(!ACTIVE) return;
  const r = await _sb().fetch('rest/v1/wa_messages?conversation_id=eq.'+ACTIVE.id+'&select=*&order=created_at.asc&limit=200');
  if(!r.ok) return;
  const msgs = await r.json();

  const sig = ACTIVE.id + '|' + msgs.length + '|' + (msgs.length ? msgs[msgs.length-1].id : '');
  if(sig === _sigMsgs) return;
  _sigMsgs = sig;

  const box = document.getElementById('msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  let html = '';
  let ultimoDia = '';
  for(const m of msgs){
    const dia = m.created_at ? diaEtiqueta(m.created_at) : '';
    if(dia && dia !== ultimoDia){
      html += `<div class="bx-day"><span>${dia}</span></div>`;
      ultimoDia = dia;
    }
    const quien = m.sender === 'ai' ? '<b>Recepción</b>' : (m.sender === 'agent' ? '<b>Tú</b>' : '');
    html += `<div class="bx-row ${esc(m.sender)}">
      <div class="bx-bub">${esc(m.body)}</div>
      <div class="bx-meta">${quien}<span>${hora(m.created_at)}</span></div>
    </div>`;
  }
  box.innerHTML = html || '<div class="bx-list__empty"><p>Todavía no hay mensajes en este chat.</p></div>';
  if(nearBottom) box.scrollTop = box.scrollHeight;
}

/* ── Prender/apagar Recepción en este chat (PATCH a Supabase, RLS) ── */
async function toggleAI(){
  if(!ACTIVE) return;
  const val = document.getElementById('aiToggle').checked;
  pintarAi();
  await _sb().fetch('rest/v1/wa_conversations?id=eq.'+ACTIVE.id, {
    method:'PATCH',
    headers:{'Content-Type':'application/json', Prefer:'return=minimal'},
    body: JSON.stringify({ai_enabled: val})
  });
  ACTIVE.ai_enabled = val;
  renderConvs(true);
}

/* ── Enviar mensaje a mano (pasa por el backend, que tiene el token de WhatsApp) ── */
async function sendMsg(){
  const ta = document.getElementById('composer');
  const body = ta.value.trim();
  if(!body || !ACTIVE) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try{
    const tok = await _sb().ensureToken();
    const r = await fetch(window.API_BASE + '/whatsapp/send', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+tok},
      body: JSON.stringify({ conversation_id: ACTIVE.id, body })
    });
    if(!r.ok){
      // El backend manda en 'detail' el motivo real de Meta ya traducido
      // (nombre visible sin aprobar, ventana de 24h vencida, token caducado...).
      // El texto queda en el composer para poder reintentar sin reescribirlo.
      let motivo = 'No se pudo enviar el mensaje (' + r.status + ').';
      try{ const e = await r.json(); if(e && e.detail) motivo = e.detail; }catch(_){}
      alert(motivo);
      btn.disabled = false;
      return;
    }
    ta.value=''; growBox(ta);
    // al contestar tú, Recepción se apaga (el backend ya lo hizo)
    document.getElementById('aiToggle').checked = false;
    ACTIVE.ai_enabled = false;
    pintarAi();
    _sigMsgs = '';
    await cargarMsgs();
    await cargarPreviews();
    renderConvs(true);
  }catch(e){ alert('Error: '+e.message); }
  btn.disabled = false;
}

function closeThread(){
  document.getElementById('bx').classList.remove('thread-open','dossier-open');
  ACTIVE = null;
  document.getElementById('threadInner').hidden = true;
  document.getElementById('threadEmpty').hidden = false;
  renderConvs(true);
}
function growBox(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,132)+'px'; }

/* Enter envía, Shift+Enter hace salto de línea */
document.getElementById('composer').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMsg(); }
});
document.getElementById('bxSearch').addEventListener('input', e => {
  BUSCA = e.target.value.trim().toLowerCase();
  renderConvs(true);
});

/* ── Polling: refresca lista y, si hay hilo abierto, mensajes ── */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if(document.hidden) return;
    try{
      await cargarConvs();
      await cargarPreviews();
      renderConvs();
      if(ACTIVE) await cargarMsgs();
    }catch(e){}
  }, 6000);
}

(async function init(){
  await ready();
  try{
    await cargarConvs();
    await cargarPreviews();
    renderConvs(true);
    startPolling();
  }catch(e){
    document.getElementById('convs').innerHTML = '<div class="bx-list__empty"><p>'+esc(e.message)+'</p></div>';
  }
})();
</script>
</body>
