<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Bandeja · Broquer</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#05203C"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --sky-navy -->
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
  html, body { background: var(--paper); }

  /* La bandeja vive dentro del .app-content que arma app-shell.js */
  .bandeja { display:flex; height:100vh; min-width:0; }

  /* ── Lista de conversaciones ── */
  .bx-list { width:340px; flex-shrink:0; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--paper); }
  .bx-list-head { padding:20px 20px 14px; border-bottom:1px solid var(--line); }
  .bx-list-head h1 { font-family:var(--font-display); font-size:var(--fs-h2); font-weight:700; letter-spacing:-.02em; color:var(--ink); margin:0; }
  .bx-sub { font-family:var(--font-mono); font-size: var(--fs-label-3); color:var(--mute);  letter-spacing: 0.02em; }
  .bx-convs { flex:1; overflow-y:auto; }
  .bx-conv { display:flex; gap:12px; align-items:center; padding:13px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:background var(--dur) var(--ease); }
  .bx-conv:hover { background:var(--paper-2); }
  .bx-conv.is-active { background:var(--forest-soft); }
  .bx-ava { width:42px; height:42px; border-radius:var(--r-pill); flex-shrink:0; background:var(--shell); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:var(--forest); }
  .bx-conv-main { flex:1; min-width:0; }
  .bx-conv-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .bx-conv-name { font-weight:600; font-size:var(--fs-sm); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bx-conv-time { font-size:var(--fs-caption); color:var(--mute-2); flex-shrink:0; }
  .bx-conv-sub { display:flex; align-items:center; gap:7px; margin-top:3px; }
  .bx-dot-ai { width:7px; height:7px; border-radius:var(--r-pill); background:var(--forest); flex-shrink:0; }
  .bx-dot-off { width:7px; height:7px; border-radius:var(--r-pill); background:var(--mute-3); flex-shrink:0; }
  .bx-conv-sub small { font-size:var(--fs-xs); color:var(--mute); }

  .badge { font-size:var(--fs-caption); font-weight:700; padding:2px 8px; border-radius:var(--r-pill); }
  .t-Caliente { background:var(--success-soft); color:var(--success); }
  .t-Tibio    { background:var(--warn-soft);    color:var(--warn); }
  .t-Frío     { background:var(--paper-2);      color:var(--mute); }
  .t-Nuevo    { background:var(--info-soft);    color:var(--info); }

  /* ── Hilo ── */
  .bx-thread { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--shell); }
  .bx-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--mute-2); font-size:var(--fs-sm); }
  .bx-thread-inner { flex:1; display:flex; flex-direction:column; min-height:0; }
  .bx-thread-head { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--paper); }
  .bx-back { display:none; background:none; border:none; font-size:var(--fs-h2); color:var(--forest); cursor:pointer; padding:0; line-height:1; }
  .bx-th-name { font-family:var(--font-display); font-weight:700; font-size:var(--fs-body); color:var(--ink); flex:1; }
  .bx-ai { display:flex; align-items:center; gap:8px; font-size:var(--fs-xs); color:var(--mute); font-weight:600; }
  .bx-switch { position:relative; display:inline-block; width:38px; height:22px; }
  .bx-switch input { opacity:0; width:0; height:0; }
  .bx-switch span { position:absolute; inset:0; background:var(--mute-3); border-radius:var(--r-pill); transition:var(--dur); cursor:pointer; }
  .bx-switch span:before { content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:var(--dur); }
  .bx-switch input:checked + span { background:var(--forest); }
  .bx-switch input:checked + span:before { transform:translateX(16px); }

  .bx-qual { padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  .bx-qual .q { font-size:var(--fs-xs); color:var(--ink-2); }
  .bx-qual .q b { color:var(--mute); font-weight:500; }
  .bx-qual .resumen { width:100%; font-size:var(--fs-xs); color:var(--mute); font-style:italic; }

  .bx-msgs { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:8px; }
  .bx-bub { max-width:74%; padding:9px 13px; border-radius:var(--r); font-size:var(--fs-sm); line-height:1.45; }
  .bx-bub.lead  { align-self:flex-start; background:var(--bone); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:4px; }
  .bx-bub.ai    { align-self:flex-end; background:var(--forest-soft); color:var(--ink-2); border-bottom-right-radius:4px; }
  .bx-bub.agent { align-self:flex-end; background:var(--forest); color: #fff !important; border-bottom-right-radius:4px; }
  .bx-bub .tag { display:block; font-size:var(--fs-caption); font-weight:700; opacity:.8; margin-bottom:2px; }
  .bx-bub.ai .tag { color:var(--forest); }

  .bx-composer { display:flex; gap:10px; align-items:flex-end; padding:12px 16px; border-top:1px solid var(--line); background:var(--paper); }
  .bx-composer textarea { flex:1; resize:none; border:1px solid var(--line-2); border-radius:var(--r); padding:10px 14px; font-family:var(--font-sans); font-size:var(--fs-sm); max-height:120px; background:var(--bone); color:var(--ink); }
  .bx-composer button { background:var(--forest); color: #fff !important; border:none; border-radius:var(--r-pill); padding:10px 18px; font-weight:700; font-size:var(--fs-sm); cursor:pointer; font-family:var(--font-display); }
  .bx-composer button:disabled { opacity:.5; cursor:default; }
  .bx-hint { font-size:var(--fs-caption); color:var(--mute-2); padding:0 20px 8px; }

  @media (max-width: 880px) {
    .bx-list { width:100%; }
    .bx-thread { display:none; }
    .bandeja.thread-open .bx-list { display:none; }
    .bandeja.thread-open .bx-thread { display:flex; }
    .bx-back { display:block; }
  }
</style>
</head>
<body data-app="bandeja">

<!-- shell-replaced-sidebar -->
<div style="display:none" hidden>
  <aside class="app-sidebar">
    <div class="app-sidebar__brand">Broquer<span class="dot">.</span></div>
    <a class="app-nav-link" href="index.html">Inicio</a>
    <a class="app-nav-link" href="propiedades.html">Inmuebles</a>
    <a class="app-nav-link" href="contactos.html">Contactos</a>
    <a class="app-nav-link is-active" href="bandeja.html">Bandeja</a>
    <a class="app-nav-link" href="contratos.html">Contratos</a>
    <a class="app-nav-link" href="avm.html">AVM</a>
  </aside>
</div>

<div class="bandeja" id="bandeja">
  <aside class="bx-list">
    <div class="bx-list-head">
      <h1>Bandeja</h1>
      <span class="bx-sub">WhatsApp · Recepción</span>
    </div>
    <div class="bx-convs" id="convs">
      <div style="padding:24px;color:var(--mute);font-size:var(--fs-xs)">Cargando…</div>
    </div>
  </aside>

  <section class="bx-thread">
    <div class="bx-empty" id="threadEmpty">Selecciona una conversación para verla</div>
    <div class="bx-thread-inner" id="threadInner" hidden>
      <div class="bx-thread-head">
        <button class="bx-back" onclick="closeThread()" aria-label="Volver">‹</button>
        <div class="bx-th-name" id="thName"></div>
        <div class="bx-ai">
          <span id="aiLabel">IA activa</span>
          <label class="bx-switch"><input type="checkbox" id="aiToggle" onchange="toggleAI()"/><span></span></label>
        </div>
      </div>
      <div class="bx-qual" id="qualCard"></div>
      <div class="bx-msgs" id="msgs"></div>
      <div class="bx-hint" id="aiHint"></div>
      <div class="bx-composer">
        <textarea id="composer" placeholder="Escribe un mensaje…" rows="1" oninput="growBox(this)"></textarea>
        <button id="sendBtn" onclick="sendMsg()">Enviar</button>
      </div>
    </div>
  </section>
</div>

<script src="app-shell.js" defer></script>
<script>
/* ── Espera a que app-shell.js exponga window.brokrSb ── */
function _sb(){ if(!window.brokrSb) throw new Error('La app aún carga, intenta en un segundo.'); return window.brokrSb; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function ready(){ for(let i=0;i<40 && !window.brokrSb;i++) await wait(150); }

let CONVS = [];
let ACTIVE = null;       // conversación abierta
let pollTimer = null;

function timeAgo(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s<60) return 'ahora';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inicial(n){ return (n||'?').trim().charAt(0).toUpperCase(); }

/* ── Cargar lista de conversaciones (con su contacto embebido) ── */
async function cargarConvs(){
  const r = await _sb().fetch('rest/v1/wa_conversations?select=*,wa_contacts(*)&order=last_message_at.desc.nullslast');
  if(!r.ok){ document.getElementById('convs').innerHTML = '<div style="padding:24px;color:var(--danger);font-size:var(--fs-xs)">No se pudo cargar ('+r.status+')</div>'; return; }
  CONVS = await r.json();
  renderConvs();
}

function renderConvs(){
  const box = document.getElementById('convs');
  if(!CONVS.length){ box.innerHTML = '<div style="padding:24px;color:var(--mute);font-size:var(--fs-xs)">Aún no hay conversaciones. En cuanto te escriba un lead por WhatsApp, aparece aquí.</div>'; return; }
  box.innerHTML = CONVS.map(c=>{
    const ct = c.wa_contacts || {};
    const nombre = ct.nombre || ct.wa_id || 'Prospecto';
    const temp = ct.temperatura || 'Nuevo';
    const dot = c.ai_enabled ? '<span class="bx-dot-ai" title="IA activa"></span>' : '<span class="bx-dot-off" title="Tú llevas el control"></span>';
    return `<div class="bx-conv ${ACTIVE&&ACTIVE.id===c.id?'is-active':''}" onclick="abrir('${c.id}')">
      <div class="bx-ava">${inicial(nombre)}</div>
      <div class="bx-conv-main">
        <div class="bx-conv-top">
          <span class="bx-conv-name">${esc(nombre)}</span>
          <span class="bx-conv-time">${timeAgo(c.last_message_at)}</span>
        </div>
        <div class="bx-conv-sub">${dot}<span class="badge t-${temp}">${temp}</span><small>${esc((ct.busca||'').slice(0,30))}</small></div>
      </div>
    </div>`;
  }).join('');
}

/* ── Abrir una conversación ── */
async function abrir(id){
  ACTIVE = CONVS.find(c=>c.id===id);
  if(!ACTIVE) return;
  document.getElementById('bandeja').classList.add('thread-open');
  document.getElementById('threadEmpty').hidden = true;
  document.getElementById('threadInner').hidden = false;
  renderConvs();

  const ct = ACTIVE.wa_contacts || {};
  document.getElementById('thName').textContent = ct.nombre || ct.wa_id || 'Prospecto';
  document.getElementById('aiToggle').checked = !!ACTIVE.ai_enabled;
  pintarAi();
  pintarQual(ct);
  await cargarMsgs();
}

function pintarAi(){
  const on = document.getElementById('aiToggle').checked;
  document.getElementById('aiLabel').textContent = on ? 'IA activa' : 'Tú al control';
  document.getElementById('aiHint').textContent = on
    ? 'Recepción contesta sola. Si escribes un mensaje, tomas el control y la IA se apaga.'
    : 'Tú llevas esta conversación. Prende el switch para que la IA vuelva a contestar.';
}

function pintarQual(ct){
  const f = [];
  if(ct.presupuesto) f.push(`<span class="q"><b>Presupuesto:</b> ${esc(ct.presupuesto)}</span>`);
  if(ct.forma_pago)  f.push(`<span class="q"><b>Pago:</b> ${esc(ct.forma_pago)}</span>`);
  if(ct.etapa)       f.push(`<span class="q"><b>Etapa:</b> ${esc(ct.etapa)}</span>`);
  if(typeof ct.score==='number') f.push(`<span class="q"><b>Score:</b> ${ct.score}</span>`);
  if(ct.resumen)     f.push(`<span class="resumen">“${esc(ct.resumen)}”</span>`);
  document.getElementById('qualCard').innerHTML = f.join('') || '<span class="q" style="color:var(--mute-2)">Sin calificar todavía</span>';
}

async function cargarMsgs(){
  if(!ACTIVE) return;
  const r = await _sb().fetch('rest/v1/wa_messages?conversation_id=eq.'+ACTIVE.id+'&select=*&order=created_at.asc&limit=200');
  if(!r.ok) return;
  const msgs = await r.json();
  const box = document.getElementById('msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = msgs.map(m=>{
    const tag = m.sender==='ai' ? '<span class="tag">Recepción · IA</span>' : (m.sender==='agent' ? '' : '');
    return `<div class="bx-bub ${m.sender}">${tag}${esc(m.body)}</div>`;
  }).join('');
  if(nearBottom) box.scrollTop = box.scrollHeight;
}

/* ── Prender/apagar la IA (PATCH directo a Supabase, RLS) ── */
async function toggleAI(){
  if(!ACTIVE) return;
  const val = document.getElementById('aiToggle').checked;
  pintarAi();
  await _sb().fetch('rest/v1/wa_conversations?id=eq.'+ACTIVE.id, {
    method:'PATCH',
    headers:{'Content-Type':'application/json', Prefer:'return=minimal'},
    body: JSON.stringify({ai_enabled: val})
  });
  ACTIVE.ai_enabled = val;
  renderConvs();
}

/* ── Enviar mensaje a mano (pasa por el backend, que tiene el token de WhatsApp) ── */
async function sendMsg(){
  const ta = document.getElementById('composer');
  const body = ta.value.trim();
  if(!body || !ACTIVE) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const tok = await _sb().ensureToken();
    const r = await fetch(window.API_BASE + '/whatsapp/send', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+tok},
      body: JSON.stringify({ conversation_id: ACTIVE.id, body })
    });
    if(!r.ok){ alert('No se pudo enviar ('+r.status+')'); btn.disabled=false; return; }
    ta.value=''; growBox(ta);
    // al contestar tú, la IA se apaga (el backend ya lo hizo)
    document.getElementById('aiToggle').checked = false; ACTIVE.ai_enabled=false; pintarAi();
    await cargarMsgs(); renderConvs();
  } catch(e){ alert('Error: '+e.message); }
  btn.disabled = false;
}

function closeThread(){ document.getElementById('bandeja').classList.remove('thread-open'); ACTIVE=null; renderConvs(); }
function growBox(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

/* ── Polling: refresca lista y, si hay hilo abierto, mensajes ── */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try { await cargarConvs(); if(ACTIVE) await cargarMsgs(); } catch{}
  }, 6000);
}

(async function init(){
  await ready();
  try { await cargarConvs(); startPolling(); }
  catch(e){ document.getElementById('convs').innerHTML = '<div style="padding:24px;color:var(--danger);font-size:var(--fs-xs)">'+e.message+'</div>'; }
})();
</script>
</body>
</html>
