workflows:
  ios-capacitor:
    name: Broquer iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - code_signing
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6775727897
        APP_VERSION: "1.5"
      node: 22
      xcode: latest
    integrations:
      app_store_connect: "Broquer 1"
    scripts:
      - name: Instalar dependencias web (raíz del repo)
        script: |
          true
      - name: Sync de assets web a ios-app/www
        script: |
          cd $CM_BUILD_DIR
          bash ios-app/sync-web.sh
      - name: Instalar dependencias Node de Capacitor
        script: |
          cd $CM_BUILD_DIR/ios-app
          npm install --no-audit --no-fund
      - name: Capacitor sync iOS
        script: |
          cd $CM_BUILD_DIR/ios-app
          npx cap sync ios
      - name: Generar master icon/splash desde isotipo
        script: |
          pip3 install --quiet pillow
          python3 $CM_BUILD_DIR/ios-app/gen-master-assets.py
      - name: Generar iconos y splash iOS (capacitor-assets)
        script: |
          cd $CM_BUILD_DIR/ios-app
          npx capacitor-assets generate --ios \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF" \
            --splashBackgroundColor "#FFFFFF" \
            --splashBackgroundColorDark "#FFFFFF"
      - name: Quitar alpha de los iconos y verificar el de 1024
        script: |
          # capacitor-assets guarda los PNG en RGBA. Apple RECHAZA el icono de
          # 1024 si trae canal de transparencia (ITMS-90717), aunque sea 100%
          # opaco. Aquí se aplanan todos contra blanco, por si acaso.
          python3 - <<'EOF'
          from PIL import Image
          from pathlib import Path
          import os, sys
          d = Path(os.environ["CM_BUILD_DIR"]) / "ios-app/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          for f in sorted(d.glob("*.png")):
              im = Image.open(f)
              if im.mode != "RGB":
                  bg = Image.new("RGB", im.size, (255, 255, 255))
                  im = im.convert("RGBA")
                  bg.paste(im, (0, 0), im)
                  bg.save(f, "PNG", optimize=True)
                  print(f"  aplanado: {f.name}")
          ico = d / "1024.png"
          if not ico.exists():
              sys.exit("✖ FALTA 1024.png — el icono del App Store no se generó.")
          im = Image.open(ico)
          if im.mode != "RGB" or im.size != (1024, 1024):
              sys.exit(f"✖ 1024.png inválido: {im.size} {im.mode} (se necesita 1024x1024 RGB)")
          print(f"✔ Icono App Store OK: {im.size} {im.mode}, sin alpha")
          EOF
      - name: Debug — verificar acceso a la API de Apple
        script: |
          echo "=== Certificados existentes ==="
          app-store-connect list-certificates || echo "ERROR listing certificates"
          echo ""
          echo "=== Bundle IDs registrados ==="
          app-store-connect list-bundle-ids || echo "ERROR listing bundle IDs"
          echo ""
          echo "=== Provisioning profiles ==="
          app-store-connect list-profiles || echo "ERROR listing profiles"
      - name: Crear / fetch certificado y provisioning profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.broquer.app \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios-app/ios/App/App.xcodeproj"
      - name: Setear versión de marketing y build number
        script: |
          cd $CM_BUILD_DIR/ios-app/ios/App
          # Versión de marketing (CFBundleShortVersionString) desde la variable APP_VERSION
          agvtool new-marketing-version "$APP_VERSION"
          # Leer la respuesta de App Store Connect (puede traer texto + el número)
          RAW=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>&1 || true)
          echo "Respuesta cruda de App Store Connect:"
          echo "$RAW"
          # Quedarnos SOLO con la última línea que sea puramente un número
          LATEST=$(printf '%s\n' "$RAW" | grep -E '^[0-9]+$' | tail -1)
          # Si no salió un número limpio, usar el contador interno de Codemagic como respaldo
          if ! echo "$LATEST" | grep -qE '^[0-9]+$'; then
            echo "No se pudo leer el build number desde App Store Connect; usando el contador de Codemagic ($BUILD_NUMBER) como base."
            LATEST=$BUILD_NUMBER
          fi
          NEXT=$((LATEST + 1))
          # Seguro extra: nunca quedar por debajo del contador de Codemagic
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then
            NEXT=$BUILD_NUMBER
          fi
          echo "Marketing version: $APP_VERSION | Build más alto detectado: $LATEST -> usando build number $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR/ios-app/ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --no-show-build-settings \
            --archive-flags="-skipPackagePluginValidation -skipMacroValidation" \
            --disable-xcpretty
    artifacts:
      - ios-app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - salvadorbolanosnavarro@gmail.com
        notify:
          success: true
          failure: true
