<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Conectando WhatsApp…</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FFFFFF;margin:0;color:#2E3338}
.box{text-align:center;padding:32px}
.spinner{width:36px;height:36px;border:3px solid #EFF3F8;border-top-color:#25d366;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;color:#6B7585}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p>Completando conexión con WhatsApp…</p>
</div>
<script>
// Meta redirige aquí con ?code=... después del Embedded Signup
const params = new URLSearchParams(location.search);
const code   = params.get('code');
if(code && window.opener){
  window.opener.postMessage({ type:'wa_code', code }, location.origin);
  window.close();
} else {
  document.querySelector('p').textContent = 'No se recibió autorización. Puedes cerrar esta ventana.';
}
</script>
</body>
</html>
