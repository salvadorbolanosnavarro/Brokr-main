<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Broquer — Restablecer contraseña</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#081C4E"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --sky-navy -->
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
html, body { min-height: 100%; background: var(--paper); }
body {
  margin: 0;
  overflow-y: auto;
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

.bk-auth {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--sp-7) var(--sp-4);
  background:
    radial-gradient(circle at 50% 0%, var(--sky-canvas), transparent 36rem),
    var(--paper);
}
.bk-form {
  width: min(100%, 460px);
  padding: var(--sp-8);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line-2);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-md);
}
.bk-form__brand {
  display: flex;
  justify-content: center;
  margin-bottom: var(--sp-6);
}
.bk-form__brand img { height: var(--h); width: auto; display: block; }
.bk-auth-kicker {
  width: max-content;
  margin: 0 auto var(--sp-3);
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-pill);
  background: var(--sky-canvas);
  color: var(--sky-blue);
  font-size: var(--fs-xs);
  font-weight: 800;
}
.bk-form__hed {
  margin: 0 0 var(--sp-2);
  font-family: var(--font-display);
  font-size: var(--fs-h2);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: var(--lh-h2);
  color: var(--ink);
  text-align: center;
}
.bk-form__sub {
  margin: 0 0 var(--sp-6);
  font-size: var(--fs-sm);
  color: var(--mute);
  text-align: center;
  line-height: var(--lh);
}
.bk-field { margin-bottom: var(--sp-4); }
.bk-field label {
  display: block;
  margin-bottom: var(--sp-2);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--ink-2);
}
.bk-field .bk-input { width: 100%; }
.bk-submit {
  width: 100%;
  min-height: var(--h);
  margin-top: var(--sp-2);
  border: 0;
  border-radius: var(--r-sm);
  background: var(--sky-blue);
  color: var(--paper);
  font: 700 var(--fs-sm)/1 var(--font-sans);
  cursor: pointer;
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.bk-submit:hover { background: var(--sky-blue-press); box-shadow: var(--shadow-sm); }
.bk-submit:active { transform: translateY(1px); }
.bk-submit:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
.bk-msg {
  display: none;
  margin-bottom: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid transparent;
  border-radius: var(--r);
  font-size: var(--fs-sm);
  line-height: var(--lh-sm);
}
.bk-msg.is-err { display: block; background: var(--danger-soft); color: var(--danger); border-color: var(--danger-soft); }
.bk-msg.is-ok  { display: block; background: var(--success-soft); color: var(--success); border-color: var(--success-soft); }
.bk-back {
  margin-top: var(--sp-5);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--mute);
}
.bk-back a { color: var(--sky-blue); font-weight: 700; text-decoration: none; }
.bk-back a:hover { text-decoration: underline; text-underline-offset: 3px; }
.bk-foot {
  margin-top: var(--sp-7);
  font-size: var(--fs-xs);
  color: var(--mute);
  text-align: center;
}
.bk-spin {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.32);
  border-top-color: var(--paper);
  border-radius: 50%;
  animation: bk-spin .7s linear infinite;
  vertical-align: middle;
}
@keyframes bk-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bk-spin { animation-duration: 1.4s; } }

#splash {
  position: fixed;
  inset: 0;
  z-index: var(--z-toast);
  display: grid;
  place-items: center;
  background: var(--paper);
  transition: opacity var(--dur-slow) var(--ease);
}
#splash .mark { width: min(44vw, 220px); }
#splash .mark img { display: block; width: 100%; height: auto; }
@media (max-width: 600px) {
  .bk-auth { padding: var(--sp-5) var(--sp-4); }
  .bk-form { padding: var(--sp-6) var(--sp-5); border-radius: var(--r-lg); }
}
</style>
</head>
<body>

<div id="splash"><div class="mark"><img src="logotipo-black.png" alt="Broquer"/></div></div>

<div class="bk-auth">
  <div class="bk-form">
    <div class="bk-form__brand">
      <img src="logotipo-black.png" alt="Broquer"/>
    </div>

    <div class="bk-auth-kicker">Seguridad de tu cuenta</div>
    <h2 class="bk-form__hed">Restablece tu contraseña</h2>
    <p class="bk-form__sub" id="form-sub">Ingresa tu nueva contraseña para volver a entrar a Broquer.</p>

    <div class="bk-msg" id="msg"></div>

    <form id="form-reset" onsubmit="event.preventDefault();doReset()">
      <div class="bk-field">
        <label for="r-pass">Nueva contraseña</label>
        <input class="bk-input" type="password" id="r-pass" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
      </div>
      <div class="bk-field">
        <label for="r-pass2">Confirmar contraseña</label>
        <input class="bk-input" type="password" id="r-pass2" placeholder="Repite la contraseña" autocomplete="new-password"/>
      </div>

      <button type="submit" class="bk-submit" id="btn-reset" disabled>Guardar contraseña</button>
    </form>

    <div class="bk-back"><a href="login.html">Volver al inicio de sesión</a></div>

    <div class="bk-foot">Broquer 2026</div>
  </div>
</div>

<script>
const SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
const SB_KEY = 'sb_publishable_EVGLfmHVorBpQQWAh-vypA_hANNk_-i';

const msgEl = document.getElementById('msg');
const btn   = document.getElementById('btn-reset');
const subEl = document.getElementById('form-sub');

let recoveryToken = null;

function showMsg(text, kind){
  msgEl.textContent = text;
  msgEl.className = 'bk-msg ' + (kind === 'ok' ? 'is-ok' : 'is-err');
}
function clearMsg(){ msgEl.textContent = ''; msgEl.className = 'bk-msg'; }

function lockForm(disabled, label){
  btn.disabled = disabled;
  if (label) btn.innerHTML = label;
}

async function verifyTokenHash(token_hash){
  // Flujo nuevo (PKCE): /auth/v1/verify intercambia token_hash por una sesión.
  try {
    const r = await fetch(`${SB_URL}/auth/v1/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
      body: JSON.stringify({ type: 'recovery', token_hash })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.access_token) return d.access_token;
  } catch(_){}
  return null;
}

async function doReset(){
  clearMsg();
  const p1 = document.getElementById('r-pass').value;
  const p2 = document.getElementById('r-pass2').value;
  if (!p1 || !p2) { showMsg('Ingresa tu nueva contraseña dos veces.'); return; }
  if (p1 !== p2)  { showMsg('Las contraseñas no coinciden.'); return; }
  if (p1.length < 8) { showMsg('La contraseña debe tener al menos 8 caracteres.'); return; }
  if (!recoveryToken) { showMsg('El enlace de recuperación es inválido o expiró. Solicita uno nuevo desde el inicio de sesión.'); return; }

  lockForm(true, '<span class="bk-spin"></span>');

  try {
    const r = await fetch(`${SB_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        apikey: SB_KEY,
        Authorization: 'Bearer ' + recoveryToken
      },
      body: JSON.stringify({ password: p1 })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      const raw = (d.msg || d.error_description || d.error || '').toString().toLowerCase();
      if (raw.includes('weak') || raw.includes('password should'))
        showMsg('La contraseña es demasiado débil. Usa al menos 8 caracteres con letras y números.');
      else if (raw.includes('same') || raw.includes('different from the old'))
        showMsg('La nueva contraseña debe ser distinta a la anterior.');
      else if (raw.includes('expired') || raw.includes('invalid'))
        showMsg('El enlace de recuperación expiró. Solicita uno nuevo desde el inicio de sesión.');
      else
        showMsg('No se pudo actualizar la contraseña. Intenta de nuevo o solicita un enlace nuevo.');
      lockForm(false, 'Guardar contraseña');
      return;
    }
  } catch (e) {
    showMsg('Sin conexión. Intenta de nuevo en unos segundos.');
    lockForm(false, 'Guardar contraseña');
    return;
  }

  // Seguridad: al cambiar la contraseña, cerramos TODAS las sesiones abiertas
  // del usuario (web y app) en cualquier dispositivo, no solo esta.
  try {
    await fetch(`${SB_URL}/auth/v1/logout?scope=global`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SB_KEY,
        Authorization: 'Bearer ' + recoveryToken
      }
    });
  } catch(_){}

  // Limpieza: cualquier sesión "recovery" no debe quedar como sesión activa.
  try {
    localStorage.removeItem('sb_token');
    localStorage.removeItem('sb_refresh');
    localStorage.removeItem('sb_user');
    sessionStorage.removeItem('sb_token');
    sessionStorage.removeItem('sb_user');
    localStorage.removeItem('sesion_activa');
  } catch(_){}

  showMsg('Contraseña actualizada. Te llevamos al inicio de sesión…', 'ok');
  setTimeout(() => { location.href = 'login.html?pwd=ok'; }, 1500);
}

// Boot: detectar el token de recuperación en la URL.
(async function boot(){
  // Quitar splash apenas la página esté lista.
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 600); }
  }, 200);

  const urlParams  = new URLSearchParams(location.search);
  const hash       = location.hash || '';
  const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);

  // Errores de Supabase llegan como ?error=... o #error=...
  const err = urlParams.get('error_description') || hashParams.get('error_description')
           || urlParams.get('error')             || hashParams.get('error');
  if (err) {
    subEl.textContent = 'El enlace de recuperación es inválido o expiró.';
    showMsg(decodeURIComponent(err).replace(/\+/g,' '));
    return;
  }

  // Flujo implícito: #access_token=...&type=recovery
  const hashAccess = hashParams.get('access_token');
  const hashType   = hashParams.get('type');
  if (hashAccess && (hashType === 'recovery' || !hashType)) {
    recoveryToken = hashAccess;
    history.replaceState(null, '', location.pathname);
    lockForm(false, 'Guardar contraseña');
    return;
  }

  // Flujo moderno: ?token_hash=...&type=recovery
  const tokenHash = urlParams.get('token_hash');
  const qType     = urlParams.get('type');
  if (tokenHash && (qType === 'recovery' || !qType)) {
    lockForm(true, '<span class="bk-spin"></span> Validando enlace…');
    const tok = await verifyTokenHash(tokenHash);
    if (tok) {
      recoveryToken = tok;
      history.replaceState(null, '', location.pathname);
      lockForm(false, 'Guardar contraseña');
      return;
    }
    subEl.textContent = 'El enlace de recuperación es inválido o expiró.';
    showMsg('Solicita un enlace nuevo desde el inicio de sesión.');
    lockForm(true, 'Guardar contraseña');
    return;
  }

  // Sin token: invitación a pedir uno nuevo.
  subEl.textContent = 'No hay un enlace de recuperación válido.';
  showMsg('Solicita un enlace nuevo desde el inicio de sesión usando la opción "¿Olvidaste tu contraseña?".');
  lockForm(true, 'Guardar contraseña');
})();
</script>
</body>
</html>
