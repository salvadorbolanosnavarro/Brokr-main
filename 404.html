  Esta página la sirve GitHub Pages automáticamente para cualquier ruta
  que no exista como archivo real (ej. broquer.app/chava-bolanos). El
  navegador conserva esa URL en la barra de direcciones; este script lee
  location.pathname para saber qué agente mostrar. No mover ni renombrar
  este archivo — GitHub Pages lo busca por el nombre exacto "404.html".
-->

</div>
