name: Debug Full Tests

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - .debug-full-tests-trigger

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run full unittest suite and capture output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' > full-tests.log 2>&1
          code=$?
          cat full-tests.log
          echo "$code" > full-tests.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-tests-debug
          path: |
            full-tests.log
            full-tests.exit
