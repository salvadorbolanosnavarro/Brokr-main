name: Apply Photo Status Reads Core

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - scripts/trigger_photo_status_reads_core.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic transform
        run: python scripts/refactor_main_photo_status_reads_core.py
      - name: Validate transformed main
        run: |
          python -m py_compile main.py
          python -m unittest -v tests.test_main_photo_status_reads_core_refactor
          git diff --check -- main.py
          git diff --exit-code -- . ':!main.py'
      - name: Commit transformed main only
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already transformed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "refactor: route photo status reads through core"
          git push origin HEAD:agent/architecture-cleanup
