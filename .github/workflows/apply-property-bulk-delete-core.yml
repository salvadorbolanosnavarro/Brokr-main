name: Apply property bulk DELETE Core transform

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - scripts/refactor_main_property_bulk_delete_core.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Apply deterministic transform
        run: python scripts/refactor_main_property_bulk_delete_core.py

      - name: Run directed dry-run guard
        run: python -m unittest tests.test_main_property_bulk_delete_transform

      - name: Reject unexpected diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "main.py" ]]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Compile shared core and migrated modules
        run: >-
          python -m compileall -q core main.py limites.py push.py whatsapp.py
          routers/bolsa.py routers/staging.py routers/correo.py routers/video.py
          routers/whatsapp_chatgpt.py routers/organizaciones.py routers/finanzas.py
          routers/cumplimiento.py routers/agente.py routers/firmas.py
          scripts/architecture_debt.py

      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Audit current statistics UI
        run: python audit.py estadisticas.html

      - name: Report architecture debt
        run: python scripts/architecture_debt.py

      - name: Commit transformed main and record Quality pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "refactor: route property bulk delete through Core"
          quality_sha="$(git rev-parse HEAD)"
          mkdir -p .ci
          printf '%s\n' "$quality_sha" > .ci/architecture-quality-pass.txt
          git add .ci/architecture-quality-pass.txt
          git commit -m "ci: record architecture Quality pass for ${quality_sha:0:12}"
          git push origin HEAD:agent/architecture-cleanup
