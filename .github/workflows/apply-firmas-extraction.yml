name: Apply bounded Firmas extraction

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - '.ci/firmas-extraction-trigger.txt'

permissions:
  contents: write

concurrency:
  group: architecture-write-agent-cleanup
  cancel-in-progress: false

jobs:
  apply-contract-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve bounded Firmas extraction
        id: resolve
        shell: bash
        run: |
          script="$(sed -n 's/^transform=//p' .ci/firmas-extraction-trigger.txt | head -n 1)"
          if [[ ! "$script" =~ ^scripts/refactor_firmas_extract_[A-Za-z0-9_]+_core\.py$ ]]; then
            echo "Rejected Firmas extraction path: $script"
            exit 1
          fi
          test -f "$script"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify HTTP golden before extraction
        run: python -m unittest tests.test_http_contract_golden

      - name: Apply deterministic AST extraction
        run: python "${{ steps.resolve.outputs.script }}"

      - name: Reject unexpected production diff
        shell: bash
        run: |
          git diff --check
          unexpected="$(git diff --name-only | grep -v '^routers/firmas\.py$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected Firmas extraction diff:\n%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet -- routers/firmas.py; then
            echo "Extraction produced no routers/firmas.py diff"
            exit 1
          fi

      - name: Verify HTTP golden after extraction
        run: python -m unittest tests.test_http_contract_golden

      - name: Run focused Firmas guards
        run: python -m unittest tests.test_firmas_utils_extraction tests.test_firmas_policy

      - name: Run Quality gates
        run: bash scripts/run_quality.sh

      - name: Commit certified Firmas extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trigger_sha="$(git rev-parse HEAD)"
          git add routers/firmas.py
          git commit -m "refactor: extract Firmas domain policy"
          quality_sha="$(git rev-parse HEAD)"
          mkdir -p .ci
          printf '%s\n' "$quality_sha" > .ci/firmas-quality-pass.txt
          cat > .ci/firmas-quality-result.txt <<EOF
          trigger_sha=$trigger_sha
          transform=success
          contract=success
          install=success
          compile=success
          tests=success
          visual=success
          debt=success
          quality_sha=$quality_sha
          EOF
          git add .ci/firmas-quality-pass.txt .ci/firmas-quality-result.txt
          git commit -m "ci: certify bounded Firmas extraction"
          git push origin HEAD:agent/architecture-cleanup
