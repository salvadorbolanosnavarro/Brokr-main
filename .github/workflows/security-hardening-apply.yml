name: Apply security hardening

on:
  push:
    branches: [security/hardening-2026-08-21]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded security patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          def replace_once(source, old, new, label):
              if old not in source:
                  if new in source:
                      return source
                  raise RuntimeError(f"missing security anchor: {label}")
              return source.replace(old, new, 1)

          # main.py: Meta token encryption, AVM SSRF and rental DOCX validation.
          p = Path('main.py')
          source = p.read_text(encoding='utf-8')
          import_anchor = 'from pathlib import Path\n'
          imports = 'from core.http import fetch_public_http_result\nfrom core.documents import validate_docx_archive\n'
          if 'from core.http import fetch_public_http_result\n' not in source:
              source = replace_once(source, import_anchor, import_anchor + imports, 'main security imports')

          tree = ast.parse(source)
          enc = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'cifrar_secreto']
          if len(enc) != 1 or enc[0].end_lineno is None:
              raise RuntimeError('expected exactly one cifrar_secreto')
          replacement = '''def cifrar_secreto(valor: str) -> str:\n    """Encrypt a token before persistence; never store new credentials in cleartext."""\n    if not valor:\n        return valor\n    if valor.startswith(_PREFIJO_CIFRADO):\n        return valor\n    if not _FERNET:\n        raise RuntimeError("TOKEN_ENC_KEY no configurada o inválida; no se guardará el token en texto plano.")\n    try:\n        return _PREFIJO_CIFRADO + _FERNET.encrypt(valor.encode("utf-8")).decode("ascii")\n    except Exception as e:\n        raise RuntimeError("No se pudo cifrar el token de Meta; no se guardará en texto plano.") from e\n'''
          node = enc[0]
          lines = source.splitlines(keepends=True)
          lines[node.lineno - 1:node.end_lineno] = [replacement]
          source = ''.join(lines)
          source = source.replace(
              '"TOKEN_ENC_KEY inválida (%s). Los tokens seguirán en texto plano. "',
              '"TOKEN_ENC_KEY inválida (%s). Las nuevas conexiones de Meta quedarán bloqueadas hasta corregirla. "',
              1,
          )

          tree = ast.parse(source)
          targets = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name == '_try_httpx']
          if len(targets) != 1 or targets[0].end_lineno is None:
              raise RuntimeError('expected exactly one AVM _try_httpx')
          original = ast.get_source_segment(source, targets[0]) or ''
          if 'fetch_public_http_result' not in original:
              if 'httpx.AsyncClient' not in original or 'follow_redirects=True' not in original:
                  raise RuntimeError('unexpected AVM transport')
              avm = '''    async def _try_httpx(url: str) -> Dict[str, Any]:\n        async with sem_http:\n            r = await fetch_public_http_result(\n                url,\n                timeout=FETCH_TIMEOUT,\n                headers=headers,\n            )\n        ctype = (r.headers.get("content-type") or "").lower()\n        if r.status_code >= 400 or "text/html" not in ctype:\n            return {"ok": False, "status": r.status_code, "text": ""}\n        return {"ok": True, "status": r.status_code, "text": _extract_visible_text(r.text)}\n'''
              lines = source.splitlines(keepends=True)
              lines[targets[0].lineno - 1:targets[0].end_lineno] = [avm]
              source = ''.join(lines)

          source = replace_once(
              source,
              '        elif "wordprocessingml" in ct or n.endswith(".docx"):\n            try:\n                from docx import Document as _DocxDocument\n',
              '        elif "wordprocessingml" in ct or n.endswith(".docx"):\n            try:\n                validate_docx_archive(raw)\n                from docx import Document as _DocxDocument\n',
              'supplemental rental DOCX validation',
          )
          source = replace_once(
              source,
              '    elif is_docx:\n        try:\n            from docx import Document as DocxDocument\n',
              '    elif is_docx:\n        try:\n            validate_docx_archive(content)\n            from docx import Document as DocxDocument\n',
              'primary rental DOCX validation',
          )
          compile(source, 'main.py', 'exec')
          p.write_text(source, encoding='utf-8')

          # WhatsApp 2 legacy monolith: no public verify/PIN defaults and fail closed.
          p = Path('whatsapp.py')
          source = p.read_text(encoding='utf-8')
          source = replace_once(source,
              'WA2_VERIFY_TOKEN = os.environ.get("WA2_VERIFY_TOKEN", "broquer2_verify")',
              'WA2_VERIFY_TOKEN = os.environ.get("WA2_VERIFY_TOKEN", "").strip()',
              'WA2 verify token default')
          source = replace_once(source,
              'WA2_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "142857")',
              'WA2_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "").strip()',
              'WA2 register pin default')
          source = replace_once(source,
              '    if p.get("hub.mode") == "subscribe" and p.get("hub.verify_token") == WA2_VERIFY_TOKEN:\n',
              '    if WA2_VERIFY_TOKEN and p.get("hub.mode") == "subscribe" and p.get("hub.verify_token") == WA2_VERIFY_TOKEN:\n',
              'WA2 webhook fail-closed check')
          source = replace_once(source,
              '    else:\n        async with httpx.AsyncClient(timeout=20) as c:\n            r = await c.post(f"{GRAPH_API}/{phone_number_id}/register",\n',
              '    else:\n        if not WA2_REGISTER_PIN:\n            raise HTTPException(status_code=500, detail="WA_REGISTER_PIN no configurado.")\n        async with httpx.AsyncClient(timeout=20) as c:\n            r = await c.post(f"{GRAPH_API}/{phone_number_id}/register",\n',
              'WA2 register pin guard')
          compile(source, 'whatsapp.py', 'exec')
          p.write_text(source, encoding='utf-8')

          # ChatGPT WhatsApp connector uses the same fail-closed registration PIN.
          p = Path('routers/whatsapp_chatgpt.py')
          source = p.read_text(encoding='utf-8')
          source = replace_once(source,
              'WA_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "123456")',
              'WA_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "").strip()',
              'ChatGPT WhatsApp register pin default')
          source = replace_once(source,
              '    async with httpx.AsyncClient(timeout=20) as c:\n        sub_r = await c.post(f"{GRAPH_API}/{waba_id}/subscribed_apps", params={"access_token": access_token})\n',
              '    if req.register_number and not WA_REGISTER_PIN:\n        raise HTTPException(status_code=500, detail="WA_REGISTER_PIN no configurado.")\n\n    async with httpx.AsyncClient(timeout=20) as c:\n        sub_r = await c.post(f"{GRAPH_API}/{waba_id}/subscribed_apps", params={"access_token": access_token})\n',
              'ChatGPT WhatsApp register pin guard')
          compile(source, str(p), 'exec')
          p.write_text(source, encoding='utf-8')

          # Machotes: validate every untrusted DOCX before python-docx expands it.
          p = Path('machotes.py')
          source = p.read_text(encoding='utf-8')
          source = replace_once(source,
              'import httpx\n',
              'import httpx\nfrom core.documents import validate_docx_archive\n',
              'machotes DOCX validator import')
          source = replace_once(source,
              'def cargar_docx(content: bytes):\n    from docx import Document as DocxDocument\n    return DocxDocument(io.BytesIO(content))\n',
              'def cargar_docx(content: bytes):\n    validate_docx_archive(content)\n    from docx import Document as DocxDocument\n    return DocxDocument(io.BytesIO(content))\n',
              'machotes DOCX validator')
          compile(source, str(p), 'exec')
          p.write_text(source, encoding='utf-8')

          # Security contract: specifically replaces the obsolete public-default assertion.
          tests = Path('tests')
          tests.mkdir(exist_ok=True)
          Path('tests/test_security_hardening.py').write_text('''import ast\nimport pathlib\nimport unittest\n\nROOT = pathlib.Path(__file__).resolve().parents[1]\n\nclass SecurityHardeningTests(unittest.TestCase):\n    def test_whatsapp_secrets_have_no_public_defaults_and_webhook_fails_closed(self):\n        source = (ROOT / "whatsapp.py").read_text(encoding="utf-8")\n        self.assertIn('WA2_VERIFY_TOKEN = os.environ.get("WA2_VERIFY_TOKEN", "").strip()', source)\n        self.assertIn('WA2_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "").strip()', source)\n        self.assertNotIn('broquer2_verify', source)\n        self.assertIn('if WA2_VERIFY_TOKEN and p.get("hub.mode") == "subscribe"', source)\n\n    def test_chatgpt_registration_pin_fails_closed(self):\n        source = (ROOT / "routers" / "whatsapp_chatgpt.py").read_text(encoding="utf-8")\n        self.assertIn('WA_REGISTER_PIN = os.environ.get("WA_REGISTER_PIN", "").strip()', source)\n        self.assertIn('if req.register_number and not WA_REGISTER_PIN:', source)\n\n    def test_meta_token_writes_fail_closed(self):\n        source = (ROOT / "main.py").read_text(encoding="utf-8")\n        self.assertIn('TOKEN_ENC_KEY no configurada o inválida; no se guardará el token en texto plano.', source)\n        self.assertIn('No se pudo cifrar el token de Meta; no se guardará en texto plano.', source)\n\n    def test_avm_fetch_uses_ssrf_safe_transport(self):\n        source = (ROOT / "main.py").read_text(encoding="utf-8")\n        tree = ast.parse(source)\n        nodes = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name == "_try_httpx"]\n        self.assertEqual(len(nodes), 1)\n        block = ast.get_source_segment(source, nodes[0]) or ""\n        self.assertIn('fetch_public_http_result', block)\n        self.assertNotIn('follow_redirects=True', block)\n\n    def test_docx_parsers_validate_before_expansion(self):\n        main = (ROOT / "main.py").read_text(encoding="utf-8")\n        machotes = (ROOT / "machotes.py").read_text(encoding="utf-8")\n        self.assertIn('validate_docx_archive(raw)', main)\n        self.assertIn('validate_docx_archive(content)', main)\n        self.assertIn('validate_docx_archive(content)', machotes)\n\nif __name__ == '__main__':\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Verify security patch
        run: |
          python -m compileall -q main.py whatsapp.py machotes.py routers/whatsapp_chatgpt.py core tests/test_security_hardening.py
          python -m unittest tests.test_security_hardening
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py whatsapp.py machotes.py routers/whatsapp_chatgpt.py core tests/test_security_hardening.py
          git commit -m "security: fail closed on secrets, SSRF and DOCX inputs"
          git push origin HEAD:security/hardening-2026-08-21
