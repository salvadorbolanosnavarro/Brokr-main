name: Apply main EasyBroker key read refactor

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-main-eb-key-read]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0
      - name: Apply exact AST-bounded transform
        run: python scripts/refactor_main_easybroker_key_read.py
      - name: Verify patch
        run: |
          git add main.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No main.py change produced'; exit 1; } || true
      - name: Commit transformed EasyBroker key read
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Move EasyBroker org key read behind Core database'
          git push origin HEAD:agent/architecture-cleanup
