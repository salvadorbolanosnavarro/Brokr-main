name: Diagnose website lead transform

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run targeted dry-run test
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_main_website_lead_contact_read_transform > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/test.log | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error::$safe"
            done
          fi
          exit "$status"
