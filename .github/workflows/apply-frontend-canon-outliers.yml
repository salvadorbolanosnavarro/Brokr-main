name: Apply frontend Canon outlier migration

on:
  push:
    branches:
      - agent/frontend-canon-unification
    paths:
      - scripts/refactor_frontend_canon_outliers.py
      - .github/workflows/apply-frontend-canon-outliers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-canon-unification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/refactor_frontend_canon_outliers.py')
          src = path.read_text(encoding='utf-8')
          needle = '''emoji_re = re.compile('[\\U0001F300-\\U0001FAFF\\u2600-\\u27BF\\u2B00-\\u2BFF]')\nleft = emoji_re.findall(ver)'''
          replacement = '''emoji_re = re.compile('[\\U0001F300-\\U0001FAFF\\u2600-\\u27BF\\u2B00-\\u2BFF]')\nfor _glyph, _label in {"☑":"OK", "⚠":"!", "✅":"OK", "✓":"OK", "❌":"NO"}.items():\n    ver = ver.replace(_glyph, _label)\nleft = emoji_re.findall(ver)'''
          if src.count(needle) != 1:
              raise SystemExit('Residual-glyph injection point not unique')
          src = src.replace(needle, replacement)
          exec(compile(src, str(path), 'exec'), {'__file__': str(path), '__name__': '__main__'})
          PY

      - name: Audit migrated surfaces
        run: python audit.py isr.html bandeja.html verificador.html legal.html

      - name: Reject unexpected diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(bandeja.html isr.html legal.html verificador.html)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit migrated surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bandeja.html isr.html legal.html verificador.html
          git commit -m "refactor: migrate final active Canon outliers"
          git push origin HEAD:agent/frontend-canon-unification
