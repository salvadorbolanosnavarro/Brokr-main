name: Apply Organizaciones Core refactor

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-organizaciones-core-refactor]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup

      - name: Apply reviewed compatibility fix
        run: python scripts/fix_organizaciones_core_aliases.py

      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routers/organizaciones.py
          git diff --cached --check
          git commit -m "Complete Organizaciones Core compatibility migration"
          git push origin HEAD:agent/architecture-cleanup
