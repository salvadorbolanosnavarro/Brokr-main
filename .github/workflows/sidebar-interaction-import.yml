name: Sidebar Interaction Import

on:
  push:
    branches:
      - agent/frontend-sidebar-final

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[sidebar-interaction-import]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-sidebar-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic import
        run: python scripts/refactor_frontend_sidebar_interaction_import.py
      - name: Commit import
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No import changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brokr-theme.css
          git commit -m "load canonical sidebar interaction layer [sidebar-interaction-import]"
          git push origin HEAD:agent/frontend-sidebar-final
