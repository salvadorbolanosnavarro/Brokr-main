name: Sidebar Composition Transform

on:
  push:
    branches:
      - agent/frontend-sidebar-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transform:
    if: "!contains(github.event.head_commit.message || '', '[sidebar-transform]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-sidebar-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic composition transform
        run: python scripts/refactor_frontend_sidebar_composition.py
      - name: Commit transformed sidebar surfaces
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No transform changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add propiedades.html contactos.html tareas.html leads.html avm.html
          git commit -m "normalize sidebar product composition [sidebar-transform]"
          git push origin HEAD:agent/frontend-sidebar-final
