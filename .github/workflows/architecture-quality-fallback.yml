name: Architecture Quality fallback

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - '.ci/architecture-quality-trigger.txt'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply optional bounded architecture transform
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          script="$(sed -n 's/^transform=//p' .ci/architecture-quality-trigger.txt | head -n 1)"
          if [[ -z "$script" ]]; then
            exit 0
          fi
          if [[ ! "$script" =~ ^scripts/refactor_(main|core_database)_[A-Za-z0-9_]+_core\.py$ ]]; then
            echo "Rejected transform path: $script"
            exit 1
          fi
          if [[ ! -f "$script" ]]; then
            echo "Transform not found: $script"
            exit 1
          fi
          python "$script"

      - name: Install test dependencies
        id: install
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile shared core and migrated modules
        id: compile
        continue-on-error: true
        run: >-
          python -m compileall -q core main.py limites.py push.py whatsapp.py
          routers/bolsa.py routers/staging.py routers/correo.py routers/video.py
          routers/whatsapp_chatgpt.py routers/organizaciones.py routers/finanzas.py
          routers/cumplimiento.py routers/agente.py routers/firmas.py
          scripts/architecture_debt.py

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee .ci/architecture-quality-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Audit current statistics UI
        id: visual
        continue-on-error: true
        run: python audit.py estadisticas.html

      - name: Report architecture debt
        id: debt
        continue-on-error: true
        run: python scripts/architecture_debt.py

      - name: Evaluate Quality gate
        id: gate
        shell: bash
        run: |
          trigger_sha="$(git rev-parse HEAD)"
          mkdir -p .ci
          cat > .ci/architecture-quality-result.txt <<EOF
          trigger_sha=$trigger_sha
          transform=${{ steps.transform.outcome }}
          install=${{ steps.install.outcome }}
          compile=${{ steps.compile.outcome }}
          tests=${{ steps.tests.outcome }}
          visual=${{ steps.visual.outcome }}
          debt=${{ steps.debt.outcome }}
          EOF
          if [[ "${{ steps.transform.outcome }}" == "success" \
             && "${{ steps.install.outcome }}" == "success" \
             && "${{ steps.compile.outcome }}" == "success" \
             && "${{ steps.tests.outcome }}" == "success" \
             && "${{ steps.visual.outcome }}" == "success" \
             && "${{ steps.debt.outcome }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Quality result
        shell: bash
        run: |
          trigger_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.gate.outputs.passed }}" == "true" ]]; then
            unexpected="$(git diff --name-only | grep -v '^\.ci/' | grep -v '^main\.py$' | grep -v '^core/database\.py$' || true)"
            if [[ -n "$unexpected" ]]; then
              printf 'Unexpected production diff:\n%s\n' "$unexpected"
              exit 1
            fi
            if ! git diff --quiet -- main.py core/database.py; then
              git add main.py core/database.py
              git commit -m "refactor: apply bounded architecture transform"
            fi
            quality_sha="$(git rev-parse HEAD)"
            printf '%s\n' "$quality_sha" > .ci/architecture-quality-pass.txt
            printf 'quality_sha=%s\n' "$quality_sha" >> .ci/architecture-quality-result.txt
          else
            git restore main.py core/database.py || true
          fi
          git add .ci/architecture-quality-result.txt .ci/architecture-quality-tests.log
          if [[ "${{ steps.gate.outputs.passed }}" == "true" ]]; then
            git add .ci/architecture-quality-pass.txt
          fi
          git commit -m "ci: record architecture Quality result for ${trigger_sha:0:12}"
          git push origin HEAD:agent/architecture-cleanup

      - name: Fail workflow when Quality is red
        if: steps.gate.outputs.passed != 'true'
        run: exit 1
