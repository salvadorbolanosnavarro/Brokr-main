name: Apply visual composition normalization

on:
  workflow_dispatch:
  push:
    branches:
      - agent/visual-normalization-pass
    paths:
      - scripts/normalize_module_composition.py
      - .github/workflows/apply-visual-normalization.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/normalize_module_composition.py
      - .github/workflows/apply-visual-normalization.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-normalization-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize module composition
        run: python scripts/normalize_module_composition.py
      - name: Audit normalized modules
        run: python audit.py estadisticas.html avm.html
      - name: Run Canon contract tests
        run: python -m unittest discover -s tests -p 'test_frontend_canon_*.py'
      - name: Check exact runtime diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' avm.html estadisticas.html | sort)"
          test "$changed" = "$expected"
      - name: Commit normalized modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avm.html estadisticas.html
          git commit -m "Normalize Estadísticas and AVM composition"
          git push origin HEAD:agent/visual-normalization-pass
