name: Apply bounded WhatsApp extraction

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - '.ci/whatsapp-extraction-trigger.txt'

permissions:
  contents: write

jobs:
  apply-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve bounded extraction
        id: resolve
        shell: bash
        run: |
          script="$(sed -n 's/^transform=//p' .ci/whatsapp-extraction-trigger.txt | head -n 1)"
          if [[ ! "$script" =~ ^scripts/refactor_whatsapp_extract_[A-Za-z0-9_]+_core\.py$ ]]; then
            echo "Rejected WhatsApp extraction path: $script"
            exit 1
          fi
          test -f "$script"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Apply deterministic extraction
        run: python "${{ steps.resolve.outputs.script }}"

      - name: Reject unexpected production diff
        shell: bash
        run: |
          git diff --check
          unexpected="$(git diff --name-only | grep -v '^whatsapp\.py$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected extraction diff:\n%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet -- whatsapp.py; then
            echo "Extraction produced no whatsapp.py diff"
            exit 1
          fi

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile application
        run: >-
          python -m compileall -q core routers main.py limites.py push.py whatsapp.py
          scripts/architecture_debt.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Audit current statistics UI
        run: python audit.py estadisticas.html

      - name: Report architecture debt
        run: python scripts/architecture_debt.py

      - name: Commit certified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp.py
          git commit -m "refactor: extract bounded WhatsApp domain"
          quality_sha="$(git rev-parse HEAD)"
          mkdir -p .ci
          printf '%s\n' "$quality_sha" > .ci/whatsapp-quality-pass.txt
          cat > .ci/whatsapp-quality-result.txt <<EOF
          trigger_sha=$(git rev-parse HEAD^)
          transform=success
          install=success
          compile=success
          tests=success
          visual=success
          debt=success
          quality_sha=$quality_sha
          EOF
          git add .ci/whatsapp-quality-pass.txt .ci/whatsapp-quality-result.txt
          git commit -m "ci: certify bounded WhatsApp extraction"
          git push origin HEAD:agent/architecture-cleanup
