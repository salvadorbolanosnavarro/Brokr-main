name: Apply WhatsApp database refactor

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-whatsapp-database-refactor]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup

      - name: Apply exact reviewed transform
        run: python scripts/refactor_whatsapp_database.py

      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp.py
          git diff --cached --check
          git commit -m "Route WhatsApp table access through Core"
          git push origin HEAD:agent/architecture-cleanup
