name: Apply Facebook Connection Core Refactor

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - .apply-facebook-connection-core-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic transform
        run: python scripts/refactor_main_facebook_connection_core.py
      - name: Validate and commit only main.py
        shell: bash
        run: |
          python -m py_compile main.py
          git diff --check -- main.py
          git add main.py
          git diff --cached --quiet && { echo "No main.py change produced"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: route facebook connection persistence through core"
          git push origin HEAD:agent/architecture-cleanup
