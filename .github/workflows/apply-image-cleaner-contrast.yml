name: Apply Image Cleaner contrast cleanup

on:
  push:
    branches:
      - agent/frontend-canon-unification
    paths:
      - scripts/refactor_image_cleaner_contrast.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-canon-unification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Directed dry-run guard
        run: python scripts/refactor_image_cleaner_contrast.py --check

      - name: Test deterministic transform
        run: python -m unittest tests.test_image_cleaner_contrast_transform

      - name: Apply deterministic transform
        run: python scripts/refactor_image_cleaner_contrast.py

      - name: Reject unexpected diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "image-cleaner.html" ]]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit contrast fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-cleaner.html
          git commit -m "fix: raise Image Cleaner secondary text contrast"
          git push origin HEAD:agent/frontend-canon-unification
