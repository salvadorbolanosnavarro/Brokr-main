name: Apply AST architecture extraction

on:
  pull_request:
    branches:
      - main
    paths:
      - '.ci/architecture-extraction-trigger.txt'

permissions:
  contents: write

concurrency:
  group: architecture-write-agent-cleanup
  cancel-in-progress: false

jobs:
  apply-contract-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve AST extraction
        id: resolve
        shell: bash
        run: |
          script="$(sed -n 's/^transform=//p' .ci/architecture-extraction-trigger.txt | head -n 1)"
          if [[ ! "$script" =~ ^scripts/refactor_main_extract_[A-Za-z0-9_]+_core\.py$ ]]; then
            echo "Rejected extraction path: $script"
            exit 1
          fi
          test -f "$script"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Bootstrap certified OpenAPI golden once
        shell: bash
        run: |
          if [[ ! -f tests/golden/http_contract_effective.json ]]; then
            python -m tests.test_http_contract_golden --update
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tests/golden/http_contract_effective.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('count') != 238:
              raise SystemExit(f"expected certified 238 operations, found {data.get('count')}")
          print('certified OpenAPI baseline:', data['count'], 'operations')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/golden/http_contract_effective.json
            git commit -m "test: freeze effective HTTP contract"
          fi

      - name: Verify HTTP golden before extraction
        run: python -m unittest tests.test_http_contract_golden

      - name: Apply deterministic AST extraction
        run: python "${{ steps.resolve.outputs.script }}"

      - name: Reject unexpected production diff
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -v '^main\.py$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected extraction diff:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify HTTP golden after extraction
        run: python -m unittest tests.test_http_contract_golden

      - name: Run Quality gates
        run: bash scripts/run_quality.sh

      - name: Commit certified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- main.py; then
            echo "Extraction produced no main.py diff"
            exit 1
          fi
          trigger_sha="$(git rev-parse HEAD)"
          git add main.py
          git commit -m "refactor: connect prepared routers via AST extraction"
          quality_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$quality_sha" > .ci/architecture-quality-pass.txt
          cat > .ci/architecture-quality-result.txt <<EOF
          trigger_sha=$trigger_sha
          transform=success
          contract=success
          install=success
          compile=success
          tests=success
          visual=success
          debt=success
          quality_sha=$quality_sha
          EOF
          git add .ci/architecture-quality-pass.txt .ci/architecture-quality-result.txt
          git commit -m "ci: certify AST architecture extraction"
          git push origin HEAD:agent/architecture-cleanup
