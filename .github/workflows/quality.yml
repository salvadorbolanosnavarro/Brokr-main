name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - agent/architecture-cleanup

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile application and migration tooling
        run: >-
          python -m compileall -q core routers scripts
          main.py limites.py push.py whatsapp.py admin_consola.py migrar_fotos.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Audit current statistics UI
        run: python audit.py estadisticas.html

      - name: Report architecture debt
        run: python scripts/architecture_debt.py
