name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check httpx

      - name: Compile shared core and migrated modules
        run: python -m compileall -q core routers/bolsa.py routers/staging.py

      - name: Run core contract tests
        run: python -m unittest tests/test_core_contracts.py
