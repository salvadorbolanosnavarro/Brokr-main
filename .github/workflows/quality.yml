name: Security Quality

on:
  push:
    branches:
      - security/hardening-2026-08-21
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q core routers main.py limites.py push.py whatsapp.py admin_consola.py migrar_fotos.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Audit active Canon frontend inventory
        run: python audit.py
