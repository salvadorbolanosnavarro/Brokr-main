name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile shared core and migrated modules
        run: >-
          python -m compileall -q core main.py limites.py push.py whatsapp.py
          routers/bolsa.py routers/staging.py routers/correo.py routers/video.py
          routers/whatsapp_chatgpt.py routers/organizaciones.py routers/finanzas.py
          routers/cumplimiento.py routers/agente.py routers/firmas.py
          scripts/architecture_debt.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Audit Canon frontend surfaces
        run: >-
          python audit.py
          estadisticas.html
          login.html
          registro.html
          reset-password.html
          unirse.html
          correo.html
          aviso-privacidad.html
          facebook-callback.html
          whatsapp-callback.html
          whatsapp-chatgpt.html
          avm.html
          contratos.html
          image-cleaner.html
          robin.html
          landing.html
          tareas.html
          firmas.html
          finanzas.html
          cumplimiento.html
          video.html
          facebook-ads.html
          mi-sitio.html
          equipo.html
          empresas.html
          admin.html
          soporte.html

      - name: Report architecture debt
        run: python scripts/architecture_debt.py
