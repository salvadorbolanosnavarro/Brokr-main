name: Generate Contract Golden

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - scripts/generate_http_contract_golden.py
      - .github/workflows/generate-contract-golden.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/architecture-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate frozen HTTP contract
        run: >-
          python scripts/generate_http_contract_golden.py
          a1f281c187b71515df57c0d80b4df5ff6aa5e2a1
          tests/golden/http_contract_a1f281c.json
      - name: Commit golden
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/golden/http_contract_a1f281c.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: freeze HTTP contract at a1f281c'
          git push origin HEAD:agent/architecture-cleanup
