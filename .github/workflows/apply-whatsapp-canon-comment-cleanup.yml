name: Apply WhatsApp Canon comment cleanup

on:
  push:
    branches:
      - agent/frontend-canon-unification
    paths:
      - scripts/refactor_whatsapp_canon_comment.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-canon-unification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Directed dry-run guard
        run: python scripts/refactor_whatsapp_canon_comment.py --check

      - name: Test deterministic transform
        run: python -m unittest tests.test_whatsapp_canon_comment_cleanup

      - name: Apply deterministic transform
        run: python scripts/refactor_whatsapp_canon_comment.py

      - name: Reject unexpected diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "whatsapp.html" ]]; then
            printf 'Unexpected changed files:\n'; printf '%s\n' "${changed[@]}"; exit 1
          fi

      - name: Commit shrunk WhatsApp file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp.html
          git commit -m "cleanup: remove WhatsApp Canon migration comment"
          git push origin HEAD:agent/frontend-canon-unification
