name: Pages pilot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-pilot-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref == 'work/cecil-production-canary-20261119'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both real-service interfaces
        run: python3 -m scripts.build_pages_pilot --output dist/pages-pilot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages-pilot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved main artifact
        id: deployment
        uses: actions/deploy-pages@v4
