name: Apply Stripe webhook subscription POST Core transform

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - scripts/refactor_main_stripe_webhook_subscription_post_core.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        id: install
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Apply deterministic transform
        id: transform
        continue-on-error: true
        run: python scripts/refactor_main_stripe_webhook_subscription_post_core.py

      - name: Run directed guards
        id: directed
        continue-on-error: true
        run: python -m unittest tests.test_main_stripe_webhook_subscription_post_transform tests.test_main_stripe_webhook_subscription_post_core_refactor

      - name: Reject unexpected diff
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "main.py" ]]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Compile shared core and migrated modules
        id: compile
        continue-on-error: true
        run: >-
          python -m compileall -q core main.py limites.py push.py whatsapp.py
          routers/bolsa.py routers/staging.py routers/correo.py routers/video.py
          routers/whatsapp_chatgpt.py routers/organizaciones.py routers/finanzas.py
          routers/cumplimiento.py routers/agente.py routers/firmas.py
          scripts/architecture_debt.py

      - name: Run full tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Audit current statistics UI
        id: visual
        continue-on-error: true
        run: python audit.py estadisticas.html

      - name: Report architecture debt
        id: debt
        continue-on-error: true
        run: python scripts/architecture_debt.py

      - name: Evaluate gate
        id: gate
        shell: bash
        run: |
          mkdir -p .ci
          cat > .ci/stripe-webhook-subscription-post-result.txt <<EOF
          source_sha=$(git rev-parse HEAD)
          install=${{ steps.install.outcome }}
          transform=${{ steps.transform.outcome }}
          directed=${{ steps.directed.outcome }}
          diff=${{ steps.diff.outcome }}
          compile=${{ steps.compile.outcome }}
          tests=${{ steps.tests.outcome }}
          visual=${{ steps.visual.outcome }}
          debt=${{ steps.debt.outcome }}
          EOF
          if [[ "${{ steps.install.outcome }}" == "success" \
             && "${{ steps.transform.outcome }}" == "success" \
             && "${{ steps.directed.outcome }}" == "success" \
             && "${{ steps.diff.outcome }}" == "success" \
             && "${{ steps.compile.outcome }}" == "success" \
             && "${{ steps.tests.outcome }}" == "success" \
             && "${{ steps.visual.outcome }}" == "success" \
             && "${{ steps.debt.outcome }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.gate.outputs.passed }}" == "true" ]]; then
            git add main.py
            git commit -m "refactor: route Stripe webhook subscription post through Core"
            quality_sha="$(git rev-parse HEAD)"
            printf '%s\n' "$quality_sha" > .ci/architecture-quality-pass.txt
            git add .ci/architecture-quality-pass.txt .ci/stripe-webhook-subscription-post-result.txt
            git commit -m "ci: record architecture Quality pass for ${quality_sha:0:12}"
          else
            git restore main.py || true
            git add .ci/stripe-webhook-subscription-post-result.txt
            git commit -m "ci: record Stripe webhook transform gate result"
          fi
          git push origin HEAD:agent/architecture-cleanup

      - name: Fail workflow when gate is red
        if: steps.gate.outputs.passed != 'true'
        run: exit 1
