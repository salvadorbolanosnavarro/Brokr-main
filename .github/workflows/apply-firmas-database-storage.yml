name: Apply Firmas database and Storage refactor

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-firmas-db-storage]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
          fetch-depth: 0

      - name: Apply exact transform
        run: python scripts/refactor_firmas_database_storage.py

      - name: Verify patch
        run: |
          git add routers/firmas.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No Firmas change produced'; exit 1; } || true

      - name: Commit transformed Firmas
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Move Firmas database and Storage behind Core'
          git push origin HEAD:agent/architecture-cleanup
