name: Apply Properties Contacts premium pass

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply_properties_contacts_premium.py'
      - '.github/workflows/apply-properties-contacts-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/properties-contacts-premium-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped premium pass
        run: python scripts/apply_properties_contacts_premium.py
      - name: Verify exact runtime diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "brokr-theme.css"
      - name: Audit active frontend
        run: python audit.py
      - name: Run frontend Canon tests
        run: python -m unittest discover -s tests -p 'test_frontend_canon_*.py'
      - name: Commit runtime change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brokr-theme.css
          git commit -m "Refine Properties and Contacts premium UX"
          git push origin HEAD:agent/properties-contacts-premium-pass
