name: Apply WhatsApp adapter absorption

on:
  push:
    branches:
      - agent/frontend-canon-unification
    paths:
      - scripts/refactor_whatsapp_adapter_into_canon.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-canon-unification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Directed dry-run guard
        run: python scripts/refactor_whatsapp_adapter_into_canon.py --check

      - name: Test deterministic transform
        run: python -m unittest tests.test_whatsapp_adapter_absorption

      - name: Apply deterministic transform
        run: python scripts/refactor_whatsapp_adapter_into_canon.py

      - name: Reject unexpected diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          expected=("brokr-theme.css" "broquer-ui.css" "whatsapp.html")
          if [[ "${#changed[@]}" -ne 3 ]]; then
            printf 'Unexpected changed files:\n'; printf '%s\n' "${changed[@]}"; exit 1
          fi
          for i in 0 1 2; do
            if [[ "${changed[$i]}" != "${expected[$i]}" ]]; then
              printf 'Unexpected changed files:\n'; printf '%s\n' "${changed[@]}"; exit 1
            fi
          done

      - name: Commit absorbed WhatsApp domain rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brokr-theme.css whatsapp.html
          git rm broquer-ui.css
          git commit -m "refactor: absorb WhatsApp adapter into Canon"
          git push origin HEAD:agent/frontend-canon-unification
