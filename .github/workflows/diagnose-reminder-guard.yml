name: Diagnose reminder guard

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - tests/test_main_reminder_sent_patch_core_refactor.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run full suite with visible failure
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/test-output.txt 2>&1
          code=$?
          cat /tmp/test-output.txt
          if [[ $code -ne 0 ]]; then
            tail -n 160 /tmp/test-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code
