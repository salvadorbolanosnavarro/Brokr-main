name: Diagnose reminder guard

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - tests/test_main_reminder_sent_patch_core_refactor.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests with visible failure
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/test-output.txt 2>&1
          code=$?
          if [[ $code -ne 0 ]]; then
            tail -n 120 /tmp/test-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "All tests passed"
          fi
          exit $code
