name: Diagnose tests

on:
  push:
    branches:
      - agent/architecture-cleanup

permissions:
  contents: read

jobs:
  unittest-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run unittest and expose failure as annotations
        shell: bash
        run: |
          set +e
          python -m unittest discover -v -s tests -p 'test_*.py' > /tmp/unittest.log 2>&1
          status=$?
          cat /tmp/unittest.log
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAIL|ERROR):|AssertionError|^Traceback|^  File ".*/tests/' /tmp/unittest.log | tail -n 20 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error::$safe"
            done
          fi
          exit "$status"
