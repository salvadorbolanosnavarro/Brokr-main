name: Diagnose Tests

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - .diagnose-tests-trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Capture unittest failure
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > .diagnose-tests-result.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> .diagnose-tests-result.txt
          tail -n 160 .diagnose-tests-result.txt > .diagnose-tests-result.tmp
          mv .diagnose-tests-result.tmp .diagnose-tests-result.txt
          exit 0
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnose-tests-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture test diagnostic"
          git push origin HEAD:agent/architecture-cleanup
