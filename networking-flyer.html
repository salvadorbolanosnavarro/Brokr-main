:root{
  --navy:#00143B; --navy2:#032873; --blue:#1240A0; --blue-lift:#3A6FD8;
  --ink:#00143B; --gold:#C69A3E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a1230}
.stage{width:100%;max-width:760px;margin:0 auto;padding:16px}
/* ---- Flyer canvas: fixed 3:4, scales to width ---- */
.flyer{
  position:relative;width:100%;aspect-ratio:1080/1440;
  border-radius:22px;overflow:hidden;
  container-type:inline-size;
  font-family:'Manrope',system-ui,sans-serif;
  color:#fff;isolation:isolate;
  box-shadow:0 30px 80px -20px rgba(0,10,40,.6);
}
/* Background: layered navy→royal gradient with soft light */
.bg{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(120% 80% at 50% -10%, #2f5fc0 0%, rgba(47,95,192,0) 55%),
    radial-gradient(140% 90% at 50% 115%, #001133 0%, rgba(0,17,51,0) 60%),
    linear-gradient(160deg,#123a94 0%,#0d2f7d 42%,#04184a 100%);
}
.bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(60% 40% at 82% 8%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(50% 34% at 12% 96%, rgba(58,111,216,.35), transparent 70%);}
/* thin inner keyline frame */
.frame{position:absolute;inset:14px;border:1.5px solid rgba(255,255,255,.28);
  border-radius:14px;z-index:-1;pointer-events:none}

.wrap{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:5.4% 7.6% 5.4%;text-align:center}

/* ===== Header ===== */
.brand{display:flex;justify-content:center;align-items:center;gap:2cqw}
.brand img{height:6.4cqw;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.eyebrow{margin-top:2.4cqw;font-weight:700;letter-spacing:.4em;
  font-size:2.85cqw;color:#cfe0ff;text-indent:.4em}

/* ===== Hero ===== */
.hero{margin-top:0.4cqw;font-weight:800;line-height:.9;
  font-size:12.4cqw;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 46%,#bcd0f5 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(0,0,0,.28))}
.hero-rule{width:18cqw;height:2.5px;margin:1.4cqw auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#7fa8f0,transparent)}

/* ===== Logos card ===== */
.logos{margin-top:2.6cqw;background:#fff;border-radius:14px;
  padding:2.8cqw 4.5cqw;box-shadow:0 18px 40px -14px rgba(0,8,30,.55);
  display:flex;justify-content:center}
.logos img{width:76%;height:auto;display:block}

/* ===== Tagline ===== */
.tagline{margin-top:2.6cqw;font-weight:800;font-size:6cqw;letter-spacing:-.01em;
  white-space:nowrap;display:flex;justify-content:center;gap:.45ch}
.tagline b{color:#fff}
.tagline .dot{color:#7fa8f0}
.tagline span:nth-child(2) b{color:#cfe0ff}

/* ===== Benefits ===== */
.perks{margin-top:2.6cqw;display:flex;flex-direction:column;gap:1.3cqw;
  align-items:stretch}
.perk{display:flex;align-items:center;gap:2.8cqw;text-align:left;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:11px;padding:1.8cqw 3cqw}
.perk .ic{flex:0 0 auto;width:7.4cqw;height:7.4cqw;border-radius:9px;
  background:linear-gradient(150deg,#3a6fd8,#123a94);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.perk .ic svg{width:4.1cqw;height:4.1cqw;stroke:#fff;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.perk .tx{font-weight:700;font-size:3.3cqw;line-height:1.2;color:#eef4ff}
.perk .tx small{display:block;font-weight:600;font-size:2.6cqw;
  letter-spacing:.02em;color:#a8c1ee;margin-top:.2cqw}

/* ===== Footer date/venue ===== */
.foot{margin-top:auto;padding-top:2.6cqw}
.divider{width:100%;height:1px;margin-bottom:3.4cqw;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent)}
.when{display:flex;align-items:center;justify-content:center;gap:2.2cqw;
  white-space:nowrap;font-weight:800;font-size:4.5cqw;letter-spacing:-.01em}
.when .sep{width:1.5px;height:4.6cqw;background:rgba(255,255,255,.45)}
.when .time{color:#bcd0f5}
.where{margin-top:2cqw;display:flex;align-items:center;justify-content:center;
  gap:1.6cqw;font-weight:600;font-size:3.15cqw;color:#dbe7ff}
.where svg{width:3.8cqw;height:3.8cqw;stroke:#7fa8f0;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
</style>
