<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"/>
<style>
/* ════════════════════════════════════════════════════════════════
   BROQUER — Completa tu perfil · Rediseño "Blanca"
   Piel nueva sobre la misma estructura y lógica.
   ════════════════════════════════════════════════════════════════ */

/* ═══ AUDIT-EXEMPT: definición de tokens del sistema (en producción migrarán a broquer-2.css) ═══ */
:root {
  --b2-blue:        #0D6BF0;
  --b2-blue-press:  #0A56C4;
  --b2-blue-soft:   #EAF2FE;
  --b2-blue-ring:   rgba(13,107,240,.18);
  --b2-ink:         #1B2733;
  --b2-mute:        #5A6B7C;
  --b2-paper:       #FFFFFF;
  --b2-canvas:      #F6F8FB;
  --b2-line:        #E3E9F0;
  --b2-bien:        #0E8F62;
  --b2-bien-soft:   #E7F5EF;
  --b2-baja:        #A85D62;
  --b2-baja-soft:   #F9EEEC;
  --b2-on-blue:     #FFFFFF;
  --b2-spin-track:  rgba(255,255,255,.35);

  --font-display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --font-sans:    'Figtree', system-ui, -apple-system, sans-serif;

  --fs2-caption: 12px;
  --fs2-sm:      14px;
  --fs2-body:    16px;
  --fs2-h3:      22px;

  --r2-sm:   10px;
  --r2:      14px;
  --r2-lg:   22px;
  --r2-pill: 999px;

  --sh2-card: 0 1px 2px rgba(27,39,51,.05), 0 8px 24px rgba(27,39,51,.07);
  --sh2-bar:  0 2px 6px rgba(27,39,51,.06), 0 14px 44px rgba(13,107,240,.16);

  --ease2: cubic-bezier(.22,.61,.36,1);
}
/* ═══ /AUDIT-EXEMPT ═══ */

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--b2-canvas);
  font-family: var(--font-sans);
  color: var(--b2-ink);
  font-size: var(--fs2-body);
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--b2-blue); outline-offset: 2px; border-radius: var(--r2-sm); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms; transition-duration: .01ms; }
}

.wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }

.card {
  width: 100%; max-width: 460px;
  background: var(--b2-paper);
  border: 1px solid var(--b2-line);
  border-radius: var(--r2-lg);
  padding: 40px 36px 36px;
  box-shadow: var(--sh2-card);
  animation: cardIn .5s var(--ease2);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.logo-area { text-align: center; margin-bottom: 30px; }
.logo-area img { height: 40px; }
.logo-area h2 {
  font-family: var(--font-display);
  font-size: var(--fs2-h3); font-weight: 800;
  margin-top: 14px; color: var(--b2-ink);
  letter-spacing: -0.03em;
}
.logo-area p { font-size: var(--fs2-sm); color: var(--b2-mute); margin-top: 6px; line-height: 1.55; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: var(--fs2-caption); font-weight: 700;
  color: var(--b2-mute);
  letter-spacing: .01em;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  background: var(--b2-paper);
  border: 1.5px solid var(--b2-line);
  border-radius: var(--r2);
  font-family: var(--font-sans);
  font-size: var(--fs2-body);
  color: var(--b2-ink);
  outline: none;
  transition: border-color .18s var(--ease2), box-shadow .18s var(--ease2);
}
.field input::placeholder { color: var(--b2-mute); opacity: .7; }
.field input:focus { border-color: var(--b2-blue); box-shadow: 0 0 0 4px var(--b2-blue-ring); }
.field .hint { font-size: var(--fs2-caption); color: var(--b2-mute); margin-top: 6px; line-height: 1.45; }

.btn-primary {
  width: 100%;
  height: 52px;
  border: none;
  border-radius: var(--r2-pill);
  background: var(--b2-blue);
  color: var(--b2-on-blue);
  font-family: var(--font-sans);
  font-size: var(--fs2-body); font-weight: 700;
  cursor: pointer;
  transition: background .18s var(--ease2), transform .18s var(--ease2), box-shadow .18s var(--ease2);
  margin-top: 8px;
}
.btn-primary:hover { background: var(--b2-blue-press); box-shadow: var(--sh2-bar); }
.btn-primary:active { transform: scale(.985); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

.msg {
  padding: 12px 16px; border-radius: var(--r2);
  font-size: var(--fs2-sm); margin-bottom: 14px;
  display: none; line-height: 1.5;
  border: 1px solid transparent;
}
.msg.err { background: var(--b2-baja-soft); color: var(--b2-baja); border-color: var(--b2-baja-soft); display: block; }
.msg.ok  { background: var(--b2-bien-soft); color: var(--b2-bien); border-color: var(--b2-bien-soft); display: block; }

.spin {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--b2-spin-track);
  border-top-color: var(--b2-on-blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.legal-check-row {
  display: flex; align-items: flex-start; gap: 12px;
  margin: 18px 0 4px; cursor: pointer;
}
.legal-check-row input[type=checkbox] {
  width: 18px; height: 18px; margin-top: 1px;
  accent-color: var(--b2-blue); cursor: pointer; flex-shrink: 0;
}
.legal-check-row span { font-size: var(--fs2-caption); color: var(--b2-mute); line-height: 1.6; }
.legal-check-row a { color: var(--b2-ink); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
.legal-check-row a:hover { color: var(--b2-blue); }

</style>

<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Broquer — Completa tu perfil</title>
<meta name="theme-color" content="#F6F8FB"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --b2-canvas -->

</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo-area">
      <img src="isotipo-black.png" alt="Broquer"/>
      <h2>Completa tu perfil</h2>
      <p>Solo necesitamos un par de datos para personalizar tu experiencia.</p>
    </div>

    <div class="msg" id="msg"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field" style="margin-bottom:0">
        <label>Nombre(s)</label>
        <input type="text" id="r-nombre" placeholder="Ej. Salvador" autocomplete="given-name"/>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Apellidos</label>
        <input type="text" id="r-apellidos" placeholder="Ej. Bolaños" autocomplete="family-name"/>
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>Teléfono</label>
      <input type="tel" id="r-telefono" placeholder="Ej. 443 123 4567" autocomplete="tel"/>
      <div class="hint">Lo usaremos solo para soporte técnico.</div>
    </div>

    <label class="legal-check-row">
      <input type="checkbox" id="legal-check" onchange="toggleSaveBtn()"/>
      <span>He leído y acepto los <a href="legal.html" target="_blank">Términos y condiciones</a>, el <a href="legal.html" target="_blank">Contrato de suscripción</a> y el <a href="legal.html" target="_blank">Aviso de privacidad</a> de Broquer.</span>
    </label>

    <button class="btn-primary" id="btn-save" onclick="guardar()" disabled>Continuar a Broquer</button>
  </div>
</div>

<script>
const SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
const SB_KEY = 'sb_publishable_EVGLfmHVorBpQQWAh-vypA_hANNk_-i';

function showMsg(t,type='err'){
  const e = document.getElementById('msg');
  e.textContent = t;
  e.className = `msg ${type}`;
}

async function guardar(){
  const nombre    = document.getElementById('r-nombre').value.trim();
  const apellidos = document.getElementById('r-apellidos').value.trim();
  const telefono  = document.getElementById('r-telefono').value.trim();
  const nombreCompleto = apellidos ? nombre + ' ' + apellidos : nombre;
  if(!nombre){ showMsg('Ingresa tu nombre'); return; }
  if(!apellidos){ showMsg('Ingresa tus apellidos'); return; }

  const token = sessionStorage.getItem('sb_token') || localStorage.getItem('sb_token');
  const userRaw = sessionStorage.getItem('sb_user') || localStorage.getItem('sb_user') || '{}';
  let user = {};
  try { user = JSON.parse(userRaw) || {}; } catch(_) {}
  if(!token || !user.id){ window.location.href = 'login.html'; return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  // El trigger SQL ya creó la fila en `usuarios`. Aquí solo actualizamos
  // nombre + telefono. El rol queda en 'agente' por defecto.
  // (Si necesitas convertir a alguien en admin/equipo, hazlo desde el
  //  panel admin — NUNCA desde aquí.)
  const r = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${user.id}`, {
    method: 'PATCH',
    headers:{
      'apikey': SB_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      nombre: nombreCompleto,
      telefono
    })
  });

  if(!r.ok){
    // Fallback (raro): si la fila no existe, hacemos upsert
    const r2 = await fetch(`${SB_URL}/rest/v1/usuarios`, {
      method: 'POST',
      headers:{
        'apikey': SB_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        id: user.id,
        email: user.email,
        nombre: nombreCompleto,
        telefono
      })
    });
    if(!r2.ok){
      const errText = await r2.text();
      console.error('Supabase error:', r2.status, errText);
      showMsg('No pudimos guardar tu perfil. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = 'Continuar a Broquer';
      return;
    }
  }

  showMsg('Perfil guardado.', 'ok');
  setTimeout(() => { window.location.href = 'index.html'; }, 700);
}

function toggleSaveBtn(){
  const checked = document.getElementById('legal-check')?.checked;
  const btn = document.getElementById('btn-save');
  if(btn) btn.disabled = !checked;
}

// Pre-llenar campos si vienen del signup
(function(){
  const savedNombre   = sessionStorage.getItem('reg_nombre') || '';
  const savedTelefono = sessionStorage.getItem('reg_telefono') || '';
  if(savedNombre){
    const parts = savedNombre.trim().split(' ');
    const apellidos = parts.length > 1 ? parts.slice(1).join(' ') : '';
    const nombre = parts[0] || '';
    const nEl = document.getElementById('r-nombre');
    const aEl = document.getElementById('r-apellidos');
    if(nEl) nEl.value = nombre;
    if(aEl) aEl.value = apellidos;
    sessionStorage.removeItem('reg_nombre');
  }
  if(savedTelefono){
    const tEl = document.getElementById('r-telefono');
    if(tEl) tEl.value = savedTelefono;
    sessionStorage.removeItem('reg_telefono');
  }
})();

// Redirect si no hay sesión
if(!(sessionStorage.getItem('sb_token') || localStorage.getItem('sb_token'))){
  window.location.href = 'login.html';
}
</script>
</body>
</html>
