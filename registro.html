<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="brokr-theme.css"/>
<style id="broquer-skin">
  html,body{background:var(--paper)!important;color:var(--ink)!important;font-family:var(--font-sans)!important;letter-spacing:-0.01em}
  *{font-family:var(--font-sans)!important}
  h1,h2,h3,.title,.heading{font-family:var(--font-display)!important;letter-spacing:-0.02em!important;color:var(--ink)!important}
  code,pre,.mono,kbd{font-family:var(--font-mono)!important}
  body, .screen, .panel, .container, .wrap, main { background:var(--paper)!important; color:var(--ink)!important; }
  .card, .ui-card, .box, .module, .pf-card, .stat-pill, .module-card, .cat-module, .profile-section, .activity-item, .news-ticker-wrap, .tile, .section, section, article {
    background:var(--bone)!important; border:1px solid var(--line)!important; border-radius:var(--r-lg)!important;
    color:var(--ink)!important; box-shadow:0 1px 2px rgba(22,22,22,.03)!important;
  }
  input, select, textarea {
    background:var(--bone)!important; border:1px solid var(--line-2)!important; color:var(--ink)!important;
    border-radius:var(--r)!important; font-family:var(--font-sans)!important; font-size:14px!important; padding:10px 12px!important;
    outline:none!important; transition:border-color .2s ease;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--ink)!important; }
  button:not([class]), .btn-primary {
    background:var(--ink)!important; color:var(--paper)!important;
    border:none!important; border-radius:var(--r)!important;
    padding:11px 18px!important; font-weight:600!important; cursor:pointer!important;
    font-size:14px!important;
  }
  button:not([class]):hover, .btn-primary:hover { opacity:.92!important; }
  a { color:var(--ink)!important; text-decoration:none; }
  a:hover { color:var(--forest)!important; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:3px; }
</style>

<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Broquer — Completa tu perfil</title>
<meta name="theme-color" content="#05203C"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:460px;background:var(--bone);border:1px solid var(--line);border-radius:20px;padding:40px 36px 36px;box-shadow:0 4px 24px rgba(0,0,0,.05);animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.logo-area{text-align:center;margin-bottom:32px}
.logo-area img{height:40px}
.logo-area h2{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:12px;color:var(--ink);letter-spacing:-0.02em}
.logo-area p{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.8px;margin-bottom:6px}
.field input{width:100%}
.field .hint{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.4}
.btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:8px}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5}
.msg.err{background:rgba(231,8,102,.08);border:1px solid rgba(231,8,102,.25);color:#E70866;display:block}
.msg.ok {background:rgba(0,98,227,.08); border:1px solid rgba(0,98,227,.25); color:#0062E3;display:block}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--paper);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legal-check-row{display:flex;align-items:flex-start;gap:12px;margin:18px 0 4px;cursor:pointer}
.legal-check-row input[type=checkbox]{width:18px;height:18px;margin-top:1px;accent-color:var(--ink);cursor:pointer;flex-shrink:0}
.legal-check-row span{font-size:12px;color:var(--mute);line-height:1.6}
.legal-check-row a{color:var(--ink);text-decoration:none;font-weight:600}
.legal-check-row a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo-area">
      <img src="isotipo-black.png" alt="Broquer"/>
      <h2>Completa tu perfil</h2>
      <p>Solo necesitamos un par de datos para personalizar tu experiencia.</p>
    </div>

    <div class="msg" id="msg"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field" style="margin-bottom:0">
        <label>Nombre(s)</label>
        <input type="text" id="r-nombre" placeholder="Ej. Salvador" autocomplete="given-name"/>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Apellidos</label>
        <input type="text" id="r-apellidos" placeholder="Ej. Bolaños" autocomplete="family-name"/>
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>Teléfono</label>
      <input type="tel" id="r-telefono" placeholder="Ej. 443 123 4567" autocomplete="tel"/>
      <div class="hint">Lo usaremos solo para soporte técnico.</div>
    </div>

    <label class="legal-check-row">
      <input type="checkbox" id="legal-check" onchange="toggleSaveBtn()"/>
      <span>He leído y acepto los <a href="legal.html" target="_blank">Términos y condiciones</a>, el <a href="legal.html" target="_blank">Contrato de suscripción</a> y el <a href="legal.html" target="_blank">Aviso de privacidad</a> de Broquer.</span>
    </label>

    <button class="btn-primary" id="btn-save" onclick="guardar()" disabled>Continuar a Broquer</button>
  </div>
</div>

<script>
const SB_URL = 'https://urtgysmtnvoqaljuhntz.supabase.co';
const SB_KEY = 'sb_publishable_EVGLfmHVorBpQQWAh-vypA_hANNk_-i';

function showMsg(t,type='err'){
  const e = document.getElementById('msg');
  e.textContent = t;
  e.className = `msg ${type}`;
}

async function guardar(){
  const nombre    = document.getElementById('r-nombre').value.trim();
  const apellidos = document.getElementById('r-apellidos').value.trim();
  const telefono  = document.getElementById('r-telefono').value.trim();
  const nombreCompleto = apellidos ? nombre + ' ' + apellidos : nombre;
  if(!nombre){ showMsg('Ingresa tu nombre'); return; }
  if(!apellidos){ showMsg('Ingresa tus apellidos'); return; }

  const token = sessionStorage.getItem('sb_token') || localStorage.getItem('sb_token');
  const userRaw = sessionStorage.getItem('sb_user') || localStorage.getItem('sb_user') || '{}';
  let user = {};
  try { user = JSON.parse(userRaw) || {}; } catch(_) {}
  if(!token || !user.id){ window.location.href = 'login.html'; return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  // El trigger SQL ya creó la fila en `usuarios`. Aquí solo actualizamos
  // nombre + telefono. El rol queda en 'agente' por defecto.
  // (Si necesitas convertir a alguien en admin/equipo, hazlo desde el
  //  panel admin — NUNCA desde aquí.)
  const r = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${user.id}`, {
    method: 'PATCH',
    headers:{
      'apikey': SB_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      nombre: nombreCompleto,
      telefono
    })
  });

  if(!r.ok){
    // Fallback (raro): si la fila no existe, hacemos upsert
    const r2 = await fetch(`${SB_URL}/rest/v1/usuarios`, {
      method: 'POST',
      headers:{
        'apikey': SB_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        id: user.id,
        email: user.email,
        nombre: nombreCompleto,
        telefono
      })
    });
    if(!r2.ok){
      const errText = await r2.text();
      console.error('Supabase error:', r2.status, errText);
      showMsg('No pudimos guardar tu perfil. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = 'Continuar a Broquer';
      return;
    }
  }

  showMsg('Perfil guardado.', 'ok');
  setTimeout(() => { window.location.href = 'index.html'; }, 700);
}

function toggleSaveBtn(){
  const checked = document.getElementById('legal-check')?.checked;
  const btn = document.getElementById('btn-save');
  if(btn) btn.disabled = !checked;
}

// Pre-llenar campos si vienen del signup
(function(){
  const savedNombre   = sessionStorage.getItem('reg_nombre') || '';
  const savedTelefono = sessionStorage.getItem('reg_telefono') || '';
  if(savedNombre){
    const parts = savedNombre.trim().split(' ');
    const apellidos = parts.length > 1 ? parts.slice(1).join(' ') : '';
    const nombre = parts[0] || '';
    const nEl = document.getElementById('r-nombre');
    const aEl = document.getElementById('r-apellidos');
    if(nEl) nEl.value = nombre;
    if(aEl) aEl.value = apellidos;
    sessionStorage.removeItem('reg_nombre');
  }
  if(savedTelefono){
    const tEl = document.getElementById('r-telefono');
    if(tEl) tEl.value = savedTelefono;
    sessionStorage.removeItem('reg_telefono');
  }
})();

// Redirect si no hay sesión
if(!(sessionStorage.getItem('sb_token') || localStorage.getItem('sb_token'))){
  window.location.href = 'login.html';
}
</script>
</body>
</html>
