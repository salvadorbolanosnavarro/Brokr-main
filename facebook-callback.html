<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="isotipo-black.png"/>
  <link rel="apple-touch-icon" href="isotipo-black.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Conectando con Facebook…</title>
  <link rel="stylesheet" href="brokr-theme.css"/>
  <style>
    body {
      background: var(--paper);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: var(--bone);
      border: 1px solid var(--line-2);
      border-radius: var(--r-xl);
      padding: 48px 36px 40px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(10,10,10,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2.5px solid var(--line-3);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin-bottom: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }
    .status-icon.ok  { background: var(--success-soft); color: var(--success); }
    .status-icon.err { background: var(--danger-soft);  color: var(--danger);  }
    .status-icon svg { width: 22px; height: 22px; stroke-width: 2.5; }

    .title {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -.01em;
    }
    .sub {
      font-size: var(--fs-sm);
      color: var(--mute);
      margin-top: -4px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <div class="title">Conectando con Facebook…</div>
    <div class="sub">Esta ventana se cerrará sola.</div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');
      const card   = document.getElementById('card');

      function showOk() {
        card.innerHTML = `
          <div class="status-icon ok">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="title">¡Facebook conectado!</div>
          <div class="sub">Cerrando ventana…</div>`;
        setTimeout(() => window.close(), 1200);
      }

      function showErr(msg) {
        card.innerHTML = `
          <div class="status-icon err">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="title">${msg || 'Error al conectar'}</div>
          <div class="sub">Cerrando ventana…</div>`;
        setTimeout(() => window.close(), 3000);
      }

      if (error) { showErr('Permiso cancelado.'); return; }
      if (!code)  { showErr('No se recibió el código de autorización.'); return; }

      if (window.opener && typeof window.opener._fbOAuthHandler === 'function') {
        window.opener._fbOAuthHandler(code)
          .then(() => showOk())
          .catch(() => showErr('Error al guardar la conexión.'));
      } else {
        showOk();
      }
    })();
  </script>
</body>
</html>
