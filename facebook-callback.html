<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Conectando con Facebook…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1829;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1a2540;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 340px;
      width: 100%;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(42,157,181,0.3);
      border-top-color: #2a9db5;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .sub   { font-size: 13px; color: #8a94a8; }
    .icon-ok  { font-size: 40px; margin-bottom: 16px; }
    .icon-err { font-size: 40px; margin-bottom: 16px; }
    .msg-ok  { color: #1D9E75; font-size: 15px; font-weight: 600; }
    .msg-err { color: #E24B4A; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <div class="title">Conectando con Facebook…</div>
    <div class="sub">Esta ventana se cerrará sola.</div>
  </div>

  <script>
    (function () {
      // Leer el "code" que Facebook manda en la URL
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');
      const card   = document.getElementById('card');

      function showOk() {
        card.innerHTML = '<div class="icon-ok">✓</div><div class="msg-ok">¡Facebook conectado!</div>';
        setTimeout(() => window.close(), 1200);
      }

      function showErr(msg) {
        card.innerHTML = '<div class="icon-err">✗</div><div class="msg-err">' + (msg || 'Error al conectar') + '</div>';
        setTimeout(() => window.close(), 3000);
      }

      if (error) {
        // El usuario canceló el permiso o hubo error de Meta
        showErr('Permiso cancelado.');
        return;
      }

      if (!code) {
        showErr('No se recibió el código de autorización.');
        return;
      }

      // Mandar el code a la ventana padre (app-shell.js lo procesa con _fbOAuthHandler)
      if (window.opener && typeof window.opener._fbOAuthHandler === 'function') {
        window.opener._fbOAuthHandler(code)
          .then(() => showOk())
          .catch(() => showErr('Error al guardar la conexión.'));
      } else {
        // Fallback: si el opener ya no está disponible (raro), cerrar sin error
        showOk();
      }
    })();
  </script>
</body>
</html>
