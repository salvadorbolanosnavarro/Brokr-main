<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="isotipo-black.png"/>
  <link rel="apple-touch-icon" href="isotipo-black.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#081C4E"/><!-- AUDIT-EXEMPT-LINE: meta no acepta var(); espejo de --sky-navy -->
  <title>Conectando con Facebook…</title>
  <link rel="stylesheet" href="brokr-theme.css"/>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--sp-5);
      background:
        radial-gradient(circle at 50% 0%, var(--sky-canvas), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      text-align: center;
    }
    .card {
      width: min(100%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-8) var(--sp-7);
      background: var(--glass-bg);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line-2);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin-bottom: var(--sp-1);
      border: 3px solid var(--sky-canvas);
      border-top-color: var(--sky-blue);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.5s; } }
    .status-icon {
      width: var(--h);
      height: var(--h);
      display: grid;
      place-items: center;
      margin-bottom: var(--sp-1);
      border-radius: var(--r-pill);
    }
    .status-icon.ok  { background: var(--success-soft); color: var(--success); }
    .status-icon.err { background: var(--danger-soft); color: var(--danger); }
    .status-icon svg { width: 22px; height: 22px; stroke-width: 2.5; }
    .title {
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .sub { margin-top: calc(var(--sp-1) * -1); font-size: var(--fs-sm); color: var(--mute); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <div class="title">Conectando con Facebook…</div>
    <div class="sub">Esta ventana se cerrará sola.</div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');
      const card   = document.getElementById('card');

      function showOk() {
        card.innerHTML = `
          <div class="status-icon ok">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="title">¡Facebook conectado!</div>
          <div class="sub">Cerrando ventana…</div>`;
        setTimeout(() => window.close(), 1200);
      }

      function showErr(msg) {
        card.innerHTML = `
          <div class="status-icon err">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="title">${msg || 'Error al conectar'}</div>
          <div class="sub">Cerrando ventana…</div>`;
        setTimeout(() => window.close(), 3000);
      }

      if (error) { showErr('Permiso cancelado.'); return; }
      if (!code)  { showErr('No se recibió el código de autorización.'); return; }

      if (window.opener && typeof window.opener._fbOAuthHandler === 'function') {
        window.opener._fbOAuthHandler(code)
          .then(() => showOk())
          .catch(() => showErr('Error al guardar la conexión.'));
      } else {
        showOk();
      }
    })();
  </script>
</body>
</html>
