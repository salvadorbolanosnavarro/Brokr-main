<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="isotipo-black.png"/>
<link rel="apple-touch-icon" href="isotipo-black.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Contactos · Broquer</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#F7F5EE"/>
<link rel="stylesheet" href="brokr-theme.css"/>
<style>
html, body { background: var(--paper); }

/* ── Sidebar nav (desktop) — owned by app-shell.js ─ */
.app-shell { display: flex; height: 100vh; }
.app-sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 22px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
@media (max-width: 880px) { .app-sidebar { display: none; } }
.app-sidebar__brand {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
  padding: 6px 10px 22px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.app-sidebar__brand .dot { color: var(--forest); }
.app-nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r);
  font-size: 14px; color: var(--ink-2);
  cursor: pointer; transition: background var(--dur) var(--ease);
  font-weight: 500;
  letter-spacing: -0.005em;
}
.app-nav-link:hover { background: var(--paper-2); }
.app-nav-link.is-active { background: var(--ink); color: var(--paper); }
.app-nav-link svg { flex-shrink: 0; opacity: .8; }
.app-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Top bar */
.page-head {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 18px 36px 0;
  position: sticky; top: 0; z-index: 12;
}
@media (max-width: 720px) { .page-head { padding: 12px 16px 0; } }

.page-head__crumbs {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--mute);
  margin-bottom: 12px;
}
.page-head__crumbs a { color: var(--mute); }
.page-head__crumbs a:hover { color: var(--ink); }

.page-head__row {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.page-head h1 {
  font-family: var(--font-display);
  font-size: 36px; font-weight: 600;
  letter-spacing: -0.03em; flex: 1;
}
@media (max-width: 720px) { .page-head h1 { font-size: 26px; } }
.page-head__count {
  font-family: var(--font-mono);
  font-size: 12px; color: var(--mute);
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  padding: 4px 10px;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

.head-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  padding: 0 16px; height: 42px;
  margin-bottom: 14px;
  max-width: 520px;
}
.head-search input { flex: 1; background: none; border: none; outline: none; font-size: 14px; font-family: inherit; color: var(--ink); letter-spacing: -0.005em; }
.head-search input::placeholder { color: var(--mute-2); }

.tabs {
  display: flex; gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0;
}
.tabs::-webkit-scrollbar { display: none; }
.ftab {
  flex-shrink: 0;
  border: none; background: none;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--mute);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  letter-spacing: -0.005em;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.ftab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.ftab:hover { color: var(--ink); }

/* List */
.list { padding: 16px 36px 120px; display: flex; flex-direction: column; gap: 0; }
@media (max-width: 720px) { .list { padding: 8px 16px 120px; } }

.contact-card {
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  margin-bottom: 8px;
}
.contact-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.contact-card:active { transform: scale(.99); }
.contact-card.picker-mode { border-color: var(--forest-soft); }
.contact-card.picker-mode:hover { border-color: var(--forest); background: var(--forest-soft); }

.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  color: var(--paper);
  flex-shrink: 0;
  letter-spacing: -0.01em;
}
.av-1 { background: #2D2A26; }
.av-2 { background: #5C5852; }
.av-3 { background: #1F8A5B; }
.av-4 { background: #B07A3E; }
.av-5 { background: #9B3B3B; }
.av-6 { background: #2C5F8D; }
.av-7 { background: #1A2744; }
.av-8 { background: #3A6B47; }

.contact-info { flex: 1; min-width: 0; }
.contact-name {
  font-size: 15px; font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.contact-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 3px;
  flex-wrap: wrap;
}
.role-badge {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  background: var(--paper-2);
  color: var(--ink-2);
}
.contact-sub { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

.rb-arrendador { background: oklch(94% .03 220); color: oklch(40% .08 220); }
.rb-arrendatario { background: oklch(94% .025 250); color: oklch(40% .09 260); }
.rb-comprador { background: oklch(94% .04 70); color: oklch(40% .11 60); }
.rb-vendedor { background: var(--forest-soft); color: var(--forest); }
.rb-obligado_solidario { background: oklch(94% .04 320); color: oklch(40% .12 320); }
.rb-colega { background: oklch(94% .04 40); color: oklch(40% .12 40); }
.rb-notario { background: oklch(94% .03 200); color: oklch(40% .08 200); }
.rb-otro { background: var(--paper-2); color: var(--ink-2); }

.quick-acts { display: flex; gap: 6px; flex-shrink: 0; }
.qa {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ink-2);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  text-decoration: none;
  font-size: 14px;
}
.qa:hover { border-color: var(--forest); color: var(--forest); }
.qa-wa:hover { border-color: #25D366; background: #25D36610; }

/* Empty */
.empty { text-align: center; padding: 64px 24px; color: var(--mute); }
.empty svg { margin-bottom: 16px; opacity: .25; }
.empty strong { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--ink); margin-bottom: 8px; letter-spacing: -0.02em; }
.empty p { font-size: 14px; line-height: 1.55; max-width: 320px; margin: 0 auto; }

/* Picker banner */
.picker-banner {
  display: none;
  background: var(--ink); color: var(--paper);
  padding: 10px 20px;
  text-align: center;
  font-size: 12px; font-weight: 500;
  letter-spacing: -0.005em;
  position: sticky; top: 0; z-index: 30;
}
.picker-banner.show { display: block; }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper);
  padding: 10px 18px;
  border-radius: var(--r-pill);
  font-size: 13px; font-weight: 500;
  opacity: 0;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: -0.005em;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Overlay sheets */
.overlay {
  position: fixed; inset: 0;
  background: rgba(33, 30, 28, .5);
  z-index: 100;
  display: none;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(6px);
}
.overlay.open { display: flex; }
.sheet {
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 720px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  animation: slideUp .3s var(--ease);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@media (min-width: 640px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: var(--r-xl); max-height: 86vh; }
  @keyframes slideUp { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
}
.handle {
  width: 40px; height: 4px;
  background: var(--line-2);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
@media (min-width: 640px) { .handle { display: none; } }
.sheet-header {
  display: flex; align-items: center;
  padding: 18px 24px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sheet-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.025em;
  flex: 1;
}
.close-btn {
  width: 32px; height: 32px;
  border: none;
  background: var(--bone);
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
}
.close-btn:hover { background: var(--paper-2); }
.sheet-body { flex: 1; overflow-y: auto; padding: 22px 24px; }

/* Form */
.sec-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--mute);
  margin: 22px 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.sec-lbl:first-child { margin-top: 0; }
.sec-lbl::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.f label {
  font-size: 12px; font-weight: 500;
  color: var(--ink-2);
  letter-spacing: -0.005em;
}
.f input, .f select, .f textarea {
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 11px 13px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  width: 100%;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  -webkit-appearance: none;
}
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--ink); background: var(--paper); }
.f textarea { resize: vertical; min-height: 78px; line-height: 1.5; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.frow.three { grid-template-columns: 1fr 1fr 1fr; }
.col-2 { grid-column: 1 / 3; }

.sexo-row { display: flex; gap: 6px; margin-top: 2px; }
.sexo-opt {
  flex: 1; padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--bone);
  color: var(--mute);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
  text-align: center;
}
.sexo-opt.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }

.btn-primary, .btn-del {
  height: 46px; padding: 0 20px;
  border: none;
  border-radius: var(--r);
  font-family: inherit;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.005em;
  transition: opacity var(--dur) var(--ease), background var(--dur) var(--ease);
}
.btn-primary { flex: 1; background: var(--ink); color: var(--paper); }
.btn-primary:hover { opacity: .9; }
.btn-del {
  background: var(--paper);
  color: var(--danger);
  border: 1px solid oklch(85% .04 25);
}
.btn-del:hover { background: oklch(96% .015 25); }

/* Detail sheet */
.det-hero {
  display: flex; align-items: center; gap: 16px;
  padding: 22px 24px 20px;
  border-bottom: 1px solid var(--line);
}
.det-av {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 600;
  color: var(--paper);
  flex-shrink: 0;
  letter-spacing: -0.02em;
}
.det-hero-info { flex: 1; min-width: 0; }
.det-name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 6px;
}
.det-body { flex: 1; overflow-y: auto; padding: 18px 24px 22px; }
.det-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  gap: 14px;
}
.det-row:last-child { border-bottom: none; }
.det-lbl {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--mute);
  text-transform: uppercase; letter-spacing: 0.14em;
  flex-shrink: 0;
  padding-top: 2px;
}
.det-val { font-size: 14px; color: var(--ink); text-align: right; line-height: 1.5; letter-spacing: -0.005em; }
.det-val a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.det-val a:hover { text-decoration-color: var(--forest); }
.det-acts {
  display: flex; gap: 8px;
  padding: 14px 24px;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.det-btn {
  flex: 1;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--bone);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  letter-spacing: -0.005em;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.det-btn:hover { border-color: var(--ink); }
.det-btn.navy { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.nota-box {
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.55;
  margin-top: 6px;
}
.op-item {
  display: flex; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}
.op-item:last-child { border-bottom: none; }
.op-ico {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--forest-soft);
  color: var(--forest);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.op-desc { font-size: 13px; color: var(--ink); font-weight: 500; }
.op-date { font-size: 11px; color: var(--mute); margin-top: 2px; font-family: var(--font-mono); letter-spacing: 0.04em; }

/* Bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bone);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  display: flex;
  justify-content: space-around;
}
.bn-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px;
  font-size: 10px;
  color: var(--mute);
  text-decoration: none;
  font-weight: 500;
}
.bn-item.is-active { color: var(--ink); }

/* Floating "new" button */
.fab {
  position: fixed; right: 20px; bottom: 90px;
  z-index: 50;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ink); color: var(--paper);
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: var(--sh-2);
  transition: transform var(--dur) var(--ease);
}
.fab:hover { transform: scale(1.05); }
@media (min-width: 880px) { .fab { display: none; } }

.add-btn {
  background: var(--ink); color: var(--paper);
  border: none;
  border-radius: var(--r-pill);
  height: 38px; padding: 0 16px;
  font-family: inherit;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  letter-spacing: -0.005em;
}
.add-btn:hover { opacity: .9; }
@media (max-width: 720px) { .add-btn { display: none; } }
/* Import dropdown — built into the Importar button */
.import-btn {
  background: var(--bone); color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  height: 38px; padding: 0 16px;
  font-family: inherit;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  letter-spacing: -0.005em;
  position: relative;
}
.import-btn:hover { border-color: var(--line-2); background: var(--paper-2); }
@media (max-width: 720px) { .import-btn { display: none; } }

.import-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-2);
  z-index: 300;
  min-width: 200px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.import-menu.open { display: flex; }
.import-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  font-size: 13px; font-weight: 500;
  color: var(--ink);
  border: none; background: none;
  font-family: inherit;
  text-align: left;
  letter-spacing: -0.005em;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.import-opt:last-child { border-bottom: none; }
.import-opt:hover { background: var(--bone); }
.import-opt__ico {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}
.import-opt__sub { font-size: 11px; color: var(--mute); margin-top: 1px; font-weight: 400; }

/* Progress sheet */
.import-progress-wrap { padding: 20px 24px; }
.progress-bar-wrap {
  height: 5px; border-radius: 3px;
  background: var(--bone); margin: 10px 0 5px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 3px;
  background: var(--forest); transition: width .3s ease; width: 0%;
}
.import-log {
  font-family: var(--font-mono); font-size: 11px; color: var(--mute);
  max-height: 160px; overflow-y: auto; margin-top: 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.import-log-line.ok { color: var(--forest); }
.import-log-line.skip { color: var(--mute); }
.import-log-line.err { color: oklch(50% .18 30); }

</style>
</head>
<body data-app="contactos">

<!-- shell-replaced-sidebar -->
<div style="display:none" hidden>
  <aside class="app-sidebar">
    <div class="app-sidebar__brand">Broquer<span class="dot">.</span></div>
    <a class="app-nav-link" href="index.html">Inicio</a>
    <a class="app-nav-link" href="propiedades.html">Inmuebles</a>
    <a class="app-nav-link is-active" href="contactos.html">Contactos</a>
    <a class="app-nav-link" href="contratos.html">Contratos</a>
    <a class="app-nav-link" href="avm.html">AVM</a>
  </aside>
</div>

<div class="picker-banner" id="picker-banner">
  Seleccionando contacto · toca el que quieres usar
</div>

<header class="page-head">
  <div class="page-head__row">
    <span class="page-head__count" id="count-badge" style="display:none">0</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="add-btn" id="add-btn-top" onclick="abrirModal()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        Nuevo contacto
      </button>
      <div style="position:relative">

<script>
let sexoActual = 'M';
let editandoId = null;
let detContacto = null;
let filtroActual = 'todos';

const params = new URLSearchParams(location.search);
const IS_PICKER = params.get('picker') === '1';
const PICKER_TIPO = params.get('tipo') || '';

if (IS_PICKER) {
  document.getElementById('picker-banner').classList.add('show');
  document.getElementById('add-btn-top').style.display = 'none';
  if (PICKER_TIPO) {
    const tabMap = {arrendador:'Propietarios',arrendatario:'Inquilinos',comprador:'Compradores',vendedor:'Vendedores',colega:'Colegas',notario:'Notarios'};
    filtroActual = PICKER_TIPO;
    document.querySelectorAll('.ftab').forEach(b => {
      b.classList.toggle('active', b.textContent === (tabMap[PICKER_TIPO]||'Todos'));
    });
  }
}

function gv(id) { return (document.getElementById(id)?.value || '').trim(); }
function sv(id, v) { const el = document.getElementById(id); if (el) el.value = v || ''; }

/* ── Conexión a Supabase ─────────────────────────────────────────
   Usamos el helper window.brokrSb expuesto por app-shell.js.
   Ese helper renueva el token automáticamente si está por expirar. */
const LS_CACHE = 'brokr_contactos_cache';   // solo cache offline, NO fuente de verdad
let _contactosMem = [];

/* Espera a que app-shell.js termine de cargar y exponga window.brokrSb */
function _sb() {
  if (!window.brokrSb) throw new Error('La app aún se está cargando. Intenta de nuevo en un segundo.');
  return window.brokrSb;
}
async function _userId() {
  const sb = _sb();
  const tok = await sb.ensureToken();
  if (!tok) return null;
  try {
    const r = await fetch(sb.url + '/auth/v1/user', {
      headers: { apikey: sb.key, Authorization: 'Bearer ' + tok }
    });
    if (!r.ok) return null;
    const u = await r.json();
    return u?.id || null;
  } catch { return null; }
}

/* Trae todos los contactos del usuario logueado, ordenados por updated_at desc */
async function cargarRemoto() {
  const r = await _sb().fetch('rest/v1/contactos?select=*&order=updated_at.desc');
  if (!r.ok) throw new Error('No se pudieron cargar los contactos (' + r.status + ')');
  const data = await r.json();
  _contactosMem = Array.isArray(data) ? data : [];
  try { localStorage.setItem(LS_CACHE, JSON.stringify(_contactosMem)); } catch {}
  return _contactosMem;
}

/* Versión sincrónica: devuelve la copia en memoria (para el render rápido) */
function cargar() { return _contactosMem; }

/* Inserta o actualiza un contacto en Supabase */
async function upsertRemoto(contacto) {
  const uid = await _userId();
  if (!uid) throw new Error('Sesión expirada. Vuelve a iniciar sesión.');
  const payload = Object.assign({}, contacto, { user_id: uid });
  const r = await _sb().fetch('rest/v1/contactos?on_conflict=id', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=representation',
    },
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    const txt = await r.text().catch(()=> '');
    throw new Error('Supabase: ' + r.status + ' ' + txt);
  }
  return r.json();
}

/* Elimina un contacto del servidor */
async function eliminarRemoto(id) {
  const r = await _sb().fetch('rest/v1/contactos?id=eq.' + encodeURIComponent(id), {
    method: 'DELETE',
  });
  if (!r.ok && r.status !== 204) {
    const txt = await r.text().catch(()=> '');
    throw new Error('Supabase: ' + r.status + ' ' + txt);
  }
}

const ROLES = {
  arrendador:         { lbl:'Propietario', cls:'rb-arrendador' },
  arrendatario:       { lbl:'Inquilino', cls:'rb-arrendatario' },
  comprador:          { lbl:'Comprador', cls:'rb-comprador' },
  vendedor:           { lbl:'Vendedor', cls:'rb-vendedor' },
  obligado_solidario: { lbl:'Oblig. solidario', cls:'rb-obligado_solidario' },
  colega:             { lbl:'Colega', cls:'rb-colega' },
  notario:            { lbl:'Notario', cls:'rb-notario' },
  otro:               { lbl:'Otro', cls:'rb-otro' },
};

function rolBadge(tipo) {
  const r = ROLES[tipo] || ROLES.otro;
  return `<span class="role-badge ${r.cls}">${r.lbl}</span>`;
}

function avColor(nombre) {
  let h = 0;
  for (let i = 0; i < nombre.length; i++) h = (h * 31 + nombre.charCodeAt(i)) | 0;
  return `av-${(Math.abs(h) % 8) + 1}`;
}

function initials(nombre) {
  const p = nombre.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0] + p[1][0]).toUpperCase() : nombre.slice(0,2).toUpperCase();
}

function domicilio(c) {
  const parts = [];
  if (c.calle) parts.push(c.calle + (c.num_ext ? ' No. ' + c.num_ext : '') + (c.num_int ? ' Int. ' + c.num_int : ''));
  if (c.colonia) parts.push('Col. ' + c.colonia);
  if (c.cp) parts.push('C.P. ' + c.cp);
  if (c.mpio) parts.push(c.mpio);
  return parts.join(', ');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function renderLista() {
  const todos = cargar();
  const q = gv('search-input').toLowerCase();
  const filtrados = todos.filter(c => {
    const okTipo = filtroActual === 'todos' || c.tipo === filtroActual;
    const okQ = !q || [c.nombre, c.telefono, c.email, c.empresa].some(v => (v||'').toLowerCase().includes(q));
    return okTipo && okQ;
  });
  document.getElementById('count-badge').textContent = todos.length;
  const lista = document.getElementById('lista');
  if (!filtrados.length) {
    lista.innerHTML = `<div class="empty">
      <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <strong>${(q || filtroActual !== 'todos') ? 'Sin resultados' : 'Aún no hay contactos'}</strong>
      <p>${(q || filtroActual !== 'todos') ? 'Prueba con otros términos o cambia el filtro.' : 'Agrega tu primer contacto con el botón Nuevo.'}</p>
    </div>`;
    return;
  }
  lista.innerHTML = filtrados.map(c => {
    const sub = c.telefono || c.email || c.empresa || '';
    const pickerCls = IS_PICKER ? ' picker-mode' : '';
    const clickFn = IS_PICKER ? `seleccionarContacto('${c.id}')` : `abrirDetalle('${c.id}')`;
    return `<div class="contact-card${pickerCls}" onclick="${clickFn}">
      <div class="avatar ${avColor(c.nombre)}">${initials(c.nombre)}</div>
      <div class="contact-info">
        <div class="contact-name">${c.nombre}</div>
        <div class="contact-meta">${rolBadge(c.tipo)}<span class="contact-sub">${sub}</span></div>
      </div>
      ${!IS_PICKER ? `<div class="quick-acts" onclick="event.stopPropagation()">
        ${(c.telefono||c.wa) ? `<a class="qa qa-wa" href="https://wa.me/52${(c.wa||c.telefono).replace(/\D/g,'')}" target="_blank" title="WhatsApp"><svg width="16" height="16" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path fill="#25D366" d="M16 0C7.163 0 0 7.163 0 16c0 2.823.736 5.474 2.029 7.776L0 32l8.42-2.207A15.9 15.9 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0z"/><path fill="#FFF" d="M23.45 19.2c-.39-.196-2.31-1.142-2.668-1.273-.358-.13-.618-.196-.878.196-.26.39-1.008 1.272-1.236 1.532-.228.26-.456.293-.846.098-.39-.196-1.65-.61-3.143-1.94-1.162-1.037-1.948-2.318-2.176-2.708-.228-.39-.024-.6.171-.795.176-.175.39-.456.586-.683.196-.228.26-.39.39-.65.13-.26.065-.488-.033-.683-.098-.196-.878-2.117-1.203-2.9-.317-.762-.64-.66-.879-.672-.227-.012-.487-.014-.747-.014-.26 0-.683.098-1.04.488-.358.39-1.366 1.336-1.366 3.257 0 1.92 1.398 3.778 1.594 4.038.195.26 2.752 4.203 6.667 5.893.93.402 1.657.642 2.223.821.934.297 1.785.255 2.457.155.75-.112 2.31-.945 2.636-1.857.325-.911.325-1.692.228-1.857-.098-.165-.358-.26-.748-.456z"/></svg></a>` : ''}
        ${c.telefono ? `<a class="qa" href="tel:${c.telefono}" title="Llamar"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg></a>` : ''}
      </div>` : '<div style="color:var(--forest);font-size:12px;font-weight:600;font-family:var(--font-mono);letter-spacing:.06em">SELECCIONAR →</div>'}
    </div>`;
  }).join('');
}

function seleccionarContacto(id) {
  const c = cargar().find(x => x.id === id);
  if (!c) return;
  window.parent.postMessage({ tipo: 'brokr_contacto_seleccionado', contacto: c }, '*');
  if (window.opener) window.opener.postMessage({ tipo: 'brokr_contacto_seleccionado', contacto: c }, '*');
}

function setFiltro(tipo, btn) {
  filtroActual = tipo;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLista();
}

function setSexo(s, btn) {
  sexoActual = s;
  document.querySelectorAll('.sexo-opt').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function abrirModal(id = null) {
  editandoId = id;
  if (id) {
    const c = cargar().find(x => x.id === id);
    if (!c) return;
    document.getElementById('modal-title').textContent = 'Editar contacto';
    sv('m-nombre', c.nombre); sv('m-tel', c.telefono); sv('m-wa', c.wa || c.whatsapp);
    sv('m-email', c.email); sv('m-empresa', c.empresa);
    sv('m-calle', c.calle); sv('m-numext', c.num_ext); sv('m-numint', c.num_int);
    sv('m-colonia', c.colonia); sv('m-cp', c.cp); sv('m-mpio', c.mpio);
    sv('m-notas', c.notas);
    document.getElementById('m-tipo').value = c.tipo || 'arrendador';
    const sx = c.sexo || 'M';
    sexoActual = sx;
    document.querySelectorAll('.sexo-opt').forEach(b => b.classList.toggle('active', b.dataset.s === sx));
    document.getElementById('btn-del').style.display = 'block';
  } else {
    document.getElementById('modal-title').textContent = 'Nuevo contacto';
    ['m-nombre','m-tel','m-wa','m-email','m-empresa','m-calle','m-numext','m-numint','m-colonia','m-cp','m-notas'].forEach(i => sv(i,''));
    sv('m-mpio','MORELIA, MICHOACÁN');
    document.getElementById('m-tipo').value = 'arrendador';
    sexoActual = 'M';
    document.querySelectorAll('.sexo-opt').forEach(b => b.classList.toggle('active', b.dataset.s === 'M'));
    document.getElementById('btn-del').style.display = 'none';
  }
  document.getElementById('modal-ov').classList.add('open');
  setTimeout(() => document.getElementById('m-nombre').focus(), 100);
}

function cerrarModal() { document.getElementById('modal-ov').classList.remove('open'); editandoId = null; }

async function guardarContacto() {
  const nombre = gv('m-nombre');
  const tel    = gv('m-tel');
  if (!nombre) { alert('El nombre es obligatorio.'); document.getElementById('m-nombre').focus(); return; }
  if (!tel)    { alert('El teléfono es obligatorio.'); document.getElementById('m-tel').focus(); return; }

  const ahora = new Date().toISOString();
  const datos = {
    nombre: nombre.toUpperCase(),
    telefono: tel,
    wa: gv('m-wa'),
    email: gv('m-email').toLowerCase(),
    tipo: document.getElementById('m-tipo').value,
    sexo: sexoActual,
    empresa: gv('m-empresa'),
    calle: gv('m-calle'),
    num_ext: gv('m-numext'),
    num_int: gv('m-numint'),
    colonia: gv('m-colonia'),
    cp: gv('m-cp'),
    mpio: gv('m-mpio'),
    notas: gv('m-notas'),
    updated_at: ahora,
  };

  if (editandoId) {
    datos.id = editandoId;
    // Conservar operaciones existentes
    const previo = _contactosMem.find(c => c.id === editandoId);
    if (previo && previo.operaciones) datos.operaciones = previo.operaciones;
  } else {
    datos.id = 'c_' + Date.now();
    datos.created_at = ahora;
    datos.operaciones = [];
  }

  // Bloquear botón mientras guarda
  const btn = document.querySelector('#modal-ov .btn-primary');
  const prevTxt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  try {
    await upsertRemoto(datos);
    await cargarRemoto();
    cerrarModal();
    renderLista();
    showToast(editandoId ? 'Contacto actualizado' : 'Contacto guardado');
  } catch (e) {
    alert('No se pudo guardar el contacto.\n\n' + (e.message || e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = prevTxt; }
  }
}

async function confirmarEliminar() {
  if (!editandoId) return;
  if (!confirm('¿Eliminar este contacto? Esta acción no se puede deshacer.')) return;
  try {
    await eliminarRemoto(editandoId);
    await cargarRemoto();
    cerrarModal();
    cerrarDetalle();
    renderLista();
    showToast('Contacto eliminado');
  } catch (e) {
    alert('No se pudo eliminar el contacto.\n\n' + (e.message || e));
  }
}

function abrirDetalle(id) {
  const c = cargar().find(x => x.id === id);
  if (!c) return;
  detContacto = c;
  const av = document.getElementById('det-av');
  av.textContent = initials(c.nombre);
  av.className = `det-av ${avColor(c.nombre)}`;
  document.getElementById('det-nombre').textContent = c.nombre;
  document.getElementById('det-badge').innerHTML = rolBadge(c.tipo);
  document.getElementById('det-empresa').textContent = c.empresa || '';
  const wa = c.wa || c.telefono;
  const waBtn = document.getElementById('det-wa-btn');
  const callBtn = document.getElementById('det-call-btn');
  const mailBtn = document.getElementById('det-mail-btn');
  waBtn.href = wa ? `https://wa.me/52${wa.replace(/\D/g,'')}` : '#';
  callBtn.href = c.telefono ? `tel:${c.telefono}` : '#';
  mailBtn.href = c.email ? `mailto:${c.email}` : '#';
  if (!wa) waBtn.style.opacity = '.4';
  if (!c.telefono) callBtn.style.opacity = '.4';
  if (!c.email) mailBtn.style.opacity = '.4';
  const rows = [];
  if (c.telefono) rows.push(['Teléfono', `<a href="tel:${c.telefono}">${c.telefono}</a>`]);
  if (c.wa)       rows.push(['WhatsApp', `<a href="https://wa.me/52${c.wa.replace(/\D/g,'')}" target="_blank">${c.wa}</a>`]);
  if (c.email)    rows.push(['Correo', `<a href="mailto:${c.email}">${c.email}</a>`]);
  const dir = domicilio(c);
  if (dir) rows.push(['Domicilio', dir]);
  rows.push(['Sexo', c.sexo === 'F' ? 'Femenino' : 'Masculino']);
  if (c.created_at) rows.push(['Agregado', new Date(c.created_at).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})]);

  let html = rows.map(([l,v]) => `<div class="det-row"><span class="det-lbl">${l}</span><span class="det-val">${v}</span></div>`).join('');
  if (c.notas) html += `<div style="margin-top:18px"><div class="det-lbl" style="margin-bottom:8px">Notas</div><div class="nota-box">${c.notas}</div></div>`;
  if (c.operaciones && c.operaciones.length) {
    html += `<div style="margin-top:22px"><div class="det-lbl" style="margin-bottom:10px">Historial</div>` +
      c.operaciones.map(op => `<div class="op-item"><div class="op-ico">${op.icono||'•'}</div><div><div class="op-desc">${op.desc}</div><div class="op-date">${op.fecha}</div></div></div>`).join('') +
      '</div>';
  }
  document.getElementById('det-body').innerHTML = html;
  document.getElementById('detail-ov').classList.add('open');
}

function cerrarDetalle() { document.getElementById('detail-ov').classList.remove('open'); detContacto = null; }

function editarDesdeDetalle() {
  if (!detContacto) return;
  cerrarDetalle();
  abrirModal(detContacto.id);
}

window.addEventListener('message', async (e) => {
  if (!e.data || e.data.tipo !== 'brokr_registrar_op') return;
  const c = _contactosMem.find(x => x.id === e.data.contacto_id);
  if (!c) return;
  if (!c.operaciones) c.operaciones = [];
  c.operaciones.unshift(e.data.op);
  c.updated_at = new Date().toISOString();
  try {
    await upsertRemoto(c);
    await cargarRemoto();
    renderLista();
  } catch (err) {
    console.error('No se pudo registrar la operación:', err);
  }
});

/* Carga inicial: primero pintamos cache local (si existe) para respuesta instantánea,
   luego refrescamos desde Supabase. Si no hay cache, mostramos un placeholder.
   Esperamos a que app-shell.js haya cargado y expuesto window.brokrSb. */
async function _waitForShell(maxMs) {
  const start = Date.now();
  while (!window.brokrSb && Date.now() - start < (maxMs || 5000)) {
    await new Promise(r => setTimeout(r, 50));
  }
  return !!window.brokrSb;
}

(async function init() {
  // 1) Cache offline para respuesta instantánea
  try {
    const cache = JSON.parse(localStorage.getItem(LS_CACHE) || '[]');
    if (Array.isArray(cache) && cache.length) {
      _contactosMem = cache;
      renderLista();
    } else {
      const lista = document.getElementById('lista');
      if (lista) lista.innerHTML = '<div class="empty"><strong>Cargando contactos…</strong></div>';
    }
  } catch {}

  // 2) Esperar al shell
  const ok = await _waitForShell(5000);
  if (!ok) {
    const lista = document.getElementById('lista');
    if (lista && !_contactosMem.length) {
      lista.innerHTML = '<div class="empty"><strong>Error al iniciar la app</strong><p>Recarga la página.</p></div>';
    }
    return;
  }

  // 3) Refrescar desde Supabase
  try {
    await cargarRemoto();
    renderLista();
  } catch (e) {
    const lista = document.getElementById('lista');
    if (lista && !_contactosMem.length) {
      lista.innerHTML = '<div class="empty"><strong>No se pudieron cargar tus contactos</strong><p>' + (e.message || 'Revisa tu conexión.') + '</p></div>';
    }
  }
})();
</script>

/* ══ EASYBROKER ══ */
function abrirImportEB() {
  document.getElementById('import-menu').classList.remove('open');
  document.getElementById('import-title').textContent = 'Importar de EasyBroker';
  document.getElementById('import-body').innerHTML = `
    <p style="font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:20px">
      Se importarán los contactos de tu cuenta de EasyBroker. Si ya existe alguno con el mismo teléfono o correo, se actualiza sin duplicar.
    </p>
    <div id="eb-progress" style="display:none" class="import-progress-wrap">
      <div id="eb-label" style="font-size:14px;font-weight:600;margin-bottom:4px">Importando…</div>

      <div id="eb-txt" style="font-size:11px;color:var(--mute)">Conectando…</div>
      <div class="import-log" id="eb-log"></div>
    </div>
    <button class="btn-primary" id="eb-start-btn" onclick="iniciarImportEB()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" style="margin-right:6px"><path stroke-linecap="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>

    </button>

async function iniciarImportEB() {
  document.getElementById('eb-start-btn').style.display = 'none';
  document.getElementById('eb-progress').style.display = 'block';
  const label = document.getElementById('eb-label');
  const bar   = document.getElementById('eb-bar');
  const txt   = document.getElementById('eb-txt');
  const log   = document.getElementById('eb-log');
  bar.style.width = '10%';

  try {
    const sb = _sb();
    const resp = await fetch(window.API_BASE + '/contactos/importar-eb', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sb.token }
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || 'Error ' + resp.status);
    }
    const d = await resp.json();
    bar.style.width = '100%';
    label.textContent = '✓ Listo';
    txt.textContent = `${d.importados + d.actualizados} de ${d.total} contactos procesados`;
    if (d.importados)  log.innerHTML += `<div class="import-log-line ok">✓ ${d.importados} nuevos importados</div>`;
    if (d.actualizados) log.innerHTML += `<div class="import-log-line ok">↻ ${d.actualizados} actualizados</div>`;
    if (d.omitidos)    log.innerHTML += `<div class="import-log-line skip">— ${d.omitidos} omitidos (sin datos)</div>`;
    if (d.errores)     log.innerHTML += `<div class="import-log-line err">✗ ${d.errores} con error</div>`;
    if (!d.total)      log.innerHTML  = '<div class="import-log-line skip">Sin contactos en EasyBroker.</div>';
    await cargarRemoto();
    renderLista();
    mostrarToast(`${d.importados + d.actualizados} contactos importados`);
  } catch (err) {
    bar.style.width = '100%'; bar.style.background = 'oklch(50% .18 30)';
    label.textContent = '✗ Error';
    txt.textContent = err.message || 'Error desconocido';
  }
}

      <strong>iPhone:</strong> Contactos → ··· → Exportar vCard<br>
      <strong>Android:</strong> Contactos → Configuración → Exportar → guardar .vcf
    </div>
    <button class="btn-primary" onclick="document.getElementById('vcf-file-input').click()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" style="margin-right:6px"><path stroke-linecap="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
      Seleccionar archivo .vcf
    </button>
    <div id="vcf-progress" style="display:none;margin-top:20px">
      <div id="vcf-label" style="font-size:14px;font-weight:600;margin-bottom:4px">Procesando…</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="vcf-bar"></div></div>
      <div id="vcf-txt" style="font-size:11px;color:var(--mute)">0 / 0</div>

function procesarVCF(input) {
  const file = input.files[0];
  input.value = '';
  if (file) procesarArchivoVCF(file);
}

function parseVCards(text) {
  const cards = [];
  const bloques = text.split(/(?=BEGIN:VCARD)/i).filter(b => /BEGIN:VCARD/i.test(b));
  for (const bloque of bloques) {
    const get = k => { const m = bloque.match(new RegExp(k + '[^:]*:(.+)', 'i')); return m ? m[1].trim() : ''; };
    const getAll = k => [...bloque.matchAll(new RegExp(k + '[^:]*:(.+)', 'gi'))].map(m => m[1].trim());
    const fn = get('FN');
    const n  = get('^N');
    let nombre = fn || (n ? n.split(';').filter(Boolean).reverse().join(' ').trim() : '');
    if (!nombre) continue;
    const tels  = getAll('TEL').map(t => t.replace(/[^+\d]/g, ''));
    const email = getAll('EMAIL')[0] || '';
    const tel   = tels[0] || '';
    if (!tel && !email) continue;
    cards.push({ nombre: nombre.slice(0,120), telefono: tel.slice(0,20), wa: tel.slice(0,20), email: email.slice(0,120), rol: 'otro' });
  }
  return cards;
}

async function procesarArchivoVCF(file) {
  // make sure the overlay is open and progress area exists
  const prog = document.getElementById('vcf-progress');
  if (!prog) return;
  prog.style.display = 'block';
  const label = document.getElementById('vcf-label');
  const bar   = document.getElementById('vcf-bar');
  const txt   = document.getElementById('vcf-txt');
  const log   = document.getElementById('vcf-log');
  bar.style.width = '5%'; bar.style.background = '';
  log.innerHTML = '';

  const text = await file.text();
  const contactos = parseVCards(text);

  if (!contactos.length) {
    label.textContent = '✗ Sin contactos válidos';
    txt.textContent = 'El archivo no tiene contactos con teléfono o correo.';
    return;
  }

  label.textContent = `Importando ${contactos.length} contactos…`;
  let ok = 0, dup = 0, err = 0;
  const uid = _sb().userId;

  for (let i = 0; i < contactos.length; i++) {
    const c = contactos[i];
    const existe = _contactosMem.find(x => (c.telefono && x.telefono === c.telefono) || (c.email && x.email === c.email));
    try {
      if (existe) {
        const patch = {};
        if (!existe.nombre && c.nombre) patch.nombre = c.nombre;
        if (!existe.telefono && c.telefono) patch.telefono = c.telefono;
        if (!existe.email && c.email) patch.email = c.email;
        if (Object.keys(patch).length) { patch.updated_at = new Date().toISOString(); await upsertRemoto(Object.assign({}, existe, patch)); }
        dup++;
      } else {
        await upsertRemoto({ ...c, id: crypto.randomUUID(), user_id: uid, created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
        ok++;
        log.innerHTML += `<div class="import-log-line ok">✓ ${c.nombre}</div>`;
        log.scrollTop = log.scrollHeight;
      }
    } catch(e) { err++; }
    bar.style.width = Math.round(((i+1)/contactos.length)*100) + '%';
    txt.textContent = `${i+1} / ${contactos.length}`;
    await new Promise(r => setTimeout(r, 20));
  }

  label.textContent = '✓ Listo';
  txt.textContent = `${ok} nuevos, ${dup} ya existían${err ? ', '+err+' con error' : ''}`;
  await cargarRemoto(); renderLista();
  mostrarToast(`${ok} contactos nuevos importados`);
}
</script>
